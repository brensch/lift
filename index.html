<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lift Workout Tracker</title>
  <link rel="stylesheet" href="/assets/lift-theme.css" />
  <style>
    .hero-card {
      width: min(640px, 100%);
      padding: 28px;
      text-align: center;
    }

    .hero-brand {
      font-size: clamp(3rem, 7vw, 4.6rem);
      font-weight: 900;
      letter-spacing: -0.06em;
      line-height: 1;
      margin: 0;
      font-family: "Space Grotesk", "Manrope", sans-serif;
    }

    .hero-copy {
      margin-top: 14px;
      font-size: 1.05rem;
      line-height: 1.5;
    }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 22px;
      flex-wrap: wrap;
    }

    .links {
      margin-top: 18px;
      font-size: 0.96rem;
    }
  </style>
</head>
<body class="center-page">
  <main class="card hero-card">
    <h1 class="hero-brand" data-wobbly="true" data-text="LIFT" data-seed="42" data-max-offset="2" data-max-rotate="0.1">LIFT</h1>
    <p class="hero-copy">Opening your session in Lift. If the app does not open, use the store link below.</p>
    <div class="actions">
      <a href="https://play.google.com/store/apps/details?id=com.brensch.lift" class="btn primary" id="download-btn">Download on Play Store</a>
      <a class="btn" href="/privacy">Privacy Policy</a>
      <a class="btn" href="/forget">Delete Account</a>
    </div>
    <p class="links">Need details? Review our <a class="inline-link" href="/privacy">privacy policy</a>.</p>
  </main>

  <script src="/assets/lift-wobble.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const joinId = urlParams.get('join');

    const androidUrl = "https://play.google.com/store/apps/details?id=com.brensch.lift";
    const iosUrl = "https://apps.apple.com/app/lift-workout-tracker/id6742123456";

    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

    const downloadBtn = document.getElementById('download-btn');
    if (isIOS) {
      downloadBtn.href = iosUrl;
      downloadBtn.innerText = "Download on App Store";
    } else {
      downloadBtn.href = androidUrl;
    }

    if (joinId) {
      const tempInput = document.createElement("input");
      tempInput.value = `lift-join:${joinId}`;
      document.body.appendChild(tempInput);
      tempInput.select();
      try {
        document.execCommand("copy");
      } catch (e) {}
      document.body.removeChild(tempInput);
    }

    setTimeout(() => {
      window.location.href = isIOS ? iosUrl : androidUrl;
    }, 2500);
  </script>
</body>
</html>
