[package]
name = "schlift"
version = "0.1.0"
edition = "2021"

[dependencies]
schlift-core = { path = "core" }
tonic = "0.12.3"
tonic-web = "0.12.3"
prost = "0.13.4"
tokio = { version = "1.42.0", features = ["macros", "rt-multi-thread"] }
futures-util = "0.3.31"
sqlx = { version = "0.8.2", features = ["runtime-tokio", "tls-native-tls", "sqlite"] }
uuid = { version = "1.11.0", features = ["v4", "fast-rng"] }
tower-http = { version = "0.6.2", features = ["cors"] }
axum = "0.7.9"
http = "1.2.0"
tokio-stream = "0.1.17"
webauthn-rs = { version = "0.5", features = ["conditional-ui"] }
serde_json = "1"
url = "2"
base64 = "0.22"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[features]
test-auth = []

[build-dependencies]
tonic-build = "0.12.3"

[workspace]
members = ["core", "app/native", "loadtest", "testkit"]
