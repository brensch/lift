[package]
name = "schlift"
version = "0.1.0"
edition = "2021"

[dependencies]
schlift-core = { path = "core" }
tonic = "0.14.9"
tonic-web = "0.14.9"
tonic-prost = "0.14.9"
prost = "0.14.6"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"] }
futures-util = "0.3.34"
sqlx = { version = "0.9.1", features = ["runtime-tokio", "sqlite"] }
uuid = { version = "1.29.3", features = ["v4", "fast-rng"] }
tower-http = { version = "0.7.1", features = ["cors"] }
axum = "0.8.9"
http = "1.5.0"
tokio-stream = "0.1.19"
webauthn-rs = { version = "0.6", features = ["conditional-ui"] }
serde_json = "1"
url = "2"
sha2 = "0.10"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
# The apps' own TLS listener (src/tls.rs): the certificate Caddy renews.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
# Fetching an assistant's client metadata document (src/mcp/cimd.rs): one
# GET over a connection to an address checked first, so no HTTP client
# that resolves names itself.
hyper = { version = "1", features = ["client", "http1"] }
http-body-util = "0.1"
webpki-roots = "1"
tower = { version = "0.5", features = ["util"] }
# The event log: each flush is one Parquet file (src/ledger).
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"] }
arrow-array = "60"
arrow-schema = "60"

[dev-dependencies]
# A software passkey, to run the WebAuthn ceremonies in tests.
webauthn-authenticator-rs = { version = "0.6", default-features = false, features = ["softpasskey"] }

[features]
test-auth = []

[build-dependencies]
tonic-prost-build = "0.14.9"

[workspace]
members = ["core", "app/native", "loadtest", "testkit"]

# The server's allocator: jemalloc gives freed memory back to the system
# (glibc's arenas kept a burst of workouts' memory, 4 GB, after it was
# freed).
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = "0.7"
