[package]
name = "schlift"
version = "0.1.0"
edition = "2021"

[dependencies]
tonic = "0.12.3"
tonic-web = "0.12.3"
prost = "0.13.4"
tokio = { version = "1.42.0", features = ["macros", "rt-multi-thread"] }
futures-util = "0.3.31"
sqlx = { version = "0.8.2", features = ["runtime-tokio", "tls-native-tls", "sqlite"] }
uuid = { version = "1.11.0", features = ["v4", "fast-rng", "macro-diagnostics"] }
tower-http = { version = "0.6.2", features = ["cors", "trace", "compression-full"] }
tower = { version = "0.5.1", features = ["util"] }
axum = "0.7.9"
http = "1.2.0"
chrono = "0.4.39"
log = "0.4.22"
dashmap = "6.1.0"
tokio-stream = { version = "0.1.17", features = ["sync"] }
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation", "conditional-ui"] }
webauthn-rs-proto = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
url = "2"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
base64 = "0.22"
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

[features]
test-auth = []

[build-dependencies]
tonic-build = "0.12.3"
