[package]
name = "schlift-testkit"
version = "0.1.0"
edition = "2021"
publish = false

# Synthetic training for tests and the load test: a seeded lifter that trains
# as a person does, through the phone's own store (schlift_native), so what
# it makes is what a phone would record.

[dependencies]
schlift-core = { path = "../core" }
schlift_native = { path = "../app/native" }
prost = "0.13.4"
rand = "0.8"

[dev-dependencies]
serde_json = "1"
zstd = "0.13"
