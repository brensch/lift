name: Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

# Jobs run in parallel; wall time is the slowest one (the fuzz harness).
# Rust, Flutter and web only run when their inputs changed, so a docs-only or
# release-notes-only change finishes in seconds.
#
# Every language is format-checked and linted, and all of it goes through
# scripts/lint.sh — the same command a person or an agent runs locally — with
# tool versions pinned (scripts/install_lint_tools.sh, FLUTTER_VERSION,
# BUF_VERSION, web/package.json). Anything unformatted or unlinted fails.

env:
  # dart format's output changes between SDK releases, so the version that
  # formats the code has to be the version that checks it. Bump this together
  # with the local SDK, and re-run `scripts/lint.sh fmt dart` when you do.
  FLUTTER_VERSION: "3.44.8"
  BUF_VERSION: "1.64.0"

jobs:
  # Store text is committed: release-notes/<version>.md (read by
  # store-promote.yml) and store/listing.yaml (read by store-assets.yml).
  # Catch a bad one here, not at upload time. Always runs.
  store-text:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check release notes (name, non-empty, Play's 500-char limit)
        run: python3 scripts/check_release_notes.py
      - name: Check store listing text (store/listing.yaml against both stores' limits)
        run: pip3 install --quiet pyyaml && python3 scripts/check_store_text.py
      - name: Check generated app copy is up to date (app/copy.yaml → app/lib/gen/copy.dart)
        run: python3 scripts/gen_copy.py --check
      - name: Notification sounds are mirrored to Android and iOS
        run: python3 scripts/sync_sounds.py --check

  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      flutter: ${{ steps.filter.outputs.flutter }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect what changed
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            rust:
              - 'src/**'
              - 'core/**'
              - 'app/native/**'
              - 'loadtest/**'
              - 'templates/library.yaml'
              - 'proto/**'
              - 'testdata/**'
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Makefile'
              - 'make/**'
              - '.github/workflows/tests.yml'
            flutter:
              - 'app/**'
              - 'core/**'
              - 'templates/library.yaml'
              - 'scripts/gen_copy.py'
              - 'scripts/sync_sounds.py'
              - 'scripts/lint.sh'
              - 'proto/**'
              - '.github/workflows/tests.yml'
            web:
              - 'web/**'
              - 'store/listing.yaml'
              - 'templates/library.yaml'
              - 'release-notes/**'
              - 'scripts/lint.sh'
              - '.github/workflows/tests.yml'

  # Python, shell, Kotlin, Swift and protobuf: no toolchain to set up beyond
  # the pinned binaries, so this always runs and takes well under a minute.
  lint:
    # The pinned linters are prebuilt binaries (swiftlint links libxml2.so.2,
    # which Ubuntu 26.04 no longer ships), so the OS is pinned with them.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pinned formatters and linters
        run: scripts/install_lint_tools.sh
      - name: Install buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          version: ${{ env.BUF_VERSION }}
      - name: Format check and lint (python, shell, kotlin, swift, proto)
        run: scripts/lint.sh check python shell kotlin swift proto
      # The Xcode project is committed and built as-is, so a Swift file that is
      # not registered in it is silently left out of the iOS/watchOS build.
      - name: Every Swift file is in the Xcode project
        run: python3 scripts/xcode_add_swift.py --check

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo (dev profile)
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rust-dev

      - name: Format check (cargo fmt) and lint (clippy, deny warnings)
        run: scripts/lint.sh check rust

      - name: Run Rust tests
        run: cargo test --workspace --all-targets

      # The dev-login build (make dev, make store-capture) compiles code
      # nothing else does, such as the demo seed; keep it building.
      - name: Check the test-auth build
        run: cargo check --bin schlift --features test-auth

  # Clients running the phone's core sign up with passkeys, train and sync
  # against a real server; every account must match the server's copy and
  # nothing may error. smoke trains; long gives each account a year of
  # history first, half of them only watching. Timing is not compared here
  # (shared runners are too noisy): that is make loadtest's baseline.
  load:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: smoke
            args: ""
          - profile: long
            args: "--clients 24"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo (release profile)
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rust-release

      - name: Load test (${{ matrix.profile }}, correctness)
        run: |
          cargo build --release -p schlift --bin schlift -p schlift-load
          ./target/release/schlift-load --profile ${{ matrix.profile }} ${{ matrix.args }}

  # Randomised API sequences through the core, checking state invariants
  # after every mutation and that every log replays to the same account.
  # Fixed seed so a failure is reproducible.
  # Release profile, so it gets its own cache.
  fuzz:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo (release profile)
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rust-release

      - name: Run API invariant harness
        run: make fuzz-api-ci

  flutter:
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Before any Dart tooling: without a package config the formatter picks
      # a different language version and a different style.
      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Format check (dart format) and lint (flutter analyze, infos fatal)
        run: scripts/lint.sh check dart

      # The Dart tests run the real core: the host build of app/native.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo (native)
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rust-native

      - name: Build the core for the host
        run: cargo build -p schlift_native

      - name: Run Flutter tests
        working-directory: app
        run: flutter test

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      # npm ci, not bun: it is what the production deploy runs, and it fails
      # when package-lock.json has drifted from package.json.
      - name: Install dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Format check (prettier), lint (eslint) and typecheck (tsc)
        run: scripts/lint.sh check web

      - name: Build
        working-directory: web
        run: npm run build

  # The e2e scenarios: the real app against a real backend. Built once into
  # one Linux binary (every scenario in it), then the same binary runs in
  # six jobs at once, each a share of the scenarios side by side on
  # Xvfb (scripts/run_e2e.sh; docs/testing/e2e-scenarios.md). The report job
  # merges every shard's screenshots and logs into one report.html.
  e2e-build:
    needs: changes
    if: needs.changes.outputs.flutter == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install the Linux build tools
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo (e2e)
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: rust-e2e

      - name: Build the backend (dev login)
        run: cargo build --bin schlift --features test-auth

      - name: Build every scenario into one binary
        run: |
          (cd app && flutter pub get)
          scripts/run_e2e.sh --build-only

      - name: Upload the binaries
        uses: actions/upload-artifact@v4
        with:
          name: e2e-binaries
          path: |
            app/build/linux/x64/debug/bundle
            target/debug/schlift
          retention-days: 1

  e2e:
    needs: e2e-build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The app draws with OpenGL: Mesa's EGL, GLES and software drivers.
      - name: Install Xvfb and the app's runtime libraries
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libegl1 libgles2 libgl1-mesa-dri

      - name: Download the binaries
        uses: actions/download-artifact@v4
        with:
          name: e2e-binaries

      - name: Start the backend
        run: |
          chmod +x target/debug/schlift app/build/linux/x64/debug/bundle/schlift
          mkdir -p .tmp/e2e-backend
          DATA_DIR=.tmp/e2e-backend RUST_LOG=warn \
            WEBAUTHN_RP_ID=localhost WEBAUTHN_RP_ORIGIN=http://localhost:5173 \
            target/debug/schlift > .tmp/e2e-backend.log 2>&1 &
          for _ in $(seq 60); do curl -fsS http://127.0.0.1:50051/api/health && exit 0; sleep 1; done
          cat .tmp/e2e-backend.log; exit 1

      - name: Run this shard's scenarios
        run: scripts/run_e2e.sh --no-build --shard ${{ matrix.shard }}/6

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: |
            app/test_screenshots/*.png
            app/test_screenshots/*.log
          retention-days: 7

  e2e-report:
    needs: e2e
    if: always() && needs.e2e.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download every shard
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-shard-*
          path: app/test_screenshots
          merge-multiple: true

      - name: Build the report
        run: python3 scripts/build_e2e_report.py

      - name: Upload the report
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: app/test_screenshots/report.html
          retention-days: 14
