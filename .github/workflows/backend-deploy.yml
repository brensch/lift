name: Backend Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  build-backend:
    # The server is the Oracle box (aarch64, Ubuntu 26.04: glibc and OpenSSL 3 newer than 24.04's).
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # The release build is ~2 min from cold; with the cache a merge that
      # touches no Rust rebuilds almost nothing.
      - name: Cache cargo (release profile)
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          prefix-key: deploy-release

      - name: Build backend release binary
        run: cargo build --release --bin schlift

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check web frontend
        run: cd web && npm ci && npm run check

      - name: Package backend artifact
        run: |
          mkdir -p dist
          cp target/release/schlift dist/schlift
          chmod 755 dist/schlift
          (cd dist && sha256sum schlift > schlift.sha256)
          # The box applies this Caddyfile (validated, graceful reload) when it changed.
          cp deploy/Caddyfile dist/Caddyfile
          printf '%s\n' "${GITHUB_SHA}" > dist/release.txt

      - name: Upload backend artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-linux-arm64
          path: dist/
          if-no-files-found: error

      - name: Upload web artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-dist
          path: web/dist/
          if-no-files-found: error

  # The box pulls the build itself (deploy/puller): no runner on it, nothing on
  # GitHub can run a command there. This job records the deployment and waits for
  # the box's verdict, so a failed deploy fails this run.
  deploy-backend:
    needs: build-backend
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Deploy (the box pulls it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/request_deploy.sh production "${GITHUB_SHA}" backend-linux-arm64 web-dist
