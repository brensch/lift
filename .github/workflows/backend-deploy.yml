name: Backend Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  build-backend:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend release binary
        run: cargo build --release --bin schlift

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check web frontend
        run: cd web && npm ci && npm run check

      - name: Package backend artifact
        run: |
          mkdir -p dist
          cp target/release/schlift dist/schlift
          chmod 755 dist/schlift
          printf '%s\n' "${GITHUB_SHA}" > dist/release.txt

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-linux-arm64
          path: dist/
          if-no-files-found: error

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          if-no-files-found: error

  deploy-backend:
    needs: build-backend
    runs-on:
      - self-hosted
      - linux
      - ARM64
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync repo to stable deploy path
        run: |
          sudo mkdir -p /opt/repo-schlift-current
          sudo rsync -a --delete --exclude .git ./ /opt/repo-schlift-current/

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-linux-arm64
          path: dist/backend-linux-arm64

      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/web-dist

      - name: Install systemd unit
        run: sudo /opt/repo-schlift-current/scripts/install_schlift_service.sh

      - name: Apply Caddy config
        run: sudo WRITE_ENV=0 /opt/repo-schlift-current/deploy/setup-prod-env.sh

      - name: Deploy release
        run: |
          ARTIFACT_DIR="${PWD}/dist/backend-linux-arm64" \
          WEB_DIR="${PWD}/dist/web-dist" \
          RELEASE_ID="${GITHUB_SHA}" \
          sudo --preserve-env=ARTIFACT_DIR,WEB_DIR,RELEASE_ID \
            /opt/repo-schlift-current/scripts/deploy_schlift_release.sh

      - name: Show deployed status
        run: |
          sudo systemctl status --no-pager schlift.service
          sudo journalctl -u schlift.service -n 50 --no-pager
