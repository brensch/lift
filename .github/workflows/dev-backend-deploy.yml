name: Dev Backend Deploy

# Deploys a second schlift instance (dev.schlift.com) onto the same box as prod,
# built from whatever branch you dispatch this on — so you can dogfood WIP
# server code without touching production. Prod (schlift.com / :50051 /
# /opt/schlift) is never modified; the dev instance lives at :50052 /
# /opt/schlift-dev with its own DB.
#
# Triggers:
#   - push a `dev-*` tag: deploys that commit (pairs with android-dev-release.yml
#     so the phone build and the backend it talks to come from one tagged commit)
#   - workflow_dispatch: deploy any branch's WIP without cutting a tag
on:
  workflow_dispatch:
  push:
    tags:
      - "dev-*"

concurrency:
  group: backend-dev
  cancel-in-progress: false

jobs:
  build-backend:
    # The server is the Google box (x86_64, Debian 13: glibc and OpenSSL 3 newer than 24.04's).
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend release binary
        run: cargo build --release --bin schlift

      # The website of the same commit, served at dev.schlift.com: pages that
      # go with the backend (/recover, /admin) are there to try before main.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web frontend
        run: cd web && npm ci && npm run build

      - name: Package backend artifact
        run: |
          mkdir -p dist
          cp target/release/schlift dist/schlift
          chmod 755 dist/schlift
          cp -r web/dist dist/web
          (cd dist && sha256sum schlift > schlift.sha256)
          printf '%s\n' "${GITHUB_SHA}" > dist/release.txt

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-backend-linux-amd64
          path: dist/
          if-no-files-found: error

  # The box pulls the build itself (deploy/puller); this job records the
  # deployment and waits for the box's verdict.
  deploy-backend:
    needs: build-backend
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy (the box pulls it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release id = the tag when tag-triggered, else dev-<sha> for a branch.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            RID="${GITHUB_REF_NAME}"
          else
            RID="dev-${GITHUB_SHA}"
          fi
          scripts/request_deploy.sh dev "${RID}" dev-backend-linux-amd64
