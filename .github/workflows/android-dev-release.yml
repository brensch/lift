name: Android Dev Release

# Side-by-side dev build for dogfooding on a real phone. Distinct applicationId
# (com.brensch.schlift.dev, "Schlift Dev" in the launcher) so it installs
# alongside the prod app, signed with the same key, compiled to talk to the dev
# backend (dev.schlift.com). Published as a signed APK hosted at
# https://dev.schlift.com/schlift-dev.apk — open that on your phone to install.
#
# Not a Play upload: a different applicationId is a different Play app, and the
# whole point here is running dev + prod at once. Passkeys still work because the
# dev backend's assetlinks lists the .dev package (ANDROID_PACKAGE_NAMES).
#
# Triggers, mirroring the prod v* model:
#   - push a `dev-*` tag (also deploys the dev backend from the same commit)
#   - workflow_dispatch (no-tag fallback)
on:
  workflow_dispatch:
  push:
    tags:
      - "dev-*"

concurrency:
  group: android-dev-release
  cancel-in-progress: true

jobs:
  build-dev-apk:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:stable
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('app/android/**/*.gradle*', 'app/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Prepare signing files
        working-directory: app/android
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
          cat > key.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=$RELEASE_KEYSTORE_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          keyPassword=$RELEASE_KEY_PASSWORD
          EOF

      - name: Resolve dev version
        working-directory: app
        run: |
          # gradle appends versionNameSuffix "-dev" (SCHLIFT_DEV=1), so the base
          # name stays plain here. versionCode is offset far from prod (1000+run)
          # and wear (~1,001,000+) so an in-place upgrade never goes backwards.
          CODE=$((500000 + GITHUB_RUN_NUMBER))
          sed -i -E "s|^version:.*|version: 0.0.0+${CODE}|" pubspec.yaml
          grep -E '^version:' pubspec.yaml

      - name: Build signed dev APK (com.brensch.schlift.dev)
        working-directory: app
        env:
          SCHLIFT_DEV: "1"
        run: |
          flutter build apk --release \
            --dart-define=GIT_HASH=$(git rev-parse --short HEAD) \
            --dart-define=SERVER_HOST=dev.schlift.com \
            --dart-define=SERVER_PORT=443
          cp build/app/outputs/flutter-apk/app-release.apk "${GITHUB_WORKSPACE}/schlift-dev.apk"

      - name: Print APK signing cert (for assetlinks cross-check)
        working-directory: app
        run: |
          # The installed APK's SHA-256 must appear in dev's assetlinks or passkeys
          # fail. Log it so babysitting can verify against dev.schlift.com.
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk | grep -i "SHA-256" || true

      - name: Upload dev APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: schlift-dev-apk
          path: schlift-dev.apk
          if-no-files-found: error

  publish-dev-apk:
    needs: build-dev-apk
    runs-on:
      - self-hosted
      - linux
      - ARM64
    permissions:
      contents: read
    steps:
      - name: Download dev APK artifact
        uses: actions/download-artifact@v4
        with:
          name: schlift-dev-apk
          path: dist

      - name: Host APK at dev.schlift.com/schlift-dev.apk
        run: |
          # /opt/schlift/web is the shared static root Caddy serves for both
          # hosts; dropping the APK there makes it reachable at
          # https://dev.schlift.com/schlift-dev.apk with no auth. `install` is
          # already whitelisted for the runner's sudo.
          sudo install -m 0644 dist/schlift-dev.apk /opt/schlift/web/schlift-dev.apk
          echo "published https://dev.schlift.com/schlift-dev.apk"
