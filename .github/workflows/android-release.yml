name: Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - "release"

jobs:
  build-android-release:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:stable
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Google Play upload dependencies
        run: |
          apt-get update -qq && apt-get install -y -qq python3-pip
          pip3 install --break-system-packages google-api-python-client google-auth

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Prepare signing files
        working-directory: app/android
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
          cat > key.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=$RELEASE_KEYSTORE_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          keyPassword=$RELEASE_KEY_PASSWORD
          EOF

      - name: Validate Google Play credentials
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing secret: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
            echo "Create a Google Cloud service account JSON key with Play Console app permissions."
            exit 1
          fi

      - name: Build phone app bundle (.aab)
        working-directory: app
        run: flutter build appbundle --release --dart-define=GIT_HASH=$(git rev-parse --short HEAD)

      - name: Build wear app bundle (.aab)
        working-directory: app/android
        run: ./gradlew :wear:bundleRelease

      - name: Upload phone release artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-app-release-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload wear release artifact
        uses: actions/upload-artifact@v4
        with:
          name: wear-app-release-aab
          path: app/build/wear/outputs/bundle/release/wear-release.aab
          if-no-files-found: error

      - name: Upload bundles to Google Play testing tracks
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          scripts/upload_google_play.py \
            --package-name com.brensch.schlift \
            --status completed \
            --phone-aab app/build/app/outputs/bundle/release/app-release.aab \
            --phone-release-name "${GITHUB_REF_NAME}-${GITHUB_RUN_NUMBER}-phone" \
            --phone-tracks internal alpha beta \
            --wear-aab app/build/wear/outputs/bundle/release/wear-release.aab \
            --wear-release-name "${GITHUB_REF_NAME}-${GITHUB_RUN_NUMBER}-wear" \
            --wear-tracks "wear:internal" "wear:alpha" "wear:beta watch" \
            --changes-not-sent-for-review
