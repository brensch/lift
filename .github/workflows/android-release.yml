name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Prepare signing files
        working-directory: app/android
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_KEYSTORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
          cat > key.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=$RELEASE_KEYSTORE_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          keyPassword=$RELEASE_KEY_PASSWORD
          EOF

      - name: Build phone app bundle (.aab)
        working-directory: app
        run: flutter build appbundle --release

      - name: Build wear app bundle (.aab)
        working-directory: app/android
        run: ./gradlew :wear:bundleRelease

      - name: Upload phone release artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-app-release-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload wear release artifact
        uses: actions/upload-artifact@v4
        with:
          name: wear-app-release-aab
          path: app/android/wear/build/outputs/bundle/release/wear-release.aab
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/app/outputs/bundle/release/app-release.aab
            app/android/wear/build/outputs/bundle/release/wear-release.aab
