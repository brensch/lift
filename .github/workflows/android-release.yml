name: Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Prepare signing files
        working-directory: app/android
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
          cat > key.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=$RELEASE_KEYSTORE_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          keyPassword=$RELEASE_KEY_PASSWORD
          EOF

      - name: Validate signing config (fast fail)
        working-directory: app/android
        run: ./gradlew :app:validateSigningRelease :wear:validateSigningRelease --no-daemon

      - name: Build phone app bundle (.aab)
        working-directory: app
        run: flutter build appbundle --release

      - name: Build wear app bundle (.aab)
        working-directory: app/android
        run: ./gradlew :wear:bundleRelease

      - name: Upload phone release artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-app-release-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload wear release artifact
        uses: actions/upload-artifact@v4
        with:
          name: wear-app-release-aab
          path: app/build/wear/outputs/bundle/release/wear-release.aab
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-main-${{ github.run_id }}
          target_commitish: ${{ github.sha }}
          name: Android Release ${{ github.run_number }}
          generate_release_notes: true
          files: |
            app/build/app/outputs/bundle/release/app-release.aab
            app/build/wear/outputs/bundle/release/wear-release.aab
