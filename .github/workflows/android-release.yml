name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  # Keep equal to FLUTTER_VERSION in .github/workflows/tests.yml.
  FLUTTER_VERSION: "3.50.1"

jobs:
  build-android-release:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:stable
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The container's Flutter is whatever cirruslabs calls stable, and it
      # lags (its newest is 3.44, Dart 3.12; google_fonts 9 needs Dart 3.13).
      # Install the pinned one over it, like tests.yml and ios-build.yml.
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Cache Gradle dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('app/android/**/*.gradle*', 'app/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Install Google Play upload dependencies
        run: |
          apt-get update -qq && apt-get install -y -qq python3-pip
          pip3 install --break-system-packages httplib2 google-api-python-client google-auth google-auth-httplib2

      # The app links the Rust core (app/native; cargokit builds it for each
      # Android target): Rust, and protoc for the core's protos.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Install Protoc
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Prepare signing files
        working-directory: app/android
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
          cat > key.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=$RELEASE_KEYSTORE_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          keyPassword=$RELEASE_KEY_PASSWORD
          EOF

      - name: Validate Google Play credentials
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing secret: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
            echo "Create a Google Cloud service account JSON key with Play Console app permissions."
            exit 1
          fi

      - name: Resolve version from tag + run number
        working-directory: app
        run: |
          # Version NAME comes from the release tag (v0.9.6 -> 0.9.6); dispatch /
          # non-tag runs get a dev placeholder. Build CODE is a stateless,
          # monotonic versionCode so Play never rejects a duplicate. Kept small
          # because the wear module derives its code as base*1000+1
          # (app/android/wear/build.gradle.kts), which must stay under the 2.1B int cap.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            NAME="${GITHUB_REF_NAME#v}"
            # The tag name flows into sed and release names below; a tag is a
            # ref, not a trusted literal, so refuse anything but a plain version.
            if ! [[ "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tag must look like v0.9.6, got '$GITHUB_REF_NAME'"; exit 1
            fi
          else
            NAME="0.0.0-dev"
          fi
          CODE=$((1000 + GITHUB_RUN_NUMBER))
          # Rewrite pubspec so both the phone build and the separate wear gradle
          # build (which reads flutter.versionName/Code from local.properties,
          # regenerated from pubspec) pick up the same version.
          sed -i -E "s|^version:.*|version: ${NAME}+${CODE}|" pubspec.yaml
          echo "phone version=${NAME}+${CODE}, wear versionCode=$((CODE * 1000 + 1))"
          grep -E '^version:' pubspec.yaml

      - name: Build phone app bundle (.aab)
        working-directory: app
        run: flutter build appbundle --release --dart-define=GIT_HASH=$(git rev-parse --short HEAD)

      - name: Build wear app bundle (.aab)
        working-directory: app/android
        run: ./gradlew :wear:bundleRelease

      - name: Upload phone release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phone-app-release-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload wear release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wear-app-release-aab
          path: app/build/wear/outputs/bundle/release/wear-release.aab
          if-no-files-found: error

      - name: Upload bundles to Google Play testing tracks
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          scripts/upload_google_play.py \
            --package-name com.brensch.schlift \
            --status completed \
            --phone-aab app/build/app/outputs/bundle/release/app-release.aab \
            --phone-release-name "${GITHUB_REF_NAME}-${GITHUB_RUN_NUMBER}-phone" \
            --phone-tracks internal alpha beta \
            --wear-aab app/build/wear/outputs/bundle/release/wear-release.aab \
            --wear-release-name "${GITHUB_REF_NAME}-${GITHUB_RUN_NUMBER}-wear" \
            --wear-tracks "wear:internal" "wear:beta watch"
