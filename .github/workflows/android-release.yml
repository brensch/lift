name: Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - "release"

jobs:
  build-android-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Prepare signing files
        working-directory: app/android
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=0
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
          cat > key.properties <<EOF
          storeFile=release-keystore.jks
          storePassword=$RELEASE_KEYSTORE_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          keyPassword=$RELEASE_KEY_PASSWORD
          EOF

      - name: Validate signing config (fast fail)
        working-directory: app/android
        run: ./gradlew :app:validateSigningRelease :wear:validateSigningRelease --no-daemon

      - name: Validate Google Play credentials
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "Missing secret: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
            echo "Create a Google Cloud service account JSON key with Play Console app permissions."
            exit 1
          fi

      - name: Build phone app bundle (.aab)
        working-directory: app
        run: flutter build appbundle --release

      - name: Build wear app bundle (.aab)
        working-directory: app/android
        run: ./gradlew :wear:bundleRelease

      - name: Upload phone release artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-app-release-aab
          path: app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload wear release artifact
        uses: actions/upload-artifact@v4
        with:
          name: wear-app-release-aab
          path: app/build/wear/outputs/bundle/release/wear-release.aab
          if-no-files-found: error

      - name: Upload phone bundle to Google Play testing tracks
        uses: r0adkll/upload-google-play@41571de6d8a402a9565f0fc067d3ecc5f235a4c9
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.brensch.schlift
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          tracks: "internal,beta"
          status: completed
          releaseName: ${{ github.ref_name }}-${{ github.run_number }}-phone

      - name: Upload wear bundle to Google Play Wear OS testing tracks
        uses: r0adkll/upload-google-play@41571de6d8a402a9565f0fc067d3ecc5f235a4c9
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.brensch.schlift
          releaseFiles: app/build/wear/outputs/bundle/release/wear-release.aab
          tracks: "wear:internal,wear:beta watch"
          status: completed
          releaseName: ${{ github.ref_name }}-${{ github.run_number }}-wear
