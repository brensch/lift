name: iOS Release

on:
  workflow_dispatch:
  push:
    branches:
      - "release"

jobs:
  build-ios-release:
    runs-on: macos-26
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
      IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
      IOS_APP_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_APP_PROVISION_PROFILE_BASE64 }}
      IOS_WATCH_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_WATCH_PROVISION_PROFILE_BASE64 }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Xcode SDK
        run: |
          xcodebuild -version
          ios_sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          watch_sdk="$(xcrun --sdk watchos --show-sdk-version)"
          echo "iOS SDK: $ios_sdk"
          echo "watchOS SDK: $watch_sdk"
          case "$ios_sdk" in
            26.*) ;;
            *)
              echo "Expected iOS 26 SDK or later, got $ios_sdk"
              exit 1
              ;;
          esac

      - name: Decide signing mode
        id: signing-mode
        run: |
          signing_ready=true
          for name in APPLE_TEAM_ID IOS_CERT_P12_BASE64 IOS_CERT_PASSWORD IOS_APP_PROVISION_PROFILE_BASE64 IOS_WATCH_PROVISION_PROFILE_BASE64; do
            if [ -z "${!name}" ]; then
              echo "Missing signing secret: $name"
              signing_ready=false
            fi
          done
          echo "enabled=$signing_ready" >> "$GITHUB_OUTPUT"
          if [ "$signing_ready" = false ]; then
            echo "Proceeding with unsigned iOS build."
          fi

      - name: Decide App Store Connect upload mode
        id: app-store-connect-mode
        run: |
          upload_ready=true
          for name in APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_PRIVATE_KEY_BASE64; do
            if [ -z "${!name}" ]; then
              echo "Missing App Store Connect secret: $name"
              upload_ready=false
            fi
          done
          echo "enabled=$upload_ready" >> "$GITHUB_OUTPUT"

      - name: Install iOS build tools
        run: brew install buf swift-protobuf

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Import signing certificate and provisioning profiles
        if: steps.signing-mode.outputs.enabled == 'true'
        env:
          IOS_CERT_P12_BASE64: ${{ env.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ env.IOS_CERT_PASSWORD }}
          IOS_APP_PROVISION_PROFILE_BASE64: ${{ env.IOS_APP_PROVISION_PROFILE_BASE64 }}
          IOS_WATCH_PROVISION_PROFILE_BASE64: ${{ env.IOS_WATCH_PROVISION_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/dist.p12"
          APP_PROFILE_PATH="$RUNNER_TEMP/app.mobileprovision"
          WATCH_PROFILE_PATH="$RUNNER_TEMP/watch.mobileprovision"
          APP_PROFILE_PLIST="$RUNNER_TEMP/app-profile.plist"
          WATCH_PROFILE_PLIST="$RUNNER_TEMP/watch-profile.plist"
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"

          echo "$IOS_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$IOS_APP_PROVISION_PROFILE_BASE64" | base64 --decode > "$APP_PROFILE_PATH"
          echo "$IOS_WATCH_PROVISION_PROFILE_BASE64" | base64 --decode > "$WATCH_PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p "$PROFILE_DIR"
          security cms -D -i "$APP_PROFILE_PATH" > "$APP_PROFILE_PLIST"
          security cms -D -i "$WATCH_PROFILE_PATH" > "$WATCH_PROFILE_PLIST"

          APP_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$APP_PROFILE_PLIST")
          APP_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$APP_PROFILE_PLIST")
          WATCH_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$WATCH_PROFILE_PLIST")
          WATCH_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$WATCH_PROFILE_PLIST")

          cp "$APP_PROFILE_PATH" "$PROFILE_DIR/$APP_PROFILE_UUID.mobileprovision"
          cp "$WATCH_PROFILE_PATH" "$PROFILE_DIR/$WATCH_PROFILE_UUID.mobileprovision"

          {
            echo "APPLE_KEYCHAIN_PATH=$KEYCHAIN_PATH"
            echo "APPLE_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD"
            echo "IOS_APP_PROFILE_NAME=$APP_PROFILE_NAME"
            echo "IOS_WATCH_PROFILE_NAME=$WATCH_PROFILE_NAME"
          } >> "$GITHUB_ENV"

          echo "App provisioning profile entitlements:"
          /usr/libexec/PlistBuddy -c "Print :Entitlements" "$APP_PROFILE_PLIST"

          if ! /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$APP_PROFILE_PLIST" | grep -Fx "${APPLE_TEAM_ID}.com.brensch.schlift"; then
            echo "Provisioning profile application-identifier does not match ${APPLE_TEAM_ID}.com.brensch.schlift"
            exit 1
          fi

          if ! /usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.associated-domains" "$APP_PROFILE_PLIST" >/dev/null 2>&1; then
            echo "Provisioning profile is missing com.apple.developer.associated-domains."
            echo "Enable Associated Domains for App ID com.brensch.schlift in Apple Developer, then regenerate the App Store provisioning profile and update IOS_APP_PROVISION_PROFILE_BASE64."
            exit 1
          fi

      - name: Generate Swift protobuf files
        run: make proto-swift

      - name: Verify checked-in Xcode capabilities
        if: steps.signing-mode.outputs.enabled == 'true'
        working-directory: app/ios
        run: |
          set -euo pipefail
          grep -n "SystemCapabilities = {" Runner.xcodeproj/project.pbxproj
          grep -n "com.apple.SafariKeychain = {" Runner.xcodeproj/project.pbxproj
          grep -n "com.apple.HealthKit = {" Runner.xcodeproj/project.pbxproj

      - name: Install CocoaPods dependencies
        working-directory: app/ios
        run: pod install

      - name: Prepare CI export options
        if: steps.signing-mode.outputs.enabled == 'true'
        working-directory: app/ios
        env:
          APPLE_TEAM_ID: ${{ env.APPLE_TEAM_ID }}
          IOS_APP_PROFILE_NAME: ${{ env.IOS_APP_PROFILE_NAME }}
          IOS_WATCH_PROFILE_NAME: ${{ env.IOS_WATCH_PROFILE_NAME }}
        run: |
          cp ExportOptions.plist ExportOptions.ci.plist
          /usr/libexec/PlistBuddy -c "Set :teamID $APPLE_TEAM_ID" ExportOptions.ci.plist
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:com.brensch.schlift $IOS_APP_PROFILE_NAME" ExportOptions.ci.plist
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:com.brensch.schlift.watchkitapp $IOS_WATCH_PROFILE_NAME" ExportOptions.ci.plist

      - name: Verify iOS signing build settings
        if: steps.signing-mode.outputs.enabled == 'true'
        working-directory: app
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -showBuildSettings > "$RUNNER_TEMP/runner-build-settings.txt"
          grep -E "^[[:space:]]*CODE_SIGN_ENTITLEMENTS = (ios/)?Runner/Runner.entitlements$" "$RUNNER_TEMP/runner-build-settings.txt"
          grep -E "^[[:space:]]*PRODUCT_BUNDLE_IDENTIFIER = com\\.brensch\\.schlift$" "$RUNNER_TEMP/runner-build-settings.txt"

      - name: Archive iOS app
        if: steps.signing-mode.outputs.enabled == 'true'
        working-directory: app
        env:
          APPLE_TEAM_ID: ${{ env.APPLE_TEAM_ID }}
          IOS_APP_PROFILE_NAME: ${{ env.IOS_APP_PROFILE_NAME }}
          IOS_WATCH_PROFILE_NAME: ${{ env.IOS_WATCH_PROFILE_NAME }}
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/ios/archive/Runner.xcarchive \
            APPLE_TEAM_ID="$APPLE_TEAM_ID" \
            IOS_APP_PROFILE_NAME="$IOS_APP_PROFILE_NAME" \
            IOS_WATCH_PROFILE_NAME="$IOS_WATCH_PROFILE_NAME"

      - name: Verify archived iOS entitlements
        if: steps.signing-mode.outputs.enabled == 'true'
        working-directory: app
        env:
          APPLE_TEAM_ID: ${{ env.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP_PATH="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          ENTITLEMENTS_PLIST="$RUNNER_TEMP/runner-entitlements.plist"
          PROFILE_PLIST="$RUNNER_TEMP/runner-embedded-profile.plist"

          if [ ! -d "$APP_PATH" ]; then
            echo "Archived app not found at $APP_PATH"
            exit 1
          fi

          codesign -d --entitlements :- "$APP_PATH" > "$ENTITLEMENTS_PLIST"
          security cms -D -i "$APP_PATH/embedded.mobileprovision" > "$PROFILE_PLIST"

          echo "Archived app entitlements:"
          /usr/libexec/PlistBuddy -c "Print" "$ENTITLEMENTS_PLIST"

          /usr/libexec/PlistBuddy -c "Print :com.apple.developer.associated-domains:0" "$ENTITLEMENTS_PLIST" | grep -Fx "webcredentials:schlift.com"
          /usr/libexec/PlistBuddy -c "Print :application-identifier" "$ENTITLEMENTS_PLIST" | grep -Fx "${APPLE_TEAM_ID}.com.brensch.schlift"
          /usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$PROFILE_PLIST" | grep -Fx "${APPLE_TEAM_ID}.com.brensch.schlift"

          echo "Embedded provisioning profile entitlements:"
          /usr/libexec/PlistBuddy -c "Print :Entitlements" "$PROFILE_PLIST"

      - name: Export IPA
        if: steps.signing-mode.outputs.enabled == 'true'
        working-directory: app
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.ci.plist

      - name: Upload IPA artifact
        if: steps.signing-mode.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: app/build/ios/ipa/*.ipa
          if-no-files-found: error

      - name: Install App Store Connect API key
        if: steps.signing-mode.outputs.enabled == 'true' && steps.app-store-connect-mode.outputs.enabled == 'true'
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ env.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ env.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"

      - name: Upload IPA to App Store Connect
        if: steps.signing-mode.outputs.enabled == 'true' && steps.app-store-connect-mode.outputs.enabled == 'true'
        working-directory: app
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ env.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ env.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA_PATH="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA found under build/ios/ipa"
            exit 1
          fi
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Build unsigned iOS app
        if: steps.signing-mode.outputs.enabled != 'true'
        working-directory: app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned iOS app
        if: steps.signing-mode.outputs.enabled != 'true'
        working-directory: app
        run: |
          mkdir -p build/ios/unsigned-artifact
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/ios/unsigned-artifact/Runner.app.zip

      - name: Upload unsigned iOS artifact
        if: steps.signing-mode.outputs.enabled != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-unsigned-app
          path: app/build/ios/unsigned-artifact/Runner.app.zip
          if-no-files-found: error
