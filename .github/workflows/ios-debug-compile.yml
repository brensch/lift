name: iOS Debug Compile

on:
  workflow_dispatch:
    inputs:
      open_tmate:
        description: "Open a tmate SSH session after setup"
        required: true
        type: boolean
        default: false
      build_runner:
        description: "Also compile the iOS Runner scheme"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  ios-debug-compile:
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Xcode SDK
        run: |
          xcodebuild -version
          ios_sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          watch_sdk="$(xcrun --sdk watchos --show-sdk-version)"
          echo "iOS SDK: $ios_sdk"
          echo "watchOS SDK: $watch_sdk"
          case "$ios_sdk" in
            26.*) ;;
            *)
              echo "Expected iOS 26 SDK or later, got $ios_sdk"
              exit 1
              ;;
          esac

      - name: Install iOS build tools
        run: brew install buf swift-protobuf

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate Swift protobuf files
        run: make proto-swift

      - name: Install CocoaPods dependencies
        working-directory: app/ios
        run: pod install

      - name: Open tmate SSH session
        if: ${{ inputs.open_tmate }}
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 60

      - name: Compile watch app without signing
        working-directory: app/ios
        run: |
          xcodebuild build \
            -workspace Runner.xcworkspace \
            -scheme SchliftWatch \
            -destination "generic/platform=watchOS" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      - name: Compile iOS app without signing
        if: ${{ inputs.build_runner }}
        working-directory: app/ios
        run: |
          xcodebuild build \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -destination "generic/platform=iOS" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
