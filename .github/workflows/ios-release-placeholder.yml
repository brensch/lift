name: iOS Release Placeholder

on:
  workflow_dispatch:
  push:
    branches:
      - "ios-release/**"
    tags:
      - "ios-v*"

jobs:
  ios-placeholder:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Build iOS app for simulator (debug, no signing)
        working-directory: app
        run: flutter build ios --debug --simulator

      - name: Check signing secrets
        id: signing-check
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in IOS_CERT_P12_BASE64 IOS_CERT_PASSWORD IOS_PROVISION_PROFILE_BASE64 APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build signed IPA placeholder
        if: steps.signing-check.outputs.ready == 'true'
        run: |
          echo "Signing secrets are present."
          echo "Add keychain import + xcodebuild archive/export steps here when ready."

      - name: Signing setup required
        if: steps.signing-check.outputs.ready != 'true'
        run: |
          echo "iOS signing secrets are not configured yet."
          echo "Set IOS_CERT_P12_BASE64, IOS_CERT_PASSWORD, IOS_PROVISION_PROFILE_BASE64, APPLE_TEAM_ID."
