[package]
name = "schlift-load"
version = "0.1.0"
edition = "2021"
publish = false

# Load test: lightweight clients that run the phone's own core (schlift_native)
# against a real server. See docs/testing/load.md.

# `make seed-workouts`: test workouts for an account on a dev backend.
[[bin]]
name = "seed"
path = "src/seed.rs"

# `seed-population`: a million accounts written into a throwaway server's
# data directory, for `schlift-population`.
[[bin]]
name = "seed-population"
path = "src/population_seed.rs"

# `schlift-population`: the idle apps of a population test.
[[bin]]
name = "schlift-population"
path = "src/population.rs"

[dependencies]
schlift = { path = ".." }
schlift-core = { path = "../core" }
schlift_native = { path = "../app/native" }
schlift-testkit = { path = "../testkit" }
# TLS to reach a server behind Caddy, as phones do.
tonic = { version = "0.14.9", features = ["tls-webpki-roots"] }
prost = "0.14.6"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time", "process", "sync", "net", "io-util", "fs"] }
tokio-stream = "0.1.19"
webauthn-authenticator-rs = { version = "0.6", default-features = false, features = ["softpasskey"] }
webauthn-rs-proto = "0.6"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hdrhistogram = "7"
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
parquet = { version = "60", default-features = false, features = ["arrow", "zstd"] }
arrow-array = "60"
arrow-schema = "60"
