[supervisord]
nodaemon=true
user=root

[program:lift]
command=/app/lift
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/lift.err.log
stdout_logfile=/var/log/lift.out.log
environment=RUST_LOG="info"

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/nginx.err.log
stdout_logfile=/var/log/nginx.out.log
