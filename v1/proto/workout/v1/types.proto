syntax = "proto3";

package workout.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/brensch/lift/gen/workout/v1;workoutv1";

// Exercise types for 5x5 program
enum Exercise {
  EXERCISE_UNSPECIFIED = 0;
  EXERCISE_SQUAT = 1;
  EXERCISE_BENCH = 2;
  EXERCISE_DEADLIFT = 3;
  EXERCISE_OHP = 4;
  EXERCISE_ROW = 5;
}

// Activity types during a workout
enum ActivityType {
  ACTIVITY_TYPE_UNSPECIFIED = 0;
  ACTIVITY_TYPE_SET = 1;   // Performing a set (timing how long it takes)
  ACTIVITY_TYPE_REST = 2;  // Rest between sets (planned_duration vs actual derived from timestamps)
}

// A single activity in the workout timeline
// Everything in a workout is an activity with a start time
message Activity {
  string id = 1;
  ActivityType type = 2;
  google.protobuf.Timestamp started_at = 3;
  google.protobuf.Timestamp ended_at = 4;  // null/zero if ongoing

  // For SET activities
  Exercise exercise = 5;
  int32 set_number = 6;
  float weight = 7;
  int32 target_reps = 8;
  int32 actual_reps = 9;  // filled after set completion

  // For REST activities - planned duration (actual = ended_at - started_at)
  int32 planned_duration_seconds = 10;
}

// A planned set (before completion)
message PlannedSet {
  Exercise exercise = 1;
  float target_weight = 2;
  int32 target_reps = 3;
  int32 set_number = 4; // 1-5 for 5x5
}

// Rest time configuration
// Success (all reps): 3 minutes, Any failure: 5 minutes
// TESTING MODE values can be set here
message RestConfig {
  int32 success_seconds = 1;  // Rest after hitting all reps (default 180)
  int32 failure_seconds = 2;  // Rest after missing reps (default 300)
}
