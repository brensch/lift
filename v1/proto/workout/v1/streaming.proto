syntax = "proto3";

package workout.v1;

import "google/protobuf/timestamp.proto";
import "workout/v1/types.proto";
import "workout/v1/workout.proto";
import "workout/v1/group.proto";

option go_package = "github.com/brensch/lift/gen/workout/v1;workoutv1";

// Subscribe to real-time notifications for a user
// This is the main streaming endpoint - connects on login, receives all updates
message WatchNotificationsRequest {}

// Types of updates that can occur
enum UpdateType {
  UPDATE_TYPE_UNSPECIFIED = 0;
  UPDATE_TYPE_USER_JOINED = 1;       // A user joined the group/workout
  UPDATE_TYPE_USER_LEFT = 2;         // A user left the group/workout
  UPDATE_TYPE_SET_STARTED = 3;       // A user started a set
  UPDATE_TYPE_SET_COMPLETED = 4;     // A user completed a set
  UPDATE_TYPE_REST_STARTED = 5;      // A user started resting
  UPDATE_TYPE_REST_SKIPPED = 6;      // A user skipped their rest
  UPDATE_TYPE_INVITE_RECEIVED = 7;   // You received a group invite
  UPDATE_TYPE_INVITE_ACCEPTED = 8;   // Someone accepted your invite
  UPDATE_TYPE_INVITE_DECLINED = 9;   // Someone declined your invite
  UPDATE_TYPE_GROUP_UPDATED = 10;    // Group state changed (member status, etc.)
  UPDATE_TYPE_PLAN_UPDATED = 11;     // Someone updated their plan during planning
  UPDATE_TYPE_USER_READY = 12;       // A user marked themselves ready
  UPDATE_TYPE_USER_NOT_READY = 13;   // A user unmarked ready
  UPDATE_TYPE_WORKOUT_STARTED = 14;  // Group workout started (planning complete)
  UPDATE_TYPE_SESSION_UPDATED = 15;  // General session state update
  UPDATE_TYPE_HEARTBEAT = 16;        // Keep-alive heartbeat (no action needed)
}

// Real-time update pushed to watching clients
message WorkoutUpdate {
  UpdateType type = 1;
  string user_id = 2;              // Who triggered the update
  Activity activity = 3;           // The activity that changed (if applicable)
  WorkoutState state = 4;          // Full state of the user who changed (optional)
  google.protobuf.Timestamp timestamp = 5;
  GroupInvite invite = 6;          // For invite-related updates
  GroupSession session = 7;        // Full session state for session updates
}
