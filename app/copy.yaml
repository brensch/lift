# In-app copy. Edit this, then run `make copy` to regenerate
# app/lib/gen/copy.dart (CI fails if the generated file is stale). The app
# reads the generated constants; it never reads this file at runtime.
#
# Strings are used as written. Keys are the only thing the code depends on,
# so rename nothing, reword anything.

tutorial:
  skip: SKIP
  next: NEXT
  previous: BACK
  finish: LET'S LIFT
  papers_button: READ THE PAPERS

  # The walkthrough runs over the real screens with a sample account behind
  # them. Each step points at one `target` (an id the screens know: see
  # TutorialTarget in the code) on a `screen` (home, then workout), with the
  # explanation in a popover beside it. `action: start_workout` opens the
  # sample session (already two exercises in, mid-rest) before the step.
  steps:
    - screen: home
      target: home_volume
      title: I'm tracking your muscles.
      body: Not in a creepy way though. I'll let you know which muscle groups need more work and which have rested enough.
    - screen: home
      target: home_templates
      title: Pick your workout
      body: The star is today's suggestion, picked from whatever covers the most unworked muscles. You can pick whatever you want though, ie butt again.
    - screen: home
      target: home_add
      title: Need more options?
      body: We're spoilt for choice in today's society. Continue being spoilt by browsing the lovingly curated set of workouts to add to your favourites, or make your own.
    - screen: home
      target: home_plan
      title: I got your numbers
      body: The last thing I want is for you to have to worry about numbers. I track them for you - sets × reps @ weight. Just decide what you want to work on.
    - screen: home
      target: home_start
      title: Start 
      body: Pressing Start is how you Start. Cool.
    - screen: workout
      action: start_workout
      target: workout_current
      title: Whatcha up to
      body: Summary of what you're up to if someone asks how many sets you have left. It's also shown on the watch app.
    - screen: workout
      target: workout_all
      title: what's up next
      body: All the activities for the rest of the workout are here. Drag them to rearrange if someone is camping the squat rack.
    - screen: workout
      target: bar_status
      title: Your current set
      body: The weight and the reps to hit, plus time left resting/time spent yapping etc. Beautifully colour coded for maximum aesthetics.
    - screen: workout
      target: bar_plates
      title: Plate maths
      body: I calculate how many plates to use to make up the weight. This feature costs money in other apps, I give it to you for free since I'm such a nice guy.
    - screen: workout
      target: bar_timer
      title: Elapsed / heart rate
      body: How long you've been going, and your heart rate from the watch if you're wearing one.
    - screen: workout
      target: bar_button
      title: Tap to start/finish sets
      body: You can also do that from your watch.
    - screen: workout
      target: workout_tabs
      title: Log and heart
      body: Everything you've lifted this session, and your heart rate over time.

