# In-app copy. Edit this, then run `make copy` to regenerate
# app/lib/gen/copy.dart (CI fails if the generated file is stale). The app
# reads the generated constants; it never reads this file at runtime.
#
# Strings are used as written. Keys are the only thing the code depends on,
# so rename nothing, reword anything.

tutorial:
  skip: SKIP
  next: NEXT
  previous: BACK
  finish: LET'S SCHLIFT
  papers_button: READ THE PAPERS

  # The walkthrough runs over the real screens with a sample account behind
  # them. Each step points at one `target` (an id the screens know: see
  # TutorialTarget in the code) on the home screen, with the explanation
  # in a popover beside it. The tour ends at Start; the workout screen
  # explains itself.
  steps:
    - target: home_volume
      title: I'm tracking your muscles.
      body: Not in a creepy way though. I'll let you know which muscle groups need more work and which have rested enough.
    - target: home_templates
      title: Pick your workout
      body: The star is today's suggestion, picked from whatever covers the most unworked muscles. You can pick whatever you want though, ie butt again.
    - target: home_add
      title: Need more options?
      body: We're spoilt for choice in today's society. Continue being spoilt by browsing the lovingly curated set of workouts to add to your rotation, or make your own.
    - target: home_time
      title: I got your number(s)
      body: You're working hard in the gym. I'm working hard crunching the numbers. What a team. Tell me how long you want to work out and on which workout template, I'll figure out the rest.
    - target: home_start
      title: Start
      body: Pressing Start is how you Start. Let's get schlifting!

# The template library: templates/library.yaml, offered during setup and
# from the Manage chip on the home screen.
library:
  # The home chip that opens a blank workout of your own. Placeholder.
  new_button: New
  # The home chip that opens the sheet. Placeholder.
  edit_button: Manage
  sheet_title: Your workouts
  # The groups, on Home's chips and in the sheet: the rotation (what the
  # suggestion picks from) and the reserves (saved, never suggested).
  rotation_heading: Rotation
  reserves_heading: Reserves
  # Under each heading in the Manage sheet.
  rotation_description: The workouts the app picks from when suggesting the best workout to do next.
  reserves_description: In case you want to sneak a cheeky butt sesh, keep it here ready to choose.
  # The sheet's last section: library workouts the user doesn't have yet.
  add_heading: Add
  # Home, when nothing is in the rotation. Placeholder.
  rotation_empty_home: Nothing in the rotation. Manage puts some in.
  # An empty section in the sheet, where a workout can be dropped.
  # Placeholder.
  drop_here: Drag a workout here
  # The sheet's library rows: + adds it to the rotation. Placeholder.
  add_to_plan: Add to the rotation
  # Under Add, first: ready-made rotations, one tap each. Applying one
  # makes its workouts the rotation and moves the rest to the reserves.
  # Placeholders.
  plans_heading: Ready-made plans
  apply_plan: Make this the rotation
  # A ready-made plan whose workouts are the rotation already.
  plan_current: Current
  # Marks a workout as the user's own, on home and in the sheet.
  personal: Personalised
  # Makes a library workout the user's own to edit; it stops following
  # the library.
  clone: Clone
  remove: Remove
  delete: Delete
  loading_failed: Couldn't load the library. Check your connection.
  empty: The library is empty. Someone deleted the internet.

# The rotation: the workouts the suggestion picks from. The rest are
# reserves, on Home in their own group and never suggested. {…} are
# substituted by the code. All placeholder copy.
rotation:
  # The template editor's switch, and the line under it.
  switch_label: In the rotation
  switch_hint: The suggestion picks from these. Off, it's a reserve.
  # Home card menu.
  add: Move to rotation
  remove: Move to reserves
  # Home, under the suggested workout's name: the (at most two) muscles
  # most behind. {muscles} is "chest 2/10" or "chest 2/10 and back 0/10".
  rested_one: "{muscles} this week, rested"
  rested_two: "{muscles} this week, both rested"
  # Joins the last two of a list.
  and: and
  # A muscle that would have counted but isn't ready.
  recovering: "{muscle} recovering ({hours}h)"
  # Nothing is both rested and behind: the one waiting longest.
  fallback: "Everything's recovering or done. This one's waited longest."
  # Every workout in rotation opens on a muscle still recovering: the one
  # whose first lift is back soonest.
  first_lift: "Every workout starts on something sore. First back: {muscle}, in {hours}h."
  # The rotation check, at the top of the sheet: this line, the bars of
  # one lap of the rotation's sets per muscle, then any warnings.
  check_body: "Here's what an average rotation would work. Got enough butt in it? Legs? Biceps? Move things into your rotation that we cycle through to make sure you're sculpting the right bits."
  overlap: "{a} and {b} share {shared} of {of} lifts."
  # Under a reserve's or a library workout's lifts, when it trains muscles
  # the rotation trains none of. {muscles} is "calves" or "calves and
  # core". Placeholder.
  adds: "Trains {muscles}, which you don't have."

