# The small link under Sign in, and the page it opens.
lost_passkey:
  button: Lost passkey?
  title: Lost passkey
  body: This is so sad. Please double check if you saved the passkey in a random place. It could be in google chrome, the apple passwords app, your password manager - every app seems to include a password manager these days. If you looked really hard and still can't find it click below.
  # Above the button.
  note: Please note that by clicking below you admit you did not read the advice about making sure to not lose my passkey.
  # Opens the website's /recover in the browser. Placeholder.
  recover_button: Make a new passkey

# What a sign-in or a new passkey that failed says, where the app knows why.
# Placeholders.
passkey_errors:
  # The passkey chosen belongs to an account or passkey that was deleted,
  # or to a sign-up that never finished.
  unknown: That passkey isn't linked to an account any more. Delete it from your password manager and pick another, or tap Lost passkey.
  # The passkey is one made on the Lost passkey page that hasn't been
  # approved yet.
  not_approved: this replacement passkey is not approved yet mate. please wait for it to be approved.
  # The password manager signed without asking for a fingerprint, face or PIN.
  not_verified: Your password manager didn't check it was you. Unlock it and try again.
  # Adding a passkey to a password manager that already has one for this account.
  already_held: This password manager already has a passkey for this account. Save the new one somewhere else.
  # The passkey prompt was left open too long.
  too_slow: That took too long. Try again.

# Over the app when someone has asked, at schlift.com/recover, to get into
# this account with a new passkey: the owner can refuse it. Placeholders.
recovery_alert:
  body: Someone made a new passkey for your account and asked Brendan to approve it. If that wasn't you, stop it.
  deny: Not me

# The live workout: the set circles and status bars on the phone, and every
# screen on the watch. A set is a circle: tap to start it, tap again when
# it's done, once more for each rep you missed. {n} and {m} are substituted
# by the code.
workout:
  start: Start
  done: Done
  ready: Ready
  lifting: Lifting
  yapping: Yapping
  resting: Resting
  all_done: All done
  # A partner who is in your group but hasn't started a workout yet.
  choosing: Choosing workout
  end_workout: End workout
  # Throwing a workout away: the quiet link under a live workout's exercises
  # and at the foot of a finished one's summary, and the prompt it asks.
  # Placeholders.
  discard_workout: Discard workout
  discard_title: Discard this workout?
  discard_body: It's gone from your history and your plans, as if it never happened. This can't be undone.
  discard_confirm: Discard
  discard_cancel: Keep it
  set_line: Set {n} of {m}
  warmup_line: Warmup {n} of {m}
  warmup_label: Warmup
  working_label: Working
  # In the band of whoever's turn on the rack it is, on two lines.
  up_next: "Up\nnext!"
  skip_warmups: Skip
  # Asked when someone starts the first set of an exercise they have never
  # done: the ramp of 5-rep sets starts from the weight picked. {exercise}
  # is its name, {weight} the weight picked.
  first_time_title: First time doing {exercise}.
  first_time_test: Test me from {weight}
  # In your status box while that first set waits for the answer.
  first_time_status: First time!
  # The watch's status while that first set waits: the answer is on the phone.
  watch_first_time_status: Open phone!
  # Asked when a ramp set (the 5-rep sets that find a new lift's weight) is
  # done with every rep. The answer picks the next set's weight, or ends the
  # ramp. The answers are the buttons, on the phone and the watch.
  # Placeholders.
  rung_question: How many more could you have done?
  # Under the set's circle at the top of the ramp question.
  rung_circle_hint: Missed some? Tap the circle once for each rep you didn't get. Works the same on every set.
  # After reps are taken off there: what that did. {n} reps missed,
  # {weight} the next set's.
  rung_missed_settled: "Missed {n}. Ramp done: working sets at {weight}."
  rung_missed_too_heavy: "Too heavy. Next set {weight}."
  rung_ok: OK
  rung_question_hint: Be honest. The next set and your integrity depends on it.
  rung_answer_zero_to_one: "0–1"
  rung_answer_two_to_four: "2–4"
  rung_answer_five_plus: "5+"
  # Under each answer: where it takes you. {weight} with its unit, {jump}
  # the difference from the set just done.
  rung_outcome_next: "Next set {weight} (+{jump})"
  rung_outcome_settle: "Done. Working sets at {weight}"
  # Under the three answers, after a line with "or" on it: type how much to
  # add for the next ramp set instead, in your unit, and apply it. The ramp
  # goes on from there. Placeholders.
  rung_or: or
  rung_jump_label: Specific jump
  rung_jump_apply: Add that
  # Under the plates on the watch's plate screen: "45 · 25 each side".
  watch_each_side: each side
  # The dimmed (always-on) watch face counts rest in whole minutes, since it
  # only redraws about once a minute. Placeholders.
  watch_min_left: "{n} min"
  watch_under_a_min: "<1 min"
  watch_min_over: "+{n} min"
  watch_rest_until: "till {time}"
  empty_bar: Bar
  # Shown at the top of the bottom banner during someone's first workout
  # only, for whatever they are doing at that moment.
  hints:
    ready: Tap the orange circle to start the set.
    lifting: Tap the circle again when the set is done.
    resting: Missed reps? Tap that circle once for each.
    yapping: Rest is over. Tap the next circle to start.
    all_done: That's everything. End the workout when you're ready.

# The plan: what each lift is given when a workout starts, and why. Home's
# workout card, the template editor, the live workout when a lift comes up,
# and the summary. {…} are substituted by the code. All placeholder copy.
plan:
  # Home's time control: "− 60 min +".
  budget: "{min} min"
  # In place of the time control when a lift in the workout is new.
  calibration: "Calibration session due to new exercise. Go in and try your darndest."
  # The workout's estimated length beside the time control.
  estimate: "~{min} min"
  # The same, when the budget is at or past what the workout can use
  # (every lift at its most sets): + is off.
  longest: "~{min} min · the longest it gets"
  # When two sets a lift don't fit the time.
  needs: "Needs {min} min"
  # A lift never done, loaded: its first set, where the ramp starts.
  ramp: "Ramp from {weight}"
  # Why the numbers are what they are. {max} is the estimated max (a rep
  # max for bodyweight lifts).
  reasons:
    max_up: "Hit every rep. Max up to {max}."
    max_from_miss: "Missed a rep. Max back to {max}."
    held: "Max held at {max}."
    # HELD after a miss started before the rest was up: excused.
    held_rushed: "Held at {max}: you missed a set you didn't rest for."
    held_stopped_early: "Held at {max}: you stopped early."
    time_off: "{days} days off. Max cut to {max}."
    first_time: "First time. The ramp finds your max."
    first_time_bodyweight: "First time. Bottom of the range."
    user_set: "Your numbers, from {date}."
    # SETS_FROM_TIME: more than the two every lift gets.
    sets_extra: "{sets} sets. {muscle} is behind this week."
    sets_floor: "{sets} sets. That's what the time fits."
  # The first line about a lift: this plan against its last session, as
  # two sentences, "{change}. {why}.". {after} is the weight now, {n} a
  # number of reps.
  versus:
    weight_up: "Weight up to {after}"
    weight_down: "Weight down to {after}"
    reps_up_one: "Added one rep"
    reps_up: "Added {n} reps"
    reps_down_one: "Took off one rep"
    reps_down: "Took off {n} reps"
    same: "Same as last time"
    # Why. {sets} is today's sets, {last} last time's.
    hit: "You got every rep last time"
    missed: "You missed reps last time"
    stopped_early: "You stopped early last time"
    rushed: "You missed a set you didn't rest for"
    sets: "{sets} sets today, {last} last time"
    time_off: "{days} days off"
  # Changes to a weight during a workout.
  changes:
    user_adjust: "You changed it: {before} → {after}"
    calibration_step: "Ramp: {before} → {after}"
    # A ramp set under three reps was too heavy: the next one is lighter.
    calibration_step_down: "Too heavy: ramp down to {after}"
    calibration_settled: "Ramp done: {after}"
    correction: "Fixed a set: {before} → {after}"
  # The sheet in the template editor: the user's own numbers for a lift.
  override:
    body: Your weight and reps. I carry on from here.
    weight: Weight
    reps: Reps
    sets: Sets
    # The sets toggle off: the time budget decides.
    sets_auto: From the time
    save: Save
    remove: Let the plan decide
    # On a row with an override.
    custom: yours
  # The completed workout screen, per lift.
  summary:
    planned: "Planned: {plan}"

# One lift in depth: a lift tapped on Progress. Records over the span
