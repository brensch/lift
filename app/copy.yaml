# Setup after signing up: marker, unit, a little about you, your workouts.
onboarding:
  next: NEXT
  back: BACK
  marker:
    title: Which emoji do you identify as
    body: The hardest question in the whole signup.
    refresh: These ones suck
  unit:
    title: Favourite unit?
    body: Ie are you in America
    pounds: Pounds
    pounds_body: Best for making you think you lift more because the number is larger.
    kilograms: Kilograms
    kilograms_body: Best for science and everywhere except America
  # The chick-to-gorilla slider. The lifts underneath show the first
  # working weights that setting gives (the server seeds the same numbers).
  strength:
    title: How huge are you
    body: This does not reflect on who you are as a person, just helps me get your starting weight right.
    note: You can change these later don't worry.
    # Bottom of the scale to the top. Any number of them; the slider picks
    # the nearest.
    emojis: [🐣, 🐥, 🐤, 🐔, 🐇, 🐕, 🐒, 🐎, 🐂, 🦍]
    lifts:
      - id: squat
        label: Squat
      - id: bench_press
        label: Bench press
      - id: deadlift
        label: Deadlift
      - id: overhead_press
        label: Overhead press
  weight:
    title: Weight
    body: We log calories burned for you into your fitness tracker because that's the only reason to go to the gym. Calories burned is proportional to weight. Leave it blank and we use an average.
    field: Bodyweight
    failed: "Setup failed: {error}. Try again."
  templates:
    title: Pick your favourite workouts
    body: You can add, remove, or edit them later. Pretty cool.
    none_selected: Pick at least one. Or one hundred.
    finish: START LIFTING
