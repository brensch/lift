# The small link under Sign in, and the page it opens.
lost_passkey:
  button: Lost passkey?
  title: Lost passkey
  body: This is so sad that you've lost your passkey. I have empathy for you during this difficult time. Make sure you check your password manager, your phone should have saved it for you when you signed up. If you deleted it, please tell Brendan your previous username and he will fix it for you.
