# Learn → Workout science: what the plan is built on. The papers
# cited under each section stay in the code, by id. Placeholders.
science:
  title: 🧠 Workout science
  intro: "Every number I give you comes from one estimate per lift and the time you said you have. The studies behind it are below."
  sections:
    - id: kinds
      title: "Three kinds of lift"
      body: "Barbell compounds are heavy: 5–8 reps, 3:00 rest, warmups first. Every other loaded lift is 8–12 reps with 2:00. Bodyweight and core are 5–15 reps with 1:30. Heavy is better for strength. For size, anything from about 6 to 30 reps works if it's hard. Long rest beats short on the big lifts."
    - id: max
      title: "Your estimated max"
      body: "Each lift has one number: the most I think you could lift once. For bodyweight lifts it's the most reps in a set. I work it out from every set you've logged, assuming one rep left in the tank and a bit of fatigue per set. Hit every rep and it goes up a rep's worth. Miss one and it drops to what you actually showed. Stop early, or lower the weight yourself, and it stays put."
    - id: reps
      title: "Reps and weight"
      body: "I keep you at the weight you did last time, for as many reps as your max covers. Past the top of the range, the weight goes up a step. Under the bottom, it comes down to what you can do. So you add a rep a session, then a plate. More reps works about as well as more weight."
    - id: sets
      title: "Sets: from your time"
      body: "You tell me how long you have on the home screen. Sixty minutes unless you say otherwise. Every lift gets two sets. The rest go one at a time, five at most, to whichever muscle is furthest under ten sets this week. I time your sets and rests, and once I have ten of each I use yours instead of my guesses. If two sets each won't fit, I tell you how long it needs."
    - id: volume
      title: "Weekly volume: 10–20 sets per muscle"
      body: "Ten hard sets a week per muscle beats fewer. Past twenty you're mostly just tired. That's the band on the home screen."
    - id: time_off
      title: "Time off"
      body: "Strength holds for about three weeks. Away from a lift longer than that and I cut its max to 90%. Six weeks, 80%. It comes back fast."
    - id: first_time
      title: "The first time"
      body: "A lift you've never done starts from the weight your emoji picked, or wherever you tell me to start. Sets of 5 from 60% of it, 10% heavier each set, until you miss a rep. Six sets at most. Get all 5 and I ask how many more you had in you. 0–1 and we're done there. 2–4, the next set goes up as usual. 5+, it jumps about a fifth, to roughly one rep short of what you showed. Or type exactly how much to add and the next set goes up by that. Don't answer and it goes up as usual. Under 3 reps and it was too heavy, which tells me nothing, so the next set is a fifth lighter (never back down to one you already did all 5 of). 3 or 4 reps and we're done. The set you got 3 or 4 on, or the one you said 0–1 on, tells me your max, and the rest of the workout comes from that. Bodyweight lifts start at the bottom of the range."
    - id: overrides
      title: "Your own numbers"
      body: "Tap a lift in a workout's editor to give it your own weight and reps, and sets if you want. I work out the max that means and carry on from there. Take them off and I go back to your history."
    - id: no_drops
      title: "No automatic drops"
      body: "I never lower a weight during a workout. Missed reps? Rest and go again. Cooked? Lower it yourself. I'll take the hint next time."
    - id: warmups
      title: "Warmups"
      body: "Heavy lifts get four warmup sets at about 40, 55, 70 and 85% of the working weight. Everything else warms itself up."
    - id: recovery
      title: "Recovery"
      body: "Big muscles take about 48 hours, arms and shoulders 36, calves and core 24. The amber marker is a suggestion, not a bouncer."
  honesty: "Honesty note: the effects in these studies are small and most of them are short. Good programs barely differ. Showing up beats all of it, so I kept it simple."

# Learn → Calorie maths: how a workout's burn is worked out. {…} are
# substituted by the code; the formula's symbols stay in the code.
# Placeholders.
maths:
  title: Calorie maths
  estimation_label: Calorie estimation
  estimation_title: How we estimate calories burned
  estimation_body: "We use the MET (Metabolic Equivalent of Task) formula from the 2011 Compendium of Physical Activities (Ainsworth et al., Med Sci Sports Exerc 43(8):1575–81). Traditional strength training has a MET value of 3.5."
  formula_label: Formula
  # What each symbol of the formula is.
  term_met: 3.5 (traditional strength training)
  term_constant: ml O₂ per kg per min at 1 MET (standard constant)
  term_weight: your bodyweight in kilograms
  term_minutes: total workout duration
  term_divisor: converts ml O₂/min to kcal/min (5 kcal/L O₂ ÷ 1000 × 40)
  your_estimate_label: Your estimate
  # {min} is the example session's length.
  example: "Example: {min} min session"
  example_result: "≈ {kcal} kcal"
  no_weight: Set your bodyweight in Settings → Body weight to get a personalised calorie estimate.
  tonnage_label: What about tonnage?
  tonnage_title: Volume and calorie burn
  tonnage_body: "Tonnage (sets × reps × weight lifted) does predict calorie expenditure during strength training. A 2006 study by Haddock & Wilkin (Int J Sports Med 27(2):143–8) found that 3-set protocols burned ~2.8× more calories than 1-set protocols of the same exercise.\n\nHowever, when normalised per minute of actual exercise time, calorie rate is roughly constant, meaning total duration already captures most of the tonnage effect. More volume → longer sessions → more calories, which the MET × duration formula handles automatically.\n\nA 2020 regression study found that session time and volume load together explained ~61% of energy expenditure variance (R² = 0.61). The remaining 39% is individual variation in rest periods, exercise selection, and body composition that no formula can capture without direct measurement."
  accuracy_label: Accuracy
  accuracy_title: Why this is an estimate
  accuracy_body: "Resistance training has a large anaerobic component (up to 40% of total energy expenditure) that standard indirect calorimetry cannot fully capture, and no phone app can measure it at all. A 2024 systematic review (PMC11393209) found no gold-standard method for resistance training energy expenditure. The MET formula gives a reasonable population-average estimate, accurate to perhaps ±25% for any individual session.\n\nIf no bodyweight is set, we fall back to a flat 5 kcal/min, roughly the midpoint of the 4–10 kcal/min range observed across studies."
  references_label: References
  references:
    - "Ainsworth BE et al. (2011). 2011 Compendium of Physical Activities: A Second Update of Codes and MET Values. Med Sci Sports Exerc, 43(8):1575–81."
    - "Haddock CK & Wilkin LD (2006). Resistance training volume and post exercise energy expenditure. Int J Sports Med, 27(2):143–8."
    - "Dinyer-McNeely TK et al. (2024). Methods to Assess Energy Expenditure of Resistance Exercise: A Systematic Scoping Review. PMC11393209."

