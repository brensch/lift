name: schlift
description: "Schlift workout tracker"
publish_to: 'none'
# Version is injected by CI from the release tag (vX.Y.Z) plus the run number
# (build = 1000 + GITHUB_RUN_NUMBER). This placeholder is only used for local /
# dev builds — never bump it by hand; cut a release by pushing a `vX.Y.Z` tag.
version: 0.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  grpc: ^5.1.0
  protobuf: ^6.0.0
  http: ^1.2.0
  provider: ^6.1.0
  go_router: ^14.0.0
  shared_preferences: ^2.3.0
  fl_chart: ^0.70.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.0
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  uuid: ^4.4.0
  fixnum: ^1.1.0
  share_plus: ^10.0.0
  fluttertoast: ^10.0.0
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.1
  health: ^13.3.1
  app_links: ^7.0.0
  google_fonts: ^8.2.1
  url_launcher: ^6.3.2
  passkeys: ^2.8.2
  credential_manager: ^2.0.8
  package_info_plus: ^9.0.1
  device_info_plus: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # Bundled Manrope + Space Grotesk (the fonts google_fonts otherwise fetches).
    # Lets google_fonts load them offline — no first-run network flash in the
    # app, and deterministic rendering in the e2e screenshot harness.
    - assets/google_fonts/
