name: Runner
options:
  bundleIdPrefix: com.brensch
  deploymentTarget:
    iOS: "15.5"
    watchOS: "9.0"
  xcodeVersion: "1510"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configs:
  Debug: debug
  Release: release
  Profile: release

packages:
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf.git
    from: "1.28.0"

targets:
  Runner:
    type: application
    platform: iOS
    configFiles:
      Debug: Flutter/Debug.xcconfig
      Release: Flutter/Release.xcconfig
      Profile: Flutter/Release.xcconfig
    sources:
      - path: Runner
        excludes:
          - "Info.plist"
          - "*.entitlements"
      # Generated proto files shared with watch — Runner needs them to parse envelopes
      - path: SchliftWatch/Generated
        buildPhase: sources
    entitlements:
      path: Runner/Runner.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brensch.schlift
        DEVELOPMENT_TEAM: $(APPLE_TEAM_ID)
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: $(IOS_APP_PROFILE_NAME)
        INFOPLIST_FILE: Runner/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Runner/Runner-Bridging-Header.h
        SWIFT_VERSION: "5.0"
        CURRENT_PROJECT_VERSION: $(FLUTTER_BUILD_NUMBER)
        VERSIONING_SYSTEM: apple-generic
        ENABLE_BITCODE: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        CLANG_ENABLE_MODULES: "YES"
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: "-O"
        Profile:
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    dependencies:
      - package: SwiftProtobuf
      - target: SchliftWatch
        embed: true
    preBuildScripts:
      - name: "Flutter Build"
        script: |
          /bin/sh "$FLUTTER_ROOT/packages/flutter_tools/bin/xcode_backend.sh" build
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - name: "Thin Binary"
        script: |
          /bin/sh "$FLUTTER_ROOT/packages/flutter_tools/bin/xcode_backend.sh" embed_and_thin
        basedOnDependencyAnalysis: false
        inputFiles:
          - ${TARGET_BUILD_DIR}/${INFOPLIST_PATH}

  SchliftWatch:
    type: application
    platform: watchOS
    sources:
      - path: SchliftWatch
        excludes:
          - "Info.plist"
          - "*.entitlements"
    entitlements:
      path: SchliftWatch/SchliftWatch.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brensch.schlift.watchkitapp
        DEVELOPMENT_TEAM: $(APPLE_TEAM_ID)
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Distribution
        PROVISIONING_PROFILE_SPECIFIER: $(IOS_WATCH_PROFILE_NAME)
        INFOPLIST_FILE: SchliftWatch/Info.plist
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: $(FLUTTER_BUILD_NUMBER)
        MARKETING_VERSION: $(FLUTTER_BUILD_NAME)
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: "4"
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: "-O"
        Profile:
          SWIFT_COMPILATION_MODE: wholemodule
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    dependencies:
      - package: SwiftProtobuf

  RunnerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RunnerTests
    dependencies:
      - target: Runner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brensch.schlift.RunnerTests
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        GENERATE_INFOPLIST_FILE: "YES"
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Runner.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Runner
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"

schemes:
  Runner:
    build:
      targets:
        Runner: all
        SchliftWatch: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RunnerTests
    profile:
      config: Profile
    analyze:
      config: Debug
    archive:
      config: Release

  SchliftWatch:
    build:
      targets:
        SchliftWatch: all
    run:
      config: Debug
    profile:
      config: Profile
    analyze:
      config: Debug
    archive:
      config: Release
