[package]
name = "client"
version = "0.1.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.7", features = ["web"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console", "Window", "Storage", "Blob", "Url", "HtmlAnchorElement", "Document", "Element", "BlobPropertyBag"] }
gloo-storage = "0.3"
console_error_panic_hook = "0.1"
