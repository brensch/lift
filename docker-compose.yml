services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    volumes:
      - ./data:/app/data
    environment:
      - RUST_LOG=info
      - WEBAUTHN_RP_ID=lift.snek2.ddns.net
      - WEBAUTHN_RP_ORIGIN=https://lift.snek2.ddns.net
    expose:
      - "50051"
    networks:
      - home_default

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      - PORT=5173
    expose:
      - "5173"
    networks:
      - home_default

  proxy:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "8008:80"
    depends_on:
      - backend
      - frontend
    networks:
      - home_default

# note this connects to the network set up by caddy in the home assist project
networks:
  home_default:
    external: true
