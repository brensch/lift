services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    volumes:
      - ./data:/app/data
    environment:
      - RUST_LOG=info
      - WEBAUTHN_RP_ID=lift.snek2.ddns.net
      - WEBAUTHN_RP_ORIGIN=https://lift.snek2.ddns.net
    expose:
      - "50051"
    networks:
      - home_default

# note this connects to the network set up by caddy in the home assist project
networks:
  home_default:
    external: true
