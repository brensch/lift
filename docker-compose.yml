services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    volumes:
      - user_dbs:/app/user_dbs
    environment:
      - RUST_LOG=info
      - WEBAUTHN_RP_ID=yourdomain.com
      - WEBAUTHN_RP_ORIGIN=https://yourdomain.com
    expose:
      - "50051"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      - PORT=5173
    expose:
      - "5173"

  proxy:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "8008:80"
    depends_on:
      - backend
      - frontend

volumes:
  user_dbs:

# note this connects to the network set up by caddy in the home assist project
networks:
  home_default:
    external: true
