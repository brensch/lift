services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    volumes:
      - user_dbs:/app/user_dbs
    environment:
      - RUST_LOG=info
    expose:
      - "50051"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      - PORT=5173
    expose:
      - "5173"

  proxy:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

volumes:
  user_dbs:
