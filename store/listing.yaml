# Store listing — the single source of truth for BOTH stores.
#
# Edit this file, commit to main, then run the Store Assets workflow
# (docs/releasing.md → "Store listing and screenshots"). The same text goes to
# every language the listing has on each store. CI checks every limit below
# on each pull request (scripts/check_store_text.py), so a too-long field
# fails the PR, not the upload.
#
# Fields marked "both" feed both stores. Where a store has a box the other
# lacks, the field says which. Release notes are NOT here — they live in
# release-notes/<version>.md.

# both — App Store name (30) and Play app name (30)
name: Schlift

# both — one line, used three ways: the App Store subtitle under the name (30),
# the byline under the wordmark on the Play feature graphic, and the first
# half of Play's one-liner
tagline: The best way to Schlift.

# both — App Store promotional text above the description (170). Play's
# one-liner on the listing card is tagline + a space + this, and must fit 80.
promotional_text: Before you know it you'll be huge.

# App Store only — comma-separated search terms, no spaces needed after commas (100)
keywords: gym,workout,lifting,strength,hypertrophy,bodybuilding,training,log,tracker,progress

# The store description is composed from the three pieces below, in this
# order: about, then the testimonials under their heading, then other_features.
# CI checks the composed result against the stores' 4000. The website uses
# each piece directly as its own section.

# both — the opening paragraphs. Blank lines separate paragraphs.
about: |
  Schlift tracks which muscles you've worked out recently, and suggests workouts based on what hasn't been trained that week. It tracks each exercise and slowly (and scientifically) increases reps and weight until you are huge.

  If you are trying to work in with friends, or just want to work out your butt for the fourth time this week, picking your own workout is quick and easy.

# both — the line above the testimonials in the description, and the section
# label on the website
testimonials_heading: "Don't believe me? Here's what my three satisfied customers have said:"

# both — quote and who said it
testimonials:
  - quote: Wow this app isn't actually crap. Good job Brend
    name: Steph
  - quote: This app is so nice, I'm so proud of you cutie
    name: Alyssa
  - quote: Brendan. Now I can finally become as huge as you are.
    name: Rishabh
  - quote: How do I use my phone?
    name: Kenneth

# both — the bullet list that closes the description; its own section on the
# website, with the heading above the bullets
other_features:
  heading: "If that wasn't enough reason to use it, it also has:"
  # text goes in the store description as a bullet; the emoji is only for
  # the website tile. Change either freely.
  items:
    - emoji: 🗣️
      text: Multiplayer workouts - good for tracking who is yapping and who should do their bench press next
    - emoji: 📈
      text: History (the people yearn for progress charts)
    - emoji: 💾
      text: Save your own workouts to easily do that sick workout your friend showed you again later
    - emoji: ❤️‍🔥
      text: Heartrate monitoring and an accompanying watch app that works really well (it was really hard to get that to work tbh so please use the watch app)

# schlift.com — the only lines on the landing page that are not already a
# store field above. The hero is the tagline with promotional_text under it;
# everything else on the site (about, testimonials, other_features, the slides
# and their captions, the latest release notes) is read from this file at
# build time. Store links are functional labels.
website:
  under_buttons: Free. I don't have stripe set up so you couldn't pay me if you wanted to.
  app_store_button: App Store
  play_store_button: Google Play
  screenshots_heading: What it looks like
  companion_heading: It has web too.
  companion_text: Your phone runs your workout, but you can view workout history online as well since dashboards on websites are cool.
  companion_demo_button: View sample dashboard
  companion_signin_button: Sign in
  whats_new_heading: What's new
  cta_heading: Ready to schlift?
  cta_text: Download Schlift and start your first session in under a minute (I timed it).

# Screenshot slides in STORE order. File numbers are capture order
# (app/integration_test/store_shots_test.dart), so they need not be sequential.
# The title is drawn above the phone on every framed image; the subtitle
# underneath it in smaller type. Keep titles to a few words.
screenshots:
  - file: store_00.png
    title: Start a workout
    subtitle: Go with the suggestion, or just do butt again
  - file: store_04.png
