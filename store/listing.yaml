# Store listing — the single source of truth for BOTH stores.
#
# Edit this file, commit to main, then run the Store Assets workflow
# (docs/releasing.md → "Store listing and screenshots"). The same text goes to
# every language the listing has on each store. CI checks every limit below
# on each pull request (scripts/check_store_text.py), so a too-long field
# fails the PR, not the upload.
#
# Fields marked "both" feed both stores. Where a store has a box the other
# lacks, the field says which. Release notes are NOT here — they live in
# release-notes/<version>.md.

# both — App Store name (30) and Play app name (30)
name: Schlift

# App Store only — the line under the name on the product page (30)
subtitle: Workouts that grow with you

# Play only — the one-liner on the listing card (80)
short_description: Compose your own workouts. The app sets the weights and progresses every lift.

# App Store only — editable without a new version, shown above the description (170)
promotional_text: Build a workout from any exercises. Schlift prescribes the sets, reps, rest and weight, then moves each lift up on its own.

# App Store only — comma-separated search terms, no spaces needed after commas (100)
keywords: gym,workout,lifting,strength,hypertrophy,bodybuilding,training,log,tracker,progress

# both — the full description (4000). Plain text; blank lines separate paragraphs.
description: |
  Schlift trains you for muscle growth with workouts you compose yourself.

  Pick the exercises. Schlift prescribes the sets, reps, rest and working weight for each one, then progresses every lift on its own: reps climb through a range, the weight steps up, and a stall triggers a deload. No programs to follow, no cycles to plan.

  Save templates and let the app suggest which one to run next, based on which muscles are furthest below their weekly volume band.

  IN THE GYM
  • Every set laid out before you start, warmups included
  • One tap to start a set, one to finish it, and a rest timer that gets you back under the bar
  • Adjust a weight mid-workout and the plan follows

  PROGRESS
  • A weekly volume tracker showing hard sets per muscle
  • Weight over time and estimated one-rep max for every exercise
  • Full history of every session

  TRAINING PARTNERS
  • Share a session and see each other's sets land in real time

  ON YOUR WRIST
  • Apple Watch and Wear OS apps run the set and rest timers with live heart rate

  Built on the hypertrophy research, cited in the app.

