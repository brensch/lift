    subtitle: Sets, reps, rest and weight, worked out for you (with science)
  - file: store_05.png
    title: Schlift
    subtitle: One tap to start a set, one to finish it
  - file: store_06.png
    title: Rest, then schlift again
    subtitle: Timers make sure you know when to stop yapping
  - file: store_07.png
    title: Heart rate
    subtitle: Straight from your watch, proof you are going hard
  - file: store_01.png
    title: Get Huge
    subtitle: Or toned, whatever. We increase the weight for you as you succeed
  - file: store_02.png
    title: Every schlift, tracked
    subtitle: The people yearn for progress charts
  - file: store_03.png
    title: Your whole history
    subtitle: Brag to friends or whatever

# Watch slides. Play needs square Wear OS captures; the App Store needs Apple
# Watch captures. Both are placed on a plain dark background, no caption.
wear_screenshots:
