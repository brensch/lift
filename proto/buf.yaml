version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  except:
    # Two naming rules are off, deliberately, for the whole module. They want
    # every RPC to own a uniquely named response message. AuthResponse is
    # "you are now signed in" for RegisterFinish / LoginFinish / TestLogin,
    # all three, on purpose. Request naming (RPC_REQUEST_STANDARD_NAME) stays
    # enforced.
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
