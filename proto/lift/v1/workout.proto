syntax = "proto3";

package lift.v1;

option go_package = "github.com/brensch/lift/server/gen/lift/v1;liftv1";

import "lift/v1/exercise.proto";
import "google/protobuf/timestamp.proto";

service WorkoutService {
  rpc StartWorkout(StartWorkoutRequest) returns (StartWorkoutResponse);
  rpc GetWorkout(GetWorkoutRequest) returns (GetWorkoutResponse);
  rpc ModifyProposedSets(ModifyProposedSetsRequest) returns (ModifyProposedSetsResponse);
  rpc StartSet(StartSetRequest) returns (StartSetResponse);
  rpc CompleteSet(CompleteSetRequest) returns (CompleteSetResponse);
  rpc EndWorkout(EndWorkoutRequest) returns (EndWorkoutResponse);
  rpc ListWorkouts(ListWorkoutsRequest) returns (ListWorkoutsResponse);
}

message Workout {
  string id = 1;
  google.protobuf.Timestamp start_time = 2;
  google.protobuf.Timestamp end_time = 3;
}

message ProposedSet {
  string id = 1;
  string workout_id = 2;
  int32 workout_order = 3;
  Exercise exercise = 4;
  int32 target_reps = 5;
  double target_weight = 6;
  bool warmup = 7;
}

message CompletedSet {
  string id = 1;
  string workout_id = 2;
  string proposed_set_id = 3;
  int32 actual_reps = 4;
  double actual_weight = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp ended_at = 7;
  google.protobuf.Timestamp rest_until = 8;
}

message WorkoutState {
  Workout workout = 1;
  repeated ProposedSet proposed_sets = 2;
  repeated CompletedSet completed_sets = 3;
}

message StartWorkoutRequest {}

message StartWorkoutResponse {
  WorkoutState state = 1;
}

message GetWorkoutRequest {
  string workout_id = 1;
}

message GetWorkoutResponse {
  WorkoutState state = 1;
}

message ModifyProposedSetsRequest {
  string workout_id = 1;
  repeated ProposedSet proposed_sets = 2;
}

message ModifyProposedSetsResponse {
  WorkoutState state = 1;
}

message StartSetRequest {
  string workout_id = 1;
  string proposed_set_id = 2;
}

message StartSetResponse {
  WorkoutState state = 1;
}

message CompleteSetRequest {
  string workout_id = 1;
  string proposed_set_id = 2;
  int32 actual_reps = 3;
  double actual_weight = 4;
  int32 rest_seconds = 5;
}

message CompleteSetResponse {
  WorkoutState state = 1;
}

message EndWorkoutRequest {
  string workout_id = 1;
}

message EndWorkoutResponse {
  WorkoutState state = 1;
}

message ListWorkoutsRequest {}

message ListWorkoutsResponse {
  repeated WorkoutState workouts = 1;
}
