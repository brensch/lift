syntax = "proto3";

package lift.v1;

option go_package = "github.com/brensch/lift/server/gen/lift/v1;liftv1";

import "lift/v1/exercise.proto";
import "lift/v1/workout.proto";
import "google/protobuf/timestamp.proto";

service GroupService {
  rpc InviteUser(InviteUserRequest) returns (InviteUserResponse);
  rpc ListenToInvites(ListenToInvitesRequest) returns (stream InviteEvent);
  rpc SubmitExerciseSelection(SubmitExerciseSelectionRequest) returns (SubmitExerciseSelectionResponse);
  rpc GroupWorkoutProposals(GroupWorkoutProposalsRequest) returns (stream GroupWorkoutProposalsEvent);
  rpc ConnectToWorkout(ConnectToWorkoutRequest) returns (stream WorkoutEvent);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
}

message GroupWorkout {
  string id = 1;
  google.protobuf.Timestamp started_at = 2;
  google.protobuf.Timestamp ended_at = 3;
}

message GroupWorkoutParticipant {
  string user_id = 1;
  string user_name = 2;
  string group_workout_id = 3;
  string workout_id = 4;
  google.protobuf.Timestamp joined_at = 5;
  google.protobuf.Timestamp left_at = 6;
}

message ExerciseSelection {
  string user_id = 1;
  string user_name = 2;
  repeated Exercise exercises = 3;
  bool ready = 4;
}

message InviteUserRequest {
  string target_user_id = 1;
}

message InviteUserResponse {}

message ListenToInvitesRequest {}

message InviteEvent {
  string group_workout_id = 1;
  string inviter_user_id = 2;
  string inviter_name = 3;
}

message SubmitExerciseSelectionRequest {
  string group_workout_id = 1;
  repeated Exercise exercises = 2;
  bool ready = 3;
}

message SubmitExerciseSelectionResponse {}

message GroupWorkoutProposalsRequest {
  string group_workout_id = 1;
}

message GroupWorkoutProposalsEvent {
  string group_workout_id = 1;
  repeated ExerciseSelection selections = 2;
  bool all_ready = 3;
}

message ConnectToWorkoutRequest {
  string group_workout_id = 1;
}

message WorkoutEvent {
  string group_workout_id = 1;
  repeated ParticipantWorkoutState participants = 2;
}

message ParticipantWorkoutState {
  string user_id = 1;
  string user_name = 2;
  WorkoutState workout_state = 3;
}

message ListUsersRequest {}

message ListUsersResponse {
  repeated UserInfo users = 1;
}

message UserInfo {
  string id = 1;
  string name = 2;
}
