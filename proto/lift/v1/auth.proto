syntax = "proto3";

package lift.v1;

option go_package = "github.com/brensch/lift/server/gen/lift/v1;liftv1";

service AuthService {
  rpc Signup(SignupRequest) returns (SignupResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
}

message SignupRequest {
  string name = 1;
}

message SignupResponse {
  string token = 1;
  string user_id = 2;
  string name = 3;
}

message LoginRequest {
  string name = 1;
}

message LoginResponse {
  string token = 1;
  string user_id = 2;
  string name = 3;
}
