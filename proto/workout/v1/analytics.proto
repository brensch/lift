syntax = "proto3";
package workout.v1;

import "workout/v1/workout.proto";

// First-party usage analytics: which screens a signed-in user opened and for
// how long, plus the admin-only read side. Nothing here leaves the server.

// One screen visit. `page` is a stable slug — a go_router path template
// ("/settings", "/exercise/:ex") or an in-screen step ("onboarding/2-unit") —
// never a concrete id. Platform and app version ride on the request metadata
// (`x-platform`, `x-app-version`), not on each row.
message PageView {
  // One id per app launch, so a trail can be split into sittings.
  string app_session_id = 1;
  // Monotonic per app_session_id. (user, session, seq) is the row's identity,
  // so a retried batch is ignored rather than double counted.
  int32 seq = 2;
  string page = 3;
  int64 entered_at_ms = 4; // client clock, Unix millis
  int64 duration_ms = 5; // foreground time on the page
}

message RecordPageViewsRequest {
  repeated PageView views = 1;
}

message RecordPageViewsResponse {
  int32 accepted = 1;
}

service AnalyticsService {
  // Batched upload from the app's page tracker. Authenticated like every
  // other write: views seen before login are held on-device until a session
  // exists.
  rpc RecordPageViews(RecordPageViewsRequest) returns (RecordPageViewsResponse);
}

// ── Admin ──

message GetAdminStatusRequest {}
message GetAdminStatusResponse {
  bool is_admin = 1;
}

message GetStatsRequest {
  // Look-back window in days. 0 = 30. Capped at a year.
  int32 days = 1;
  // When set, `trail` holds this user's most recent page views.
  string trail_username = 2;
}

message PageStat {
  string page = 1;
  int64 views = 2;
  int64 unique_users = 3;
  int64 median_duration_ms = 4;
  int64 total_duration_ms = 5;
}

message DailyStat {
  string day = 1; // YYYY-MM-DD, UTC
  int64 views = 2;
  int64 unique_users = 3;
}

// Sign-in / sign-up attempts grouped by everything worth slicing on.
// outcome: "started" (never finished — the passkey sheet failed or was
// dismissed on the device), "ok", "rejected" (server refused the credential),
// "client_error" (the app reported why; see `reason`).
message AuthAttemptStat {
  string kind = 1; // "register" | "login"
  string platform = 2;
  string app_version = 3;
  string outcome = 4;
  string reason = 5;
  int64 count = 6;
}

message UserActivity {
  string username = 1;
  int64 views = 2;
  int64 last_seen_ms = 3;
}

message TrailEntry {
  string page = 1;
  int64 entered_at_ms = 2;
  int64 duration_ms = 3;
  string app_session_id = 4;
  string platform = 5;
  string app_version = 6;
}

message GetStatsResponse {
  int32 days = 1;
  repeated PageStat pages = 2;
  repeated DailyStat daily = 3;
  repeated AuthAttemptStat auth_attempts = 4;
  repeated UserActivity users = 5;
  repeated TrailEntry trail = 6;
  int64 total_users = 7;
  int64 new_users = 8; // accounts created inside the window
  // Distinct users with a page view inside the window; `users` is capped.
  int64 active_users = 9;
}

// ── Admin: everyone and their training ──

message GetTrainingStatsRequest {
  // Look-back window in days. 0 = 30. Capped at a year.
  int32 days = 1;
}

// One account, as an admin sees it.
message AdminUser {
  string username = 1;
  int64 created_at = 2; // Unix seconds
  int64 last_seen_ms = 3; // latest page view; 0 = never
  string platform = 4; // of that page view
  string app_version = 5;
  int32 passkeys = 6;
  int32 logins = 7; // signed-in devices
  int32 workouts = 8; // finished, all time
  int32 workouts_in_window = 9;
  int64 last_workout_at = 10; // Unix seconds; 0 = none
  double volume_lb = 11; // all time
  int64 events = 12; // the size of the account's log
  bool is_admin = 13;
  bool lifting_now = 14; // a workout is open
}

// One finished workout.
message AdminWorkout {
  string username = 1;
  string name = 2;
  int64 start_time = 3; // Unix seconds
  int64 duration_seconds = 4;
  double volume_lb = 5;
  int32 sets = 6;
  int32 exercises = 7;
  bool together = 8; // in a session with someone else
}

message TrainingDay {
  int64 epoch_day = 1; // UTC days since 1970-01-01, of the workout's start
  int64 workouts = 2;
  int64 lifters = 3;
}

message ExerciseUse {
  Exercise exercise = 1;
  int64 sets = 2;
  int64 lifters = 3;
  double volume_lb = 4;
}

message GetTrainingStatsResponse {
  int32 days = 1;
  repeated AdminUser users = 2; // everyone, most recently seen first
  repeated AdminWorkout workouts = 3; // in the window, newest first, capped
  repeated TrainingDay daily = 4; // days with a workout, in the window
  repeated ExerciseUse exercises = 5; // in the window, most sets first
  int64 workouts_in_window = 6; // the whole count; `workouts` is capped
  int64 lifters_in_window = 7;
  int64 workouts_total = 8;
  double volume_lb_in_window = 9;
}

// ── Admin: account recovery ──

message RecoveryRequest {
  string request_id = 1;
  string username = 2;
  int64 created_at = 3; // Unix seconds
  string platform = 4;
  string created_ip = 5;
  // The account, so the admin can judge the request.
  int32 passkeys = 6;
  int32 logins = 7; // devices still signed in: they could add a passkey themselves
  int64 last_seen_ms = 8;
  // "pending", "approved" or "denied".
  string status = 9;
  int64 decided_at = 10;
}

message ListRecoveriesRequest {}
message ListRecoveriesResponse {
  // Waiting first, then the recently decided. Never the codes: an admin
  // approves the code they were sent.
  repeated RecoveryRequest recoveries = 1;
}

message DecideRecoveryRequest {
  oneof request {
    // Approve the request that came with this code.
    string approve_code = 1;
    // Refuse this request.
    string deny_request_id = 2;
  }
  // On approving: drop the account's other passkeys and sign out its
  // devices (a stolen phone, not just a lost key).
  bool remove_other_passkeys = 3;
}
message DecideRecoveryResponse {
  RecoveryRequest recovery = 1;
}

service AdminService {
  // Whether the caller is an admin. Lets the website decide whether to show
  // the stats link; the real gate is on GetStats.
  rpc GetAdminStatus(GetAdminStatusRequest) returns (GetAdminStatusResponse);
  // Admin only: PERMISSION_DENIED for everyone else.
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse);
  // Admin only. Everyone's accounts and finished workouts, folded from their
  // events for this answer and not kept.
  rpc GetTrainingStats(GetTrainingStatsRequest) returns (GetTrainingStatsResponse);
  // Admin only.
  rpc ListRecoveries(ListRecoveriesRequest) returns (ListRecoveriesResponse);
  rpc DecideRecovery(DecideRecoveryRequest) returns (DecideRecoveryResponse);
}
