syntax = "proto3";

package workout.v1;

import "workout/v1/workout.proto";

// ─────────────────────────────────────────────────────────────────────────────
// Training model v2.
//
// A workout is blocks → sets. A Set carries three facets:
//   proposed  — what the trainer asked (frozen at plan time)
//   target    — what the athlete plans (editable until performed)
//   entry     — what actually happened (absent until performed)
//
// Entries are append-only and bitemporal: `performed_at` is when the set
// happened in the real world (editable, back-datable); `recorded_at` is when
// the record was written (audit fact). A correction is a new entry; a delete is
// a tombstone. Current truth = the newest non-tombstoned entry per set.
//
// All editing goes through one endpoint, MutateWorkout, as a list of typed ops.
// That is the whole write surface for a workout: one round-trip, batchable,
// offline-friendly. Progression happens once, at CloseWorkout.
// ─────────────────────────────────────────────────────────────────────────────

enum SetRole {
  SET_ROLE_UNSPECIFIED = 0;
  SET_ROLE_WORKING = 1;
  SET_ROLE_WARMUP = 2;
}

// A measurement. Strength uses weight+reps; other modalities can populate
// duration/distance later without a schema change.
message Measure {
  double weight = 1;   // lb
  int32 reps = 2;
  int32 duration_s = 3; // for timed work (planks, cardio)
  double distance_m = 4; // for cardio
}

message SetView {
  string id = 1;
  string block_id = 2;
  int32 order = 3;
  Exercise exercise = 4;
  SetRole role = 5;

  Measure proposed = 6;   // trainer intent (frozen)
  Measure target = 7;     // athlete plan (== proposed unless edited)
  Measure entry = 8;      // folded current performance; meaningful only if has_entry
  bool has_entry = 9;

  bool skipped = 10;
  bool is_amrap = 11;
  string instruction = 12;

  // True once this set counts toward program progression (came from a regime
  // prescription). Freestyle sets are false and CloseWorkout ignores them.
  bool counts_toward_program = 13;
  string slot_key = 14; // progression slot; empty for freestyle
}

message BlockView {
  string id = 1;
  int32 order = 2;
  string name = 3;
  bool interleave_warmups = 4;
  RestConfig rest_config = 5;
  repeated SetView sets = 6;
}

message WorkoutView {
  string id = 1;
  string name = 2;
  int64 start_time = 3;
  int64 end_time = 4;      // 0 = in progress
  string session_id = 5;

  repeated BlockView blocks = 6;

  string active_set_id = 7;    // the set currently being performed ("" = none)
  int64 active_started_at = 8; // for the rest/elapsed clock
  bool from_program = 9;       // false = freestyle
  bool closed = 10;            // progression has been applied
}

// ── The op set — the entire write surface for a workout ──

// A whole block to add, with its planned sets. Used by CreateWorkout and AddBlock.
message BlockPlan {
  string name = 1;
  bool interleave_warmups = 2;
  RestConfig rest_config = 3;
  repeated SetPlan sets = 4;
}

message SetPlan {
  Exercise exercise = 1;
  SetRole role = 2;
  Measure target = 3;    // becomes both proposed and target at plan time
  bool is_amrap = 4;
  string instruction = 5;
  bool counts_toward_program = 6;
  string slot_key = 7;
  // Optional stable id so the client can address the set before the server
  // round-trips (offline-first). Server generates one if empty.
  string client_id = 8;
}

message EditTarget { string set_id = 1; Measure target = 2; }        // re-prescribe (only while no entry)
message AddSetOp { string block_id = 1; SetPlan set = 2; }
message RemoveSetOp { string set_id = 1; }
message SkipSetOp { string set_id = 1; bool skipped = 2; }
message StartSetOp { string set_id = 1; int64 at = 2; }              // move the active pointer
message LogSetOp { string set_id = 1; Measure result = 2; int64 performed_at = 3; } // append an entry
message CorrectEntryOp { string set_id = 1; Measure result = 2; int64 performed_at = 3; } // append a superseding entry
message DeleteEntryOp { string set_id = 1; }                         // append a tombstone
message ReorderBlocksOp { repeated string block_ids = 1; }
message AddBlockOp { BlockPlan block = 1; }

message WorkoutOp {
  oneof op {
    EditTarget edit_target = 1;
    AddSetOp add_set = 2;
    RemoveSetOp remove_set = 3;
    SkipSetOp skip_set = 4;
    StartSetOp start_set = 5;
    LogSetOp log_set = 6;
    CorrectEntryOp correct_entry = 7;
    DeleteEntryOp delete_entry = 8;
    ReorderBlocksOp reorder_blocks = 9;
    AddBlockOp add_block = 10;
  }
}

// ── RPCs ──

message CreateWorkoutRequest {
  string name = 1;
  repeated BlockPlan blocks = 2;
  int64 started_at = 3;   // 0 = server time
  bool from_program = 4;  // false = freestyle
}

message MutateWorkoutRequest {
  string workout_id = 1;
  repeated WorkoutOp ops = 2;
}

message GetWorkoutV2Request { string workout_id = 1; }

message CloseWorkoutRequest {
  string workout_id = 1;
  int64 ended_at = 2;    // 0 = server time
}

message CloseWorkoutResponse {
  WorkoutView workout = 1;
  repeated ProgressionChange changes = 2; // what the trainer decided, per lift
}

// One trainer decision for one lift, for the UI rationale and the history chart.
message ProgressionChange {
  Exercise exercise = 1;
  string slot_key = 2;
  string reason = 3;        // "advance" | "hold" | "stall" | "deload" | "cycle_advance" | "layoff_deload"
  double from_weight = 4;
  double to_weight = 5;
  string headline = 6;      // e.g. "Best set 185×5 — increasing to 190"
}

message GetProgressionHistoryRequest {
  string slot_key = 1;   // empty = all lifts
  int32 limit = 2;       // 0 = default
}

message ProgressionHistoryEntry {
  string workout_id = 1;
  int64 at = 2;
  Exercise exercise = 3;
  string slot_key = 4;
  string reason = 5;
  double from_weight = 6;
  double to_weight = 7;
}

message GetProgressionHistoryResponse {
  repeated ProgressionHistoryEntry entries = 1;
}

service TrainingService {
  rpc CreateWorkout(CreateWorkoutRequest) returns (WorkoutView);
  rpc MutateWorkout(MutateWorkoutRequest) returns (WorkoutView);
  rpc GetWorkoutV2(GetWorkoutV2Request) returns (WorkoutView);
  rpc CloseWorkout(CloseWorkoutRequest) returns (CloseWorkoutResponse);
  rpc GetProgressionHistory(GetProgressionHistoryRequest) returns (GetProgressionHistoryResponse);
}
