syntax = "proto3";
package workout.v1;

import "workout/v1/group.proto";
import "workout/v1/workout.proto";

// ─── The account ─────────────────────────────────────────────────────────────
//
// An account is a log of events, stored and synced as JSON, not as these
// messages (core/src/events.rs; docs/architecture/local-first.md). The
// messages here are only what crosses the wire.

// History brought in from elsewhere, as it was: finished workouts, and the
// starting weights of lifts never done. Plans read the workouts like any
// others; nothing else is recomputed from it.
message ImportHistory {
  repeated ImportedWorkout workouts = 1;
  repeated ExerciseWeight starting_weights = 3;
  reserved 2;
  reserved "trackers";
}

message ImportHistoryResponse {}

// A finished workout with everything recorded in it.
message ImportedWorkout {
  Workout workout = 1;
  repeated ProposedSet proposed_sets = 2;
  repeated CompletedSet completed_sets = 3;
  repeated WorkoutHeartRatePoint heart_rate = 4;
  repeated ExerciseLog exercise_logs = 5;
}

// ─── Sync ────────────────────────────────────────────────────────────────────
//
// The phone holds one Sync stream open while it can. It opens by saying how
// much of its account's history it holds, and the server sends the rest:
// every event after it, then each new one as it is stored, from whichever
// device, in the server's order. Up go the phone's own events as it records
// them, without a place; the server gives each one (once: an event it already
// holds, by id, is skipped) and sends it back down with the others. While in
// a session, down also come the partners' status, whole, on connect and on
// every change, so a dropped message is healed by the next.

service SyncService {
  rpc Sync(stream SyncRequest) returns (stream SyncResponse);
}

message SyncRequest {
  oneof kind {
    // First, and only first: the last seq the device holds, 0 for none.
    int64 after_seq = 3;
    // The device's own events not yet given a place, oldest first: a
    // zstd-compressed JSON array.
    bytes events = 4;
    // Keeps the stream (and the proxies on the way) awake; answered with the
    // head, so a dead link shows within a heartbeat.
    Heartbeat heartbeat = 2;
  }
  reserved 1;
}

message Heartbeat {}

message SyncResponse {
  oneof kind {
    // Events in the server's order, each with its seq.
    Events events = 5;
    // The last seq the server holds: the answer to a heartbeat.
    int64 head = 1;
    // The caller's session, whole: who's in it and where each is up to.
    // Empty session_id when not in one.
    GetCurrentSessionResponse session = 2;
    // Requests to join the caller, whole.
    GetJoinRequestsResponse join_requests = 3;
    // The template library as the server has it: what coupled templates
    // follow. Sent on connect.
    ListTemplateLibraryResponse library = 4;
  }
}

message Events {
  // A zstd-compressed JSON array.
  bytes packed = 1;
  // The last seq the server holds: a device that has it has caught up.
  int64 head = 2;
}
