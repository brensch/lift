syntax = "proto3";

package workout.v1;

import "workout/v1/workout.proto";

service MultiplayerService {
  // Join a session by providing the user ID of someone already in (or starting) that session.
  // If the target user is not in a session, a new session is created for both.
  rpc JoinUser(JoinUserRequest) returns (JoinUserResponse);
  
  rpc LeaveSession(LeaveSessionRequest) returns (LeaveSessionResponse);
  
  // Get a specific participant's workout progress
  rpc GetParticipantWorkout(GetParticipantWorkoutRequest) returns (ParticipantStatus);

  // Consolidated call: Get the current active session and its status for the user,
  // OR get a specific session's status if session_id is provided.
  rpc GetCurrentSession(GetCurrentSessionRequest) returns (GetCurrentSessionResponse);

  // Update the active workout for the current user's session
  rpc UpdateActiveWorkout(UpdateActiveWorkoutRequest) returns (UpdateActiveWorkoutResponse);
}

message JoinUserRequest {
  string user_id = 1; // The ID of the user whose QR code was scanned
}

message JoinUserResponse {
  string session_id = 1;
}

message LeaveSessionRequest {}

message LeaveSessionResponse {}

message GetParticipantWorkoutRequest {
  string user_id = 1;
  string workout_id = 2;
}

message GetCurrentSessionRequest {
  string session_id = 1; // Optional: If provided, gets status of this specific session.
}

message GetCurrentSessionResponse {
  string session_id = 1;
  SessionStatus session_status = 2; // populated if session_id is present
}

message UpdateActiveWorkoutRequest {
  string workout_id = 1;
}

message UpdateActiveWorkoutResponse {}

message SessionStatus {
  string session_id = 1;
  repeated ParticipantStatus participants = 2;
}

message ParticipantStatus {

  User user = 1;

  string active_workout_id = 2;

  Workout active_workout = 3;

  repeated ExerciseGroup exercise_groups = 4;

  repeated ProposedSet proposed_sets = 5;

  repeated CompletedSet completed_sets = 6;

}
