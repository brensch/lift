syntax = "proto3";

package workout.v1;

import "workout/v1/workout.proto";

service MultiplayerService {
  // Join the group identified by an opaque per-user invite token (the value encoded in
  // the target user's QR code). Resolves the token to the target user, then places both
  // the caller and target into the same session (reusing the target's current session if
  // present, otherwise creating a new one). Overwrites the caller's current session.
  rpc JoinViaInvite(JoinViaInviteRequest) returns (JoinViaInviteResponse);

  // Fetch the caller's invite token so the client can render it into a QR code. If the
  // caller has none yet, one is generated.
  rpc GetMyInviteToken(GetMyInviteTokenRequest) returns (GetMyInviteTokenResponse);

  // Rotate the caller's invite token (invalidates any previously-shared QR code).
  rpc RotateInviteToken(RotateInviteTokenRequest) returns (RotateInviteTokenResponse);

  // Get a specific participant's workout progress
  rpc GetParticipantWorkout(GetParticipantWorkoutRequest) returns (ParticipantStatus);

  // Get the caller's current group session. Reads user_current_session — membership is
  // independent of whether the caller has an active workout.
  rpc GetCurrentSession(GetCurrentSessionRequest) returns (GetCurrentSessionResponse);

  // Manually leave the caller's current session. Keeps the caller's last participant blob
  // so peers in the session still see their historical state.
  rpc LeaveCurrentSession(LeaveCurrentSessionRequest) returns (LeaveCurrentSessionResponse);

  // Fetch every participant snapshot ever recorded for a specific session.
  // Used for historical views (e.g. "who was in this past workout's session").
  rpc GetSessionParticipants(GetSessionParticipantsRequest) returns (GetSessionParticipantsResponse);

  // Subscribe to live updates for a current multiplayer session.
  // The server always emits a full snapshot immediately after subscribe.
  rpc SubscribeSession(SubscribeSessionRequest) returns (stream SessionSubscriptionEvent);

  // Refresh the caller's participant snapshot in the session cache.
  rpc UpdateActiveWorkout(UpdateActiveWorkoutRequest) returns (UpdateActiveWorkoutResponse);
}

message JoinViaInviteRequest {
  string invite_token = 1; // Opaque token from the target user's QR code
}

message JoinViaInviteResponse {
  string session_id = 1;
}

message GetMyInviteTokenRequest {}
message GetMyInviteTokenResponse {
  string invite_token = 1;
}

message RotateInviteTokenRequest {}
message RotateInviteTokenResponse {
  string invite_token = 1;
}

message LeaveCurrentSessionRequest {}
message LeaveCurrentSessionResponse {}

message GetParticipantWorkoutRequest {
  string user_id = 1;
  string workout_id = 2;
}

message GetCurrentSessionRequest {}

message GetSessionParticipantsRequest {
  string session_id = 1;
}

message GetSessionParticipantsResponse {
  string session_id = 1;
  repeated ParticipantStatus participants = 2;
}

message GetCurrentSessionResponse {
  string session_id = 1;
  SessionStatus session_status = 2; // populated if session_id is present
}

message SubscribeSessionRequest {
  string session_id = 1; // Optional: if omitted, subscribes to caller's current session.
}

message SessionSubscriptionEvent {
  string session_id = 1;
  int64 version = 2;
  SessionStatus session_status = 3;
}

message UpdateActiveWorkoutRequest {
  string workout_id = 1;
}

message UpdateActiveWorkoutResponse {}

message SessionStatus {
  string session_id = 1;
  repeated ParticipantStatus participants = 2;
  string next_up_user_id = 3;
  ProposedSet next_up_set = 4;
  int64 next_up_rest_until = 5;
  string currently_lifting_user_id = 6;
}

message ParticipantStatus {

  User user = 1;

  string active_workout_id = 2;

  Workout active_workout = 3;

  repeated ExerciseGroup exercise_groups = 4;

  repeated ProposedSet proposed_sets = 5;

  repeated CompletedSet completed_sets = 6;

  ProposedSet next_up_set = 7;

  int64 rest_until = 8;

  bool has_active_set = 9;

}
