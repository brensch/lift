syntax = "proto3";

package workout.v1;

import "workout/v1/workout.proto";

// Messages exchanged between phone and wearable companions.

enum WearActionType {
  WEAR_ACTION_TYPE_UNSPECIFIED = 0;
  WEAR_ACTION_TYPE_COMPLETE_SET = 2; // set_id + reps + weight + effort
  WEAR_ACTION_TYPE_END_WORKOUT = 4;
  WEAR_ACTION_TYPE_START_SET = 8; // set_id
  reserved 1, 3, 5, 6, 7;
  reserved "WEAR_ACTION_TYPE_FEWER_REPS", "WEAR_ACTION_TYPE_SKIP_REST", "WEAR_ACTION_TYPE_RATE_EXERCISE", "WEAR_ACTION_TYPE_SKIP_WARMUP";
}

enum WearActionStyle {
  WEAR_ACTION_STYLE_UNSPECIFIED = 0;
  WEAR_ACTION_STYLE_PRIMARY = 1;
  WEAR_ACTION_STYLE_SECONDARY = 2;
  reserved 3;
  reserved "WEAR_ACTION_STYLE_REP_OPTION";
}

enum HeartRateAvailability {
  HEART_RATE_AVAILABILITY_UNSPECIFIED = 0;
  HEART_RATE_AVAILABILITY_AVAILABLE = 1;
  HEART_RATE_AVAILABILITY_ACQUIRING = 2;
  HEART_RATE_AVAILABILITY_UNAVAILABLE = 3;
}

// Everything the watch prints is a string the phone rendered. The watch
// lays them out; it never derives text from the workout.
message WearStatusCard {
  string state_label = 3; // "Lifting", "Resting" or "Yapping" in those states, else empty
  string timer_text = 4; // optional
  ProposedSet display_set = 6; // the next pending set, if any
  string exercise_name = 9; // of display_set
  string set_line = 10; // "Set 2 of 3", "Warmup 1 of 4"
  string set_text = 11; // display_set in the user's unit, e.g. "60 kg × 5"
  // What the watch switches to on its own when the countdown reaches zero
  // (RESTING becoming YAPPING), before the next snapshot arrives.
  string yapping_label = 12; // "Yapping"
  string weight_text = 14; // display_set's weight in the user's unit, "225" ("?" on a first time)
  string unit_text = 15; // "lb" / "kg"
  string reps_text = 16; // display_set's target reps, "5" ("?" on a first time)
  // What a tap on the big button does now: "Lift", "Done", "Go early",
  // "Test me".
  string cue = 17;
  // The opening set of an exercise never done: no weight yet. A tap starts
  // the calibration sets; giving the weight is done on the phone.
  bool first_time = 18;
  // The plates for display_set, one side, heaviest (loaded first) first;
  // empty off a barbell or on an empty bar. Shown when the weight is tapped.
  repeated WearPlate plates = 19;
  string plates_text = 20; // "45 · 25 each side", "Empty bar"; empty off a barbell
  string bar_text = 21; // "Bar 45 lb"; empty off a barbell
  reserved 1, 2, 5, 7, 8, 13;
  reserved "side_label", "header", "is_complete", "current_group_set", "total_group_sets", "done_label";
}

// What a set's circle shows, as the phone's own circle does.
enum WearCircleState {
  WEAR_CIRCLE_STATE_UNSPECIFIED = 0;
  WEAR_CIRCLE_STATE_PENDING = 1; // still to do
  WEAR_CIRCLE_STATE_NEXT = 2; // up next: a ring in the stage's colour
  WEAR_CIRCLE_STATE_LIFTING = 3; // started, not done
  WEAR_CIRCLE_STATE_FULL = 4; // done, every rep
  WEAR_CIRCLE_STATE_SHORT = 5; // done, short of the target
  WEAR_CIRCLE_STATE_ZERO = 6; // done with no reps
  WEAR_CIRCLE_STATE_SKIPPED = 7; // a warmup passed
}

// The dimmed face counts rest in whole minutes: it is redrawn about once a
// minute, so seconds would be wrong most of the time.
message WearAmbientCopy {
  string min_left = 1; // "{n} min": rest left, rounded up
  string under_a_min = 2; // the last minute of rest
  string min_over = 3; // "+{n} min": past the end of rest
  string rest_until = 4; // "till {time}": when rest ends, the watch's clock
}

// One set of the exercise in hand, as a circle. A tap on it is a TapSetIntent:
// the phone does what a tap on its own circle does.
message WearSetCircle {
  string set_id = 1;
  string text = 2; // the number in it: reps done, or the target; "?" on a first time
  WearCircleState state = 3;
  bool warmup = 4; // drawn smaller
}

// One plate on the bar, as the phone draws it.
message WearPlate {
  string label = 1; // "45"
  string color_hex = 2; // "#F44336", the user's plate colour
  float size = 3; // 0..1 of the heaviest plate: how tall to draw it
}

// The set just done, for the watch's fix window: for a few seconds after
// it ended each tap on the big button takes a rep off it.
message WearDoneSet {
  string completed_set_id = 1;
  int32 reps = 2; // logged
  int32 target_reps = 3;
  float actual_weight = 4;
  int64 ended_at = 5; // Unix seconds
  string cue = 6; // "−1 rep"
}

message WearAction {
  WearActionType type = 1;
  WearActionStyle style = 2;
  string label = 3;
  string set_id = 4; // used by set-scoped actions
  int32 reps = 5; // COMPLETE_SET: the reps Done records (the target)
  float actual_weight = 6; // COMPLETE_SET: the weight Done records (the target)
  Effort effort = 7; // COMPLETE_SET: the rating this Done gives (UNSPECIFIED on a warmup)
}

message WearWorkoutSnapshot {
  string workout_id = 1;
  int64 emitted_at = 2; // Unix milliseconds (the watches sync their clock to it)
  WorkoutState state = 3;

  int64 workout_start_time = 4;
  int64 rest_until = 6; // RESTING counts down to it, YAPPING counts up from it
  int64 lifting_started_at = 15; // LIFTING counts up from it
  reserved 5, 7;
  reserved "active_started_at", "last_rest_end";

  string elapsed_text = 8;
  WearStatusCard you_card = 9;
  repeated WearAction actions = 11;
  WearCompletionSummary completion_summary = 12; // optional
  string next_up_emoji = 13; // profile emoji of the next-to-lift participant (empty if solo)
  WearDoneSet last_done = 16; // the most recent done set, if any
  // The exercise in hand's sets, in order, warmups first.
  repeated WearSetCircle circles = 17;
  reserved 18, 19;
  // The phone's "up next" chip, when the wearer lifts next in a session;
  // empty otherwise (solo, or someone else is next).
  string up_next_text = 20;
  // The words the dimmed (always-on) face prints around its minute count.
  WearAmbientCopy ambient_copy = 21;
  reserved 10, 14;
  reserved "group_card", "effort_prompt";
}

message WearCompletionSummary {
  string duration_text = 1;
  int32 completed_working_sets = 2;
  int32 total_volume_lb = 3;
  string volume_text = 4; // phone-rendered in the user's unit, e.g. "1,500 kg"
}

message CompleteSetIntent {
  string workout_id = 1;
  string set_id = 2;
  int32 reps = 3;
  float actual_weight = 4;
  int64 completed_at = 5; // Unix seconds, time of first tap
  Effort effort = 6; // the rating given with this Done (UNSPECIFIED on a warmup)
}

message StartSetIntent {
  string workout_id = 1;
  string set_id = 2;
  int64 started_at = 3; // Unix seconds, time of the tap
}

// A tap on a set's circle on the watch: the phone does what a tap on its own
// circle does (start, done, a rep off, undone).
message TapSetIntent {
  string workout_id = 1;
  string set_id = 2;
  int64 tapped_at = 3; // Unix seconds
}

// Set a done set's reps: the fix window's taps, one rep off each.
message EditCompletedSetIntent {
  string workout_id = 1;
  string completed_set_id = 2;
  int32 reps = 3;
  float actual_weight = 4;
}

message EndWorkoutIntent {
  string workout_id = 1;
}

message WearIntent {
  string intent_id = 1; // client-generated UUID for dedupe
  int64 sent_at = 2; // Unix seconds

  oneof intent {
    CompleteSetIntent complete_set = 11;
    EndWorkoutIntent end_workout = 13;
    StartSetIntent start_set = 17;
    EditCompletedSetIntent edit_completed_set = 18;
    TapSetIntent tap_set = 19;
  }
  reserved 10, 12, 14, 15, 16;
  reserved "fewer_reps", "skip_rest", "rate_exercise", "skip_warmup";
}

message HeartRateSample {
  int64 sampled_at = 1; // Unix milliseconds
  float bpm = 2;
  HeartRateAvailability availability = 3;
}

message WearSensorBatch {
  string batch_id = 1; // client-generated UUID for durable dedupe
  string workout_id = 2;
  int64 sent_at = 3; // Unix milliseconds
  repeated HeartRateSample heart_rate_samples = 4;
}

message WearSensorBatchAck {
  string batch_id = 1;
  string workout_id = 2;
  int64 received_at = 3; // Unix milliseconds on phone receipt
}
