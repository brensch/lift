syntax = "proto3";

package workout.v1;

import "workout/v1/workout.proto";

// Messages exchanged between phone and wearable companions.

enum WearActionType {
  WEAR_ACTION_TYPE_UNSPECIFIED = 0;
  WEAR_ACTION_TYPE_COMPLETE_SET = 2; // set_id + reps + weight + effort
  WEAR_ACTION_TYPE_END_WORKOUT = 4;
  WEAR_ACTION_TYPE_START_SET = 8; // set_id
  reserved 1, 3, 5, 6, 7;
  reserved "WEAR_ACTION_TYPE_FEWER_REPS", "WEAR_ACTION_TYPE_SKIP_REST", "WEAR_ACTION_TYPE_RATE_EXERCISE", "WEAR_ACTION_TYPE_SKIP_WARMUP";
}

enum WearActionStyle {
  WEAR_ACTION_STYLE_UNSPECIFIED = 0;
  WEAR_ACTION_STYLE_PRIMARY = 1;
  WEAR_ACTION_STYLE_SECONDARY = 2;
  reserved 3;
  reserved "WEAR_ACTION_STYLE_REP_OPTION";
}

enum HeartRateAvailability {
  HEART_RATE_AVAILABILITY_UNSPECIFIED = 0;
  HEART_RATE_AVAILABILITY_AVAILABLE = 1;
  HEART_RATE_AVAILABILITY_ACQUIRING = 2;
  HEART_RATE_AVAILABILITY_UNAVAILABLE = 3;
}

// Everything the watch prints is a string the phone rendered. The watch
// lays them out; it never derives text from the workout.
message WearStatusCard {
  string state_label = 3; // "Lifting", "Resting" or "Yapping" in those states, else empty
  string timer_text = 4; // optional
  ProposedSet display_set = 6; // the next pending set, if any
  string exercise_name = 9; // of display_set
  string set_line = 10; // "Set 2 of 3", "Warmup 1 of 4", "Finding weight"
  string set_text = 11; // display_set in the user's unit, e.g. "60 kg × 5"
  // What the watch switches to on its own when the countdown reaches zero
  // (RESTING becoming YAPPING), before the next snapshot arrives.
  string yapping_label = 12; // "Yapping"
  reserved 1, 2, 5, 7, 8, 13;
  reserved "side_label", "header", "is_complete", "current_group_set", "total_group_sets", "done_label";
}

message WearAction {
  WearActionType type = 1;
  WearActionStyle style = 2;
  string label = 3;
  string set_id = 4; // used by set-scoped actions
  int32 reps = 5; // COMPLETE_SET: the reps Done records (the target)
  float actual_weight = 6; // COMPLETE_SET: the weight Done records (the target)
  Effort effort = 7; // COMPLETE_SET: the rating this Done gives (UNSPECIFIED on a warmup)
}

message WearWorkoutSnapshot {
  string workout_id = 1;
  int64 emitted_at = 2; // Unix milliseconds (the watches sync their clock to it)
  WorkoutState state = 3;

  int64 workout_start_time = 4;
  int64 rest_until = 6; // RESTING counts down to it, YAPPING counts up from it
  int64 lifting_started_at = 15; // LIFTING counts up from it
  reserved 5, 7;
  reserved "active_started_at", "last_rest_end";

  string elapsed_text = 8;
  WearStatusCard you_card = 9;
  repeated WearAction actions = 11;
  WearCompletionSummary completion_summary = 12; // optional
  string next_up_emoji = 13; // profile emoji of the next-to-lift participant (empty if solo)
  reserved 10, 14;
  reserved "group_card", "effort_prompt";
}

message WearCompletionSummary {
  string duration_text = 1;
  int32 completed_working_sets = 2;
  int32 total_volume_lb = 3;
  string volume_text = 4; // phone-rendered in the user's unit, e.g. "1,500 kg"
}

message CompleteSetIntent {
  string workout_id = 1;
  string set_id = 2;
  int32 reps = 3;
  float actual_weight = 4;
  int64 completed_at = 5; // Unix seconds, time of first tap
  Effort effort = 6; // the rating given with this Done (UNSPECIFIED on a warmup)
}

message StartSetIntent {
  string workout_id = 1;
  string set_id = 2;
  int64 started_at = 3; // Unix seconds, time of the tap
}

message EndWorkoutIntent {
  string workout_id = 1;
}

message WearIntent {
  string intent_id = 1; // client-generated UUID for dedupe
  int64 sent_at = 2; // Unix seconds

  oneof intent {
    CompleteSetIntent complete_set = 11;
    EndWorkoutIntent end_workout = 13;
    StartSetIntent start_set = 17;
  }
  reserved 10, 12, 14, 15, 16;
  reserved "fewer_reps", "skip_rest", "rate_exercise", "skip_warmup";
}

message HeartRateSample {
  int64 sampled_at = 1; // Unix milliseconds
  float bpm = 2;
  HeartRateAvailability availability = 3;
}

message WearSensorBatch {
  string batch_id = 1; // client-generated UUID for durable dedupe
  string workout_id = 2;
  int64 sent_at = 3; // Unix milliseconds
  repeated HeartRateSample heart_rate_samples = 4;
}

message WearSensorBatchAck {
  string batch_id = 1;
  string workout_id = 2;
  int64 received_at = 3; // Unix milliseconds on phone receipt
}
