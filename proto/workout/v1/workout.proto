syntax = "proto3";
package workout.v1;

import "workout/v1/settings.proto";

// --- Data Structures ---

// The 10-muscle taxonomy. Volume, recovery and the exercise catalog all
// use this one list — there is no second muscle grouping anywhere.
enum MuscleGroup {
  MUSCLE_GROUP_UNSPECIFIED = 0;
  MUSCLE_GROUP_QUADS = 1;
  MUSCLE_GROUP_HAMSTRINGS = 2;
  MUSCLE_GROUP_GLUTES = 3;
  MUSCLE_GROUP_CHEST = 4;
  MUSCLE_GROUP_BACK = 5;
  MUSCLE_GROUP_SHOULDERS = 6;
  MUSCLE_GROUP_BICEPS = 7;
  MUSCLE_GROUP_TRICEPS = 8;
  MUSCLE_GROUP_CALVES = 9;
  MUSCLE_GROUP_CORE = 10;
}

enum ExerciseCategory {
  EXERCISE_CATEGORY_UNSPECIFIED = 0;
  EXERCISE_CATEGORY_COMPOUND = 1;
  EXERCISE_CATEGORY_AUXILIARY = 2;
}

// How an exercise is loaded. Drives the equipment filter in the picker
// and the size of a progression step.
enum EquipmentKind {
  EQUIPMENT_KIND_UNSPECIFIED = 0;
  EQUIPMENT_KIND_BARBELL = 1;
  EQUIPMENT_KIND_DUMBBELL = 2;
  EQUIPMENT_KIND_MACHINE = 3;
  EQUIPMENT_KIND_CABLE = 4;
  EQUIPMENT_KIND_BODYWEIGHT = 5;
}

message User {
  string id = 1;
  string name = 2;
  int64 created_at = 3; // Unix timestamp
  string profile_emoji = 4;
  string profile_color_hex = 5;
  float body_weight_kg = 6; // 0 = not set
}

message Workout {
  string id = 1;
  string name = 2;
  int64 start_time = 3;
  int64 end_time = 4;
  string session_id = 5;
  // The template this workout was started from ("" = started empty). Lets
  // the app offer "update your template?" when the session diverged.
  string template_id = 6;
}

enum Exercise {
  EXERCISE_UNSPECIFIED = 0;
  EXERCISE_SQUAT = 1;
  EXERCISE_BENCH_PRESS = 2;
  EXERCISE_DEADLIFT = 3;
  EXERCISE_OVERHEAD_PRESS = 4;
  EXERCISE_BARBELL_ROW = 5;
  EXERCISE_HIP_THRUST = 6;
  EXERCISE_BULGARIAN_SPLIT_SQUAT = 7;
  EXERCISE_ROMANIAN_DEADLIFT = 8;
  EXERCISE_GLUTE_BRIDGE = 9;
  EXERCISE_LUNGE = 10;
  EXERCISE_LEG_CURL = 11;

  // ── Chest ──
  EXERCISE_INCLINE_BENCH_PRESS = 12;
  EXERCISE_DUMBBELL_BENCH_PRESS = 13;
  EXERCISE_INCLINE_DUMBBELL_PRESS = 14;
  EXERCISE_DUMBBELL_FLY = 15;
  EXERCISE_CABLE_FLY = 16;
  EXERCISE_PUSH_UP = 17;
  EXERCISE_CHEST_DIP = 18;
  EXERCISE_MACHINE_CHEST_PRESS = 19;
  EXERCISE_PEC_DECK = 20;

  // ── Back ──
  EXERCISE_PULL_UP = 21;
  EXERCISE_CHIN_UP = 22;
  EXERCISE_LAT_PULLDOWN = 23;
  EXERCISE_SEATED_CABLE_ROW = 24;
  EXERCISE_DUMBBELL_ROW = 25;
  EXERCISE_T_BAR_ROW = 26;
  EXERCISE_PENDLAY_ROW = 27;
  EXERCISE_FACE_PULL = 28;
  EXERCISE_SHRUG = 29;
  EXERCISE_BACK_EXTENSION = 30;

  // ── Shoulders ──
  EXERCISE_DUMBBELL_SHOULDER_PRESS = 31;
  EXERCISE_ARNOLD_PRESS = 32;
  EXERCISE_LATERAL_RAISE = 33;
  EXERCISE_FRONT_RAISE = 34;
  EXERCISE_REAR_DELT_FLY = 35;
  EXERCISE_UPRIGHT_ROW = 36;

  // ── Arms ──
  EXERCISE_BARBELL_CURL = 37;
  EXERCISE_DUMBBELL_CURL = 38;
  EXERCISE_HAMMER_CURL = 39;
  EXERCISE_PREACHER_CURL = 40;
  EXERCISE_CONCENTRATION_CURL = 41;
  EXERCISE_CABLE_CURL = 42;
  EXERCISE_TRICEP_PUSHDOWN = 43;
  EXERCISE_OVERHEAD_TRICEP_EXTENSION = 44;
  EXERCISE_SKULL_CRUSHER = 45;
  EXERCISE_CLOSE_GRIP_BENCH_PRESS = 46;
  EXERCISE_TRICEP_DIP = 47;
  EXERCISE_TRICEP_KICKBACK = 48;

  // ── Legs ──
  EXERCISE_FRONT_SQUAT = 49;
  EXERCISE_LEG_PRESS = 50;
  EXERCISE_LEG_EXTENSION = 51;
  EXERCISE_HACK_SQUAT = 52;
  EXERCISE_GOBLET_SQUAT = 53;
  EXERCISE_WALKING_LUNGE = 54;
  EXERCISE_STEP_UP = 55;
  EXERCISE_CALF_RAISE = 56;
  EXERCISE_SEATED_CALF_RAISE = 57;
  EXERCISE_NORDIC_CURL = 58;
  EXERCISE_GOOD_MORNING = 59;

  // ── Ass ──
  EXERCISE_GLUTE_KICKBACK = 60;
  EXERCISE_SUMO_DEADLIFT = 61;
  EXERCISE_SUMO_SQUAT = 62;
  EXERCISE_CURTSY_LUNGE = 63;
  EXERCISE_FROG_PUMP = 64;
  EXERCISE_SINGLE_LEG_HIP_THRUST = 65;
  EXERCISE_CABLE_PULL_THROUGH = 66;
  EXERCISE_HIP_ABDUCTION = 67;

  // ── Core ──
  EXERCISE_PLANK = 68;
  EXERCISE_HANGING_LEG_RAISE = 69;
  EXERCISE_CABLE_CRUNCH = 70;
  EXERCISE_RUSSIAN_TWIST = 71;
  EXERCISE_AB_WHEEL_ROLLOUT = 72;
  EXERCISE_SIT_UP = 73;
  EXERCISE_CRUNCH = 74;
  EXERCISE_MOUNTAIN_CLIMBER = 75;
  EXERCISE_HIP_ADDUCTION = 76;
}

message ExerciseTypeConfig {
  Exercise exercise = 1;
  float start_weight = 2;   // first working set weight
  float end_weight = 3;     // last working set weight (equal=flat, lower=drop, higher=ramp)
  int32 reps = 4;
  bool include_warmup = 5;
  RestConfig rest_config = 6;
  bool last_set_amrap = 7;  // regime sets this; the last working set becomes AMRAP
  repeated WorkingSetSpec working_sets = 8; // optional explicit working-set prescription
}

message WorkingSetSpec {
  float target_weight = 1;
  int32 target_reps = 2;
  bool is_amrap = 3;
  string instruction = 4;
  reserved 5;
  reserved "progression_hint";
}

message RestConfig {
  int32 rest_after_success = 1;
  int32 rest_after_failure = 2;
  int32 rest_after_warmup = 3;
  int32 rest_after_last_warmup = 4;
}

message ExerciseGroup {
  string id = 1;
  string workout_id = 2;
  string name = 3;
  int32 sets = 4;                // working sets per exercise
  bool interleave_warmups = 5;   // true=alternate warmups between exercises
  int32 workout_order = 6;
  repeated ExerciseTypeConfig exercise_configs = 7;
  RestConfig rest_config = 8;
  string instruction = 9;        // coaching note shown in the UI (not persisted to DB)
  reserved 10, 11;
  reserved "prescribed_by_regime", "materialized_sets";
}

message ProposedSet {
  string id = 1;
  string workout_id = 2;
  int32 workout_order = 3;
  Exercise exercise = 4;
  int32 target_reps = 5;
  float target_weight = 6;
  bool warmup = 7;
  string exercise_group_id = 8;
  int32 rest_after_success = 9;
  int32 rest_after_failure = 10;
  bool cancelled = 11;
  bool is_amrap = 12;           // do as many reps as possible (target_reps is the minimum)
  string instruction = 13;      // optional per-set note shown in the UI
  reserved 14;
  reserved "progression_hint";
}

message CompletedSet {
  string id = 1;
  string workout_id = 2;
  string proposed_set_id = 3;
  int32 actual_reps = 4;
  float actual_weight = 5;
  int64 started_at = 6;
  int64 ended_at = 7;
  int64 rest_until = 8;
}

enum UserMessageKind {
  USER_MESSAGE_KIND_UNSPECIFIED = 0;
  USER_MESSAGE_KIND_COACHING_NOTE = 1;
  USER_MESSAGE_KIND_GROUP_RATIONALE = 2;
  USER_MESSAGE_KIND_LOAD_INCREASE = 3;
  USER_MESSAGE_KIND_LOAD_HOLD = 4;
  USER_MESSAGE_KIND_STALL_DELOAD = 5;
  USER_MESSAGE_KIND_TEMPORAL_DELOAD = 6;
  USER_MESSAGE_KIND_SESSION_UPDATE = 7;
  USER_MESSAGE_KIND_CYCLE_ADVANCE = 8;
}

enum UserMessageSurface {
  USER_MESSAGE_SURFACE_UNSPECIFIED = 0;
  USER_MESSAGE_SURFACE_SCHEDULE = 1;
  USER_MESSAGE_SURFACE_WORKOUT_BRIEFING = 2;
  USER_MESSAGE_SURFACE_WORKOUT_FEED = 3;
}

enum ProgressionChangeKind {
  PROGRESSION_CHANGE_KIND_UNSPECIFIED = 0;
  PROGRESSION_CHANGE_KIND_INCREASE = 1;
  PROGRESSION_CHANGE_KIND_HOLD = 2;
  PROGRESSION_CHANGE_KIND_DELOAD = 3;
  PROGRESSION_CHANGE_KIND_CYCLE_ADVANCE = 4;
}

enum ProgressionMetricKind {
  PROGRESSION_METRIC_KIND_UNSPECIFIED = 0;
  PROGRESSION_METRIC_KIND_WORKING_WEIGHT = 1;
  PROGRESSION_METRIC_KIND_TRAINING_MAX = 2;
}

enum ProgressionReasonKind {
  PROGRESSION_REASON_KIND_UNSPECIFIED = 0;
  PROGRESSION_REASON_KIND_COMPLETED_ALL_WORKING_SETS = 1;
  PROGRESSION_REASON_KIND_MISSED_TARGET_REPS = 2;
  PROGRESSION_REASON_KIND_REPEATED_MISSES = 3;
  PROGRESSION_REASON_KIND_STAGE_ADVANCE = 4;
  PROGRESSION_REASON_KIND_CYCLE_COMPLETED = 5;
  PROGRESSION_REASON_KIND_CLEARED_PROGRESSION_CHECK = 6;
}

message ProgressionDetails {
  ProgressionChangeKind change_kind = 1;
  ProgressionMetricKind metric_kind = 2;
  float previous_weight = 3;
  float next_weight = 4;
  string previous_stage = 5;
  string next_stage = 6;
  string source_workout_id = 7;
  string context_label = 8;
  ProgressionReasonKind reason_kind = 9;
  string reason_text = 10;
}

message UserMessageDetails {
  oneof detail {
    ProgressionDetails progression = 1;
  }
}

message UserMessage {
  string message_key = 1;
  UserMessageKind kind = 2;
  UserMessageSurface surface = 3;
  string title = 4;
  string body = 5;
  bool dismissible = 6;
  int64 created_at = 7;
  int64 updated_at = 8;
  string workout_id = 9;
  string exercise_group_id = 10;
  Exercise exercise = 11;
  string slot_key = 12;
  reserved 13;
  reserved "metadata_json";
  UserMessageDetails details = 14;
  string source_workout_id = 15;
}

// --- RPC Requests/Responses ---

message StartWorkoutRequest {
  string name = 1;
  repeated ExerciseGroup exercise_groups = 2;
  int64 started_at = 3; // Unix seconds; if 0, server uses current time
  // When set, the server builds the groups itself: one group per template
  // exercise, weights from the trackers, sets/reps/rest from the
  // prescription, warmups where prescribed. `exercise_groups` is ignored.
  string template_id = 4;
}
message StartWorkoutResponse {
  string id = 1;
  Workout workout = 2;
  repeated ExerciseGroup exercise_groups = 3;
  repeated ProposedSet proposed_sets = 4;
  repeated CompletedSet completed_sets = 5;
  ProposedSet next_up_set = 6;
  WorkoutStateSnapshot state_snapshot = 7;
  repeated UserMessage user_messages = 8;
}

message GetWorkoutRequest {
  string workout_id = 1;
}
// Server-computed rollup for one exercise within a workout (working sets only).
message ExerciseSummary {
  Exercise exercise = 1;
  int32 total_sets = 2;
  int32 total_reps = 3;
  float total_volume = 4;        // lb (reps * weight, summed)
  float best_one_rep_max = 5;    // lb, Epley estimate
  float heaviest_set_weight = 6; // lb
}

// Server-computed rollup for a whole workout. The client renders this directly
// instead of aggregating raw sets. Volume/per-exercise cover working sets only;
// the time breakdown covers every completed set (warmups included).
message WorkoutSummary {
  float total_volume = 1;         // lb
  int64 duration_seconds = 2;
  int64 lifting_seconds = 3;
  int64 resting_seconds = 4;
  int64 yapping_seconds = 5;      // between-set time that isn't lifting or resting
  float volume_per_minute = 6;    // lb per lifting-minute
  float work_rest_ratio = 7;
  repeated ExerciseSummary exercises = 8; // sorted by volume, heaviest first
}

message GetWorkoutResponse {
  Workout workout = 1;
  repeated ExerciseGroup exercise_groups = 2;
  repeated ProposedSet proposed_sets = 3;
  repeated CompletedSet completed_sets = 4;
  ProposedSet next_up_set = 5;
  WorkoutPlanChangeStats plan_change_stats = 6;
  WorkoutStateSnapshot state_snapshot = 7;
  repeated UserMessage user_messages = 8;
  WorkoutSummary summary = 9;
}

message WorkoutPlanChangeStats {
  int32 cancelled_total = 1;
  int32 cancelled_warmups = 2;
  int32 cancelled_working = 3;
}

enum WorkoutState {
  WORKOUT_STATE_UNSPECIFIED = 0;
  WORKOUT_STATE_ALL_DONE = 1;
  WORKOUT_STATE_LIFTING = 2;
  WORKOUT_STATE_RESTING = 3;
  WORKOUT_STATE_READY = 5;
}

message WorkoutStateSnapshot {
  WorkoutState state = 1;
  ProposedSet display_set = 2;
  int64 active_started_at = 3;
  int64 rest_until = 4;
  int64 last_rest_end = 5;
}

message ListWorkoutsRequest {}

message ListWorkoutsResponse {
  repeated Workout workouts = 1;
}

message WorkoutWithSummary {
  Workout workout = 1;
  WorkoutSummary summary = 2;
}

message ListWorkoutSummariesRequest {}
message ListWorkoutSummariesResponse {
  repeated WorkoutWithSummary workouts = 1; // finished, newest first
}

// One session's data point for one exercise (working sets only).
message ExerciseProgressPoint {
  int64 date = 1;             // workout start_time, unix seconds
  string workout_id = 2;
  float top_weight = 3;       // heaviest working set, lb
  int32 top_reps = 4;         // reps at that heaviest set
  float best_one_rep_max = 5; // lb, Epley
  float volume = 6;           // lb
  int32 sets = 7;
}
message ExerciseProgress {
  Exercise exercise = 1;
  repeated ExerciseProgressPoint points = 2; // oldest first
}
// Lifting experience, used to scale recommended starting weights.
enum ExperienceLevel {
  EXPERIENCE_LEVEL_UNSPECIFIED = 0;
  EXPERIENCE_LEVEL_CUTE = 1;         // brand new
  EXPERIENCE_LEVEL_BEGINNER = 2;
  EXPERIENCE_LEVEL_INTERMEDIATE = 3;
  EXPERIENCE_LEVEL_EXPERT = 4;
}

message GetExerciseProgressRequest {}
message GetExerciseProgressResponse {
  repeated ExerciseProgress exercises = 1; // most-improved first
  int32 workout_count = 2;
  float total_volume = 3;  // lb, all working sets ever
  int64 since = 4;         // earliest workout start_time (unix seconds)
}

message PlannedGroupSet {
  Exercise exercise = 1;
  int32 target_reps = 2;
  float target_weight = 3;
  bool warmup = 4;
  int32 rest_after_success = 5;
  int32 rest_after_failure = 6;
  bool is_amrap = 7;
  string instruction = 8;
  reserved 9;
  reserved "progression_hint";
  string client_set_id = 10;
}

// Which exercises in a group plan should get a server-generated warmup ladder.
// Wrapped in a message so presence is meaningful: an unset `warmup_plan` means
// "the client didn't say" (keep whatever warmups the group already has), while a
// set-but-empty `exercises` means "no warmups at all". A bare repeated field
// couldn't tell those apart.
message GroupWarmupPlan {
  repeated Exercise exercises = 1;
}

message ReplaceExerciseGroupPlanRequest {
  string workout_id = 1;
  string exercise_group_id = 2; // empty = create new group
  string name = 3;
  bool interleave_warmups = 4;
  repeated PlannedGroupSet sets = 5; // explicit set order from frontend
  RestConfig rest_config = 6;        // optional group-level metadata
  bool delete_group_if_empty = 7;    // if true and sets empty, remove the group
  string instruction = 8;
  bool create_if_missing = 9;        // if true and exercise_group_id is unknown, create with that id
  // Warmup intent. The client sends working sets only; the server materializes
  // the ladders for the exercises named here (both when creating a group and
  // when editing one).
  GroupWarmupPlan warmup_plan = 10;
}

message ReplaceExerciseGroupPlanResponse {
  ExerciseGroup group = 1;
  repeated ProposedSet generated_sets = 2;
  ProposedSet next_up_set = 3;
  WorkoutStateSnapshot state_snapshot = 4;
}







message StartSetRequest {

  string workout_id = 1;

  string proposed_set_id = 2;

  int64 started_at = 3; // Unix seconds; if 0, server uses current time

}

message StartSetResponse {

  CompletedSet completed_set = 1;

  ProposedSet next_up_set = 2;

  WorkoutStateSnapshot state_snapshot = 3;

  repeated UserMessage user_messages = 4;

}



message CompleteSetRequest {

  string workout_id = 1;

  string proposed_set_id = 2;

  int32 actual_reps = 3;

  float actual_weight = 4;

  int64 completed_at = 5; // Unix seconds; if 0, server uses current time

}

message CompleteSetResponse {

  CompletedSet completed_set = 1;

  ProposedSet next_up_set = 2;

  WorkoutStateSnapshot state_snapshot = 3;

  repeated UserMessage user_messages = 4;

}



message DeleteCompletedSetRequest {

  string workout_id = 1;

  string completed_set_id = 2;

}

message DeleteCompletedSetResponse {
  ProposedSet next_up_set = 1;
  WorkoutStateSnapshot state_snapshot = 2;
  repeated UserMessage user_messages = 3;
}

message CancelProposedSetRequest {
  string workout_id = 1;
  string proposed_set_id = 2;
}

message CancelProposedSetResponse {
  ProposedSet next_up_set = 1;
  WorkoutStateSnapshot state_snapshot = 2;
  repeated UserMessage user_messages = 3;
}



message EndWorkoutRequest {

  string workout_id = 1;

  int64 ended_at = 2; // Unix seconds; if 0, server uses current time

}

message EndWorkoutResponse {

  Workout workout = 1;

  repeated UserMessage user_messages = 2;

}



// ── Templates, trackers, and the home screen ──

// A named, ordered list of exercises. Nothing else: sets, reps, rest and
// weight all derive from the prescription and the tracker, so every
// template that contains an exercise shows the same current weight.
message WorkoutTemplate {
  string id = 1;
  string name = 2;
  int32 order = 3;
  repeated Exercise exercises = 4;
  int64 created_at = 5;
  int64 updated_at = 6;
}

// The resolved state of one exercise for one user: the weight and the
// prescription the next workout will use. GetHome returns one for every
// exercise in the catalog, so the client never needs a fallback table.
message ExerciseTracker {
  Exercise exercise = 1;
  float working_weight = 2;        // lb, snapped for the user's unit
  int32 sets = 3;                  // resolved (override or derived)
  int32 target_reps = 4;           // current position in the rep range
  int32 rep_range_low = 5;
  int32 rep_range_high = 6;
  int32 rest_seconds = 7;
  int32 rest_seconds_failure = 8;
  bool include_warmup = 9;
  int64 last_performed_at = 10;
  repeated float weight_history = 11; // top working weight per session, oldest first
  bool overridden = 12;            // the user has set sets or the rep range by hand
  MuscleGroup primary_muscle = 13;
  ExerciseCategory category = 14;
  EquipmentKind equipment = 15;
}

// Weighted hard sets for one muscle over the rolling last 7 days.
// A completed working set counts 1.0 for the exercise's primary muscle
// and 0.5 for each secondary; warmups and cancelled sets count 0.
message MuscleVolume {
  MuscleGroup muscle = 1;
  float completed_sets_7d = 2;
  int32 target_low = 3;            // 10
  int32 target_high = 4;           // 20
}

message MuscleRecoveryStatus {
  string muscle_key = 1;      // "chest", "quads", ...
  string label = 2;           // "Chest"
  int64 last_trained_at = 3;  // 0 = never
  int64 recovered_at = 4;     // last_trained_at + window (0 = never trained)
  float fraction = 5;         // 0.0 (just trained) → 1.0 (recovered)
  int64 hours_remaining = 6;  // hours until recovered (0 if recovered)
  bool recovered = 7;
  reserved 8;
  reserved "in_next_workout";
}

message GetHomeRequest {}

message GetHomeResponse {
  repeated WorkoutTemplate templates = 1;   // in user order
  repeated ExerciseTracker trackers = 2;    // every exercise, resolved
  string active_workout_id = 3;
  repeated UserMessage user_messages = 4;
  repeated MuscleVolume volume = 5;
  repeated MuscleRecoveryStatus recovery = 6;
  // A stateless suggestion: the template whose muscles are furthest
  // below the volume band, ties broken toward the least recently
  // started. Never a gate — any template can be started.
  string suggested_template_id = 7;
  string suggestion_reason = 8;             // "Back and biceps are 6 sets behind"
  bool onboarded = 9;                       // templates or workouts exist
}

// Create when id is empty; update when it exists.
message SaveTemplateRequest {
  WorkoutTemplate template = 1;
}
message SaveTemplateResponse {
  WorkoutTemplate template = 1;
}

message DeleteTemplateRequest {
  string template_id = 1;
}
message DeleteTemplateResponse {}

message ReorderTemplatesRequest {
  repeated string template_ids = 1;
}
message ReorderTemplatesResponse {}

// Manual correction / override for one exercise. working_weight is the
// full new value (send the current one to keep it). Overrides of 0 mean
// "derived". current_reps resets to the resolved range bottom.
message SetExerciseTrackerRequest {
  Exercise exercise = 1;
  float working_weight = 2;        // lb
  int32 override_sets = 3;         // 0 = derived
  int32 override_rep_low = 4;      // 0 = derived
  int32 override_rep_high = 5;     // 0 = derived
}
message SetExerciseTrackerResponse {
  ExerciseTracker tracker = 1;
}

// Finishes setup: saves the unit, seeds trackers for the main lifts from
// bodyweight and experience (catalog openers when skipped), and copies
// the default templates. Does nothing when templates already exist.
message CompleteOnboardingRequest {
  float body_weight_kg = 1;        // 0 = skipped
  ExperienceLevel experience = 2;  // unspecified = skipped
  WeightUnit unit = 3;
}
message CompleteOnboardingResponse {
  GetHomeResponse home = 1;
}



message GetActiveWorkoutRequest {}

message GetActiveWorkoutResponse {

  Workout workout = 1;

}







message ReorderExerciseGroupsRequest {
  string workout_id = 1;
  repeated string exercise_group_ids = 2;
}

message ReorderExerciseGroupsResponse {
  ProposedSet next_up_set = 1;
  WorkoutStateSnapshot state_snapshot = 2;
  repeated UserMessage user_messages = 3;
}

message WorkoutHeartRatePoint {
  int64 sampled_at = 1; // Unix milliseconds
  float bpm = 2;
  int32 availability = 3;
}

message AppendWorkoutHeartRateRequest {
  string workout_id = 1;
  repeated WorkoutHeartRatePoint samples = 2;
}

message AppendWorkoutHeartRateResponse {
  int32 stored = 1;
}

message GetWorkoutHeartRateRequest {
  string workout_id = 1;
}

message GetWorkoutHeartRateResponse {
  repeated WorkoutHeartRatePoint samples = 1;
}

message WorkoutMutation {
  string event_id = 1;
  int64 client_created_at = 2; // Unix seconds from client clock
  oneof mutation {
    StartSetRequest start_set = 10;
    CompleteSetRequest complete_set = 11;
    CancelProposedSetRequest cancel_proposed_set = 12;
    DeleteCompletedSetRequest delete_completed_set = 13;
    EndWorkoutRequest end_workout = 14;
    ReplaceExerciseGroupPlanRequest replace_exercise_group_plan = 15;
    ReorderExerciseGroupsRequest reorder_exercise_groups = 16;
  }
}

message AppendWorkoutMutationsRequest {
  repeated WorkoutMutation mutations = 1;
}

message AppendWorkoutMutationsResponse {
  repeated string applied_event_ids = 1;
  GetWorkoutResponse workout_state = 2;
}

message DismissUserMessagesRequest {
  repeated string message_keys = 1;
}

message DismissUserMessagesResponse {
  repeated string dismissed_message_keys = 1;
}



// --- Service Definition ---

service WorkoutService {
  rpc StartWorkout(StartWorkoutRequest) returns (StartWorkoutResponse);
  rpc EndWorkout(EndWorkoutRequest) returns (EndWorkoutResponse);
  rpc GetWorkout(GetWorkoutRequest) returns (GetWorkoutResponse);
  rpc GetActiveWorkout(GetActiveWorkoutRequest) returns (GetActiveWorkoutResponse);

  // List all workouts for the user (user from auth context)
  rpc ListWorkouts(ListWorkoutsRequest) returns (ListWorkoutsResponse);

  // Finished workouts with their server-computed summaries (history screen).
  rpc ListWorkoutSummaries(ListWorkoutSummariesRequest) returns (ListWorkoutSummariesResponse);
  // Per-exercise progress series, everything precomputed (progress + detail).
  rpc GetExerciseProgress(GetExerciseProgressRequest) returns (GetExerciseProgressResponse);

  rpc ReplaceExerciseGroupPlan(ReplaceExerciseGroupPlanRequest) returns (ReplaceExerciseGroupPlanResponse);
  rpc ReorderExerciseGroups(ReorderExerciseGroupsRequest) returns (ReorderExerciseGroupsResponse);

  rpc StartSet(StartSetRequest) returns (StartSetResponse);
  rpc CompleteSet(CompleteSetRequest) returns (CompleteSetResponse);
  rpc DeleteCompletedSet(DeleteCompletedSetRequest) returns (DeleteCompletedSetResponse);
  rpc CancelProposedSet(CancelProposedSetRequest) returns (CancelProposedSetResponse);
  rpc AppendWorkoutMutations(AppendWorkoutMutationsRequest) returns (AppendWorkoutMutationsResponse);
  rpc AppendWorkoutHeartRate(AppendWorkoutHeartRateRequest) returns (AppendWorkoutHeartRateResponse);
  rpc GetWorkoutHeartRate(GetWorkoutHeartRateRequest) returns (GetWorkoutHeartRateResponse);

  // Everything the home screen needs in one round trip: templates,
  // trackers, volume, recovery, the suggestion, and pending messages.
  rpc GetHome(GetHomeRequest) returns (GetHomeResponse);
  rpc SaveTemplate(SaveTemplateRequest) returns (SaveTemplateResponse);
  rpc DeleteTemplate(DeleteTemplateRequest) returns (DeleteTemplateResponse);
  rpc ReorderTemplates(ReorderTemplatesRequest) returns (ReorderTemplatesResponse);
  rpc SetExerciseTracker(SetExerciseTrackerRequest) returns (SetExerciseTrackerResponse);
  rpc CompleteOnboarding(CompleteOnboardingRequest) returns (CompleteOnboardingResponse);

  rpc DismissUserMessages(DismissUserMessagesRequest) returns (DismissUserMessagesResponse);
}

message CreateUserRequest {
  string name = 1;
}

message CreateUserResponse {
  User user = 1;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  User user = 1;
}

message UpdateMyProfileRequest {
  string profile_emoji = 1;
  string profile_color_hex = 2;
  float body_weight_kg = 3; // 0 = unchanged
}

message UpdateMyProfileResponse {
  User user = 1;
}

service UserService {
  // Create a new user
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  // Get user by ID
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  // Update the authenticated user's profile metadata.
  rpc UpdateMyProfile(UpdateMyProfileRequest) returns (UpdateMyProfileResponse);
}
