syntax = "proto3";
package workout.v1;

import "workout/v1/settings.proto";

// --- Data Structures ---

// MuscleGroup is defined in settings.proto.

// How an exercise is loaded. Drives the equipment filter in the picker
// and the size of a progression step.
enum EquipmentKind {
  EQUIPMENT_KIND_UNSPECIFIED = 0;
  EQUIPMENT_KIND_BARBELL = 1;
  EQUIPMENT_KIND_DUMBBELL = 2;
  EQUIPMENT_KIND_MACHINE = 3;
  EQUIPMENT_KIND_CABLE = 4;
  EQUIPMENT_KIND_BODYWEIGHT = 5;
}

message User {
  string id = 1;
  string name = 2;
  int64 created_at = 3; // Unix timestamp
  string profile_emoji = 4;
  string profile_color_hex = 5;
  float body_weight_kg = 6; // 0 = not set
}

message Workout {
  string id = 1;
  string name = 2;
  int64 start_time = 3;
  int64 end_time = 4;
  string session_id = 5;
  // The template this workout was started from ("" = started empty). Lets
  // the app offer "update your template?" when the session diverged.
  string template_id = 6;
  // The set being lifted: set by StartSet, cleared by its Done (or by
  // removing the set). "" when nothing is in progress.
  string lifting_set_id = 7;
  int64 lifting_started_at = 8; // Unix seconds; 0 when lifting_set_id is ""
}

enum Exercise {
  EXERCISE_UNSPECIFIED = 0;
  EXERCISE_SQUAT = 1;
  EXERCISE_BENCH_PRESS = 2;
  EXERCISE_DEADLIFT = 3;
  EXERCISE_OVERHEAD_PRESS = 4;
  EXERCISE_BARBELL_ROW = 5;
  EXERCISE_HIP_THRUST = 6;
  EXERCISE_BULGARIAN_SPLIT_SQUAT = 7;
  EXERCISE_ROMANIAN_DEADLIFT = 8;
  EXERCISE_GLUTE_BRIDGE = 9;
  EXERCISE_LUNGE = 10;
  EXERCISE_LEG_CURL = 11;

  // ── Chest ──
  EXERCISE_INCLINE_BENCH_PRESS = 12;
  EXERCISE_DUMBBELL_BENCH_PRESS = 13;
  EXERCISE_INCLINE_DUMBBELL_PRESS = 14;
  EXERCISE_DUMBBELL_FLY = 15;
  EXERCISE_CABLE_FLY = 16;
  EXERCISE_PUSH_UP = 17;
  EXERCISE_CHEST_DIP = 18;
  EXERCISE_MACHINE_CHEST_PRESS = 19;
  EXERCISE_PEC_DECK = 20;

  // ── Back ──
  EXERCISE_PULL_UP = 21;
  EXERCISE_CHIN_UP = 22;
  EXERCISE_LAT_PULLDOWN = 23;
  EXERCISE_SEATED_CABLE_ROW = 24;
  EXERCISE_DUMBBELL_ROW = 25;
  EXERCISE_T_BAR_ROW = 26;
  EXERCISE_PENDLAY_ROW = 27;
  EXERCISE_FACE_PULL = 28;
  EXERCISE_SHRUG = 29;
  EXERCISE_BACK_EXTENSION = 30;

  // ── Shoulders ──
  EXERCISE_DUMBBELL_SHOULDER_PRESS = 31;
  EXERCISE_ARNOLD_PRESS = 32;
  EXERCISE_LATERAL_RAISE = 33;
  EXERCISE_FRONT_RAISE = 34;
  EXERCISE_REAR_DELT_FLY = 35;
  EXERCISE_UPRIGHT_ROW = 36;

  // ── Arms ──
  EXERCISE_BARBELL_CURL = 37;
  EXERCISE_DUMBBELL_CURL = 38;
  EXERCISE_HAMMER_CURL = 39;
  EXERCISE_PREACHER_CURL = 40;
  EXERCISE_CONCENTRATION_CURL = 41;
  EXERCISE_CABLE_CURL = 42;
  EXERCISE_TRICEP_PUSHDOWN = 43;
  EXERCISE_OVERHEAD_TRICEP_EXTENSION = 44;
  EXERCISE_SKULL_CRUSHER = 45;
  EXERCISE_CLOSE_GRIP_BENCH_PRESS = 46;
  EXERCISE_TRICEP_DIP = 47;
  EXERCISE_TRICEP_KICKBACK = 48;

  // ── Legs ──
  EXERCISE_FRONT_SQUAT = 49;
  EXERCISE_LEG_PRESS = 50;
  EXERCISE_LEG_EXTENSION = 51;
  EXERCISE_HACK_SQUAT = 52;
  EXERCISE_GOBLET_SQUAT = 53;
  EXERCISE_WALKING_LUNGE = 54;
  EXERCISE_STEP_UP = 55;
  EXERCISE_CALF_RAISE = 56;
  EXERCISE_SEATED_CALF_RAISE = 57;
  EXERCISE_NORDIC_CURL = 58;
  EXERCISE_GOOD_MORNING = 59;

  // ── Ass ──
  EXERCISE_GLUTE_KICKBACK = 60;
  EXERCISE_SUMO_DEADLIFT = 61;
  EXERCISE_SUMO_SQUAT = 62;
  EXERCISE_CURTSY_LUNGE = 63;
  EXERCISE_FROG_PUMP = 64;
  EXERCISE_SINGLE_LEG_HIP_THRUST = 65;
  EXERCISE_CABLE_PULL_THROUGH = 66;
  EXERCISE_HIP_ABDUCTION = 67;

  // ── Core ──
  EXERCISE_PLANK = 68;
  EXERCISE_HANGING_LEG_RAISE = 69;
  EXERCISE_CABLE_CRUNCH = 70;
  EXERCISE_RUSSIAN_TWIST = 71;
  EXERCISE_AB_WHEEL_ROLLOUT = 72;
  EXERCISE_SIT_UP = 73;
  EXERCISE_CRUNCH = 74;
  EXERCISE_MOUNTAIN_CLIMBER = 75;
  EXERCISE_HIP_ADDUCTION = 76;
}

message ProposedSet {
  string id = 1;
  string workout_id = 2;
  int32 workout_order = 3;
  Exercise exercise = 4;
  int32 target_reps = 5;
  float target_weight = 6;
  bool warmup = 7;
  // The rest after this set, in seconds (an exercise's last set rests the
  // short between-exercise rest instead).
  int32 rest_seconds = 9;
  bool cancelled = 11;
  // A calibration rung: a 5-rep set on the first session of a loaded
  // exercise. Its reps decide the next rung or the working weight. Counts
  // as a warmup for volume and summaries.
  bool calibration = 15;
  // A warmup the person chose not to do ("skip all warmups"). It stays in
  // the plan and on screen, nothing waits on it, and it can still be done.
  bool skipped = 16;
  reserved 8, 10, 12, 13, 14;
  reserved "exercise_group_id", "is_amrap", "instruction", "progression_hint", "rest_after_success", "rest_after_failure";
}

message CompletedSet {
  string id = 1;
  string workout_id = 2;
  string proposed_set_id = 3;
  int32 actual_reps = 4;
  float actual_weight = 5;
  int64 ended_at = 7;
  int64 rest_until = 8;
  // When the set was started (its StartSet), 0 if it was done without
  // one. Lifting is started_at → ended_at.
  int64 started_at = 11;
  // A calibration rung done in full: the user's answer to "how many more
  // could you have done?" (AnswerRungRequest). Unspecified when unanswered.
  RepsLeft reps_left = 12;
  // A calibration rung done in full answered with a specific jump instead
  // (AnswerRungRequest.jump_lb): the pounds added for the next rung. 0
  // when not. At most one of reps_left and jump_lb is set.
  float jump_lb = 13;
  reserved 6, 9, 10;
  reserved "rest_skipped", "effort";
}

// How many more reps a calibration rung done in full had left in it. Each
// answer counts as a reserve in the rung's shown max (core/src/plan.rs):
// 0–1 as 0.5, 2–4 as 3, 5+ as 8.
enum RepsLeft {
  REPS_LEFT_UNSPECIFIED = 0; // not answered
  REPS_LEFT_ZERO_TO_ONE = 1;
  REPS_LEFT_TWO_TO_FOUR = 2;
  REPS_LEFT_FIVE_PLUS = 3;
}

// ── Plans: what each lift is given, and why ──
//
// One rule decides every lift's sets, reps and weight (core/src/plan.rs),
// when a workout starts, from the lift's estimated max and the time the
// user has. Its answer is an ExerciseDecision, recorded in the StartWorkout
// (or AddExercises) event and laid out from there; changes during the
// workout are recorded beside it as WeightChanges.

enum PlanReasonKind {
  PLAN_REASON_KIND_UNSPECIFIED = 0;
  // Every working rep hit last time: the max nudged up.
  PLAN_REASON_KIND_MAX_UP = 1;
  // A rep missed last time: the max reset to the most a set showed.
  PLAN_REASON_KIND_MAX_FROM_MISS = 2;
  // Stopped early, a rushed miss, or the user lowered the weight: the max
  // unchanged. `cause` says which when it was not the weight (STOPPED_EARLY,
  // RUSHED).
  PLAN_REASON_KIND_HELD = 3;
  // Three weeks or more away (six or more): the max cut to 90% (80%).
  PLAN_REASON_KIND_TIME_OFF = 4;
  // Never done: a calibration ramp finds the max (a bodyweight lift
  // starts at the bottom of its range).
  PLAN_REASON_KIND_FIRST_TIME = 5;
  // The user's own weight and reps, set at `at`.
  PLAN_REASON_KIND_USER_SET = 6;
  // This many sets: what the time budget fits, given to the lifts whose
  // muscles are furthest behind this week.
  PLAN_REASON_KIND_SETS_FROM_TIME = 7;
  // The plan against the lift's last session, what the user sees move:
  // before/after are the weights (lb), reps_*/sets_* the reps and sets,
  // and `cause` why. One of these comes first whenever the lift has a
  // last session to compare with (not after an override or a ramp alone).
  // Heavier than last time.
  PLAN_REASON_KIND_WEIGHT_UP = 8;
  // Lighter than last time.
  PLAN_REASON_KIND_WEIGHT_DOWN = 9;
  // The same weight, more reps.
  PLAN_REASON_KIND_REPS_UP = 10;
  // The same weight, fewer reps.
  PLAN_REASON_KIND_REPS_DOWN = 11;
  // The same weight and reps as last time.
  PLAN_REASON_KIND_SAME_AS_LAST = 12;
}

// Why a plan differs from (or matches) the lift's last session.
enum PlanChangeCause {
  PLAN_CHANGE_CAUSE_UNSPECIFIED = 0;
  // Every rep hit last time.
  PLAN_CHANGE_CAUSE_HIT = 1;
  // A rep missed last time.
  PLAN_CHANGE_CAUSE_MISSED = 2;
  // Last time stopped early: the max held.
  PLAN_CHANGE_CAUSE_STOPPED_EARLY = 3;
  // A different number of sets: last time's sets would have kept last
  // time's numbers (sets_before, sets_after).
  PLAN_CHANGE_CAUSE_SETS = 4;
  // Three weeks or more away (days_off): the max cut.
  PLAN_CHANGE_CAUSE_TIME_OFF = 5;
  // Every working set done, but a miss came before the previous set's rest
  // was up: excused, the max held.
  PLAN_CHANGE_CAUSE_RUSHED = 6;
}

// One step of a decision, in the order the steps applied.
message PlanReason {
  PlanReasonKind kind = 1;
  // The estimated max (rep max for bodyweight) before and after the step.
  // FIRST_TIME: the starting weight and the ramp's first rung.
  // SETS_FROM_TIME: the sets every lift starts with, and this lift's.
  float before = 2;
  float after = 3;
  // TIME_OFF: whole days since the lift was done.
  int32 days_off = 4;
  // MAX_UP, MAX_FROM_MISS, HELD: the session it follows; MAX_FROM_MISS
  // the set that showed the max.
  string workout_id = 5;
  string set_id = 6;
  // When the step's source happened (Unix seconds): the session's end, or
  // the override.
  int64 at = 7;
  // SETS_FROM_TIME: the budget, this lift's primary muscle and its hard
  // sets this week before the workout.
  int32 budget_minutes = 8;
  MuscleGroup muscle = 9;
  float weekly_sets = 10;
  // WEIGHT_UP .. SAME_AS_LAST: why, and last time's reps and sets against
  // this plan's. HELD: STOPPED_EARLY or RUSHED, or unspecified (a lowered
  // weight).
  PlanChangeCause cause = 11;
  int32 reps_before = 12;
  int32 reps_after = 13;
  int32 sets_before = 14;
  int32 sets_after = 15;
}

// What one lift is given in a workout: everything its sets are laid out
// from.
message ExerciseDecision {
  Exercise exercise = 1;
  int32 sets = 2;
  int32 reps = 3;
  // lb; 0 for bodyweight. A calibration ramp's first rung.
  float weight = 4;
  int32 rest_seconds = 5;
  // A warmup ladder before the working sets.
  bool warmups = 6;
  // The class's rep range.
  int32 rep_low = 7;
  int32 rep_high = 8;
  // The estimated max (rep max for bodyweight) this was planned from; 0
  // when not known yet (never done).
  float max = 9;
  // Never done, loaded: the sets start with a calibration ramp of rungs
  // from `weight`, and the working sets follow from the max it finds.
  bool calibration = 10;
  int32 budget_minutes = 11;
  // This lift's share of the workout's estimated length: its sets, its
  // warmups, and the move to it from the lift before.
  int32 estimated_seconds = 12;
  repeated PlanReason reasons = 13;
}

enum WeightChangeCause {
  WEIGHT_CHANGE_CAUSE_UNSPECIFIED = 0;
  // AdjustExerciseWeight, from the phone or the watch.
  WEIGHT_CHANGE_CAUSE_USER_ADJUST = 1;
  // The calibration ramp's next rung.
  WEIGHT_CHANGE_CAUSE_CALIBRATION_STEP = 2;
  // The ramp done: the working weight set.
  WEIGHT_CHANGE_CAUSE_CALIBRATION_SETTLED = 3;
  // EditCompletedSet: the weight recorded on a done set fixed.
  WEIGHT_CHANGE_CAUSE_CORRECTION = 4;
}

// A weight changed during a workout, and why.
message WeightChange {
  int64 at = 1; // Unix seconds
  // The first set the new weight applies to (CORRECTION: the set fixed).
  string from_set_id = 2;
  float before = 3; // lb
  float after = 4; // lb
  WeightChangeCause cause = 5;
}

// One exercise in a workout: the decision it started from, then every
// change to its weight, in order.
message ExerciseLog {
  ExerciseDecision decision = 1;
  repeated WeightChange changes = 2;
}

// The decision an exercise would get if a workout started now, as every
// screen shows it.
message ExercisePlan {
  ExerciseDecision decision = 1;
  // The user has set it by hand (an override is the latest word on it).
  bool overridden = 2;
  MuscleGroup primary_muscle = 3;
  EquipmentKind equipment = 4;
  // When it was last done (the session's end), 0 = never.
  int64 last_performed_at = 5;
  reserved 6;
  reserved "secondary_muscles";
}

// --- RPC Requests/Responses ---

message StartWorkoutRequest {
  string name = 1;
  reserved 2;
  reserved "exercise_groups";
  int64 started_at = 3; // Unix seconds; 0 = the event's time
  // The template it starts from ("" = none); names the workout.
  string template_id = 4;
  // The exercises, in order: the template's when it names one (the
  // library's of now for a coupled template), filled in by the core.
  repeated Exercise exercises = 5;
  // The time the user has; 0 = the default (60).
  int32 budget_minutes = 7;
  // What each exercise is given, decided by the core (plan) when the event
  // is recorded. The workout's sets are laid out from these alone.
  repeated ExerciseDecision decisions = 6;
}
message StartWorkoutResponse {
  string id = 1;
  Workout workout = 2;
  reserved 3;
  reserved "exercise_groups";
  repeated ProposedSet proposed_sets = 4;
  repeated CompletedSet completed_sets = 5;
  ProposedSet next_up_set = 6;
  WorkoutStateSnapshot state_snapshot = 7;
  repeated ExerciseLog exercise_logs = 9;
  reserved 8;
  reserved "user_messages";
}

message GetWorkoutRequest {
  string workout_id = 1;
}

// The rollup for one exercise within a workout (working sets only).
message ExerciseSummary {
  Exercise exercise = 1;
  int32 total_sets = 2;
  int32 total_reps = 3;
  float total_volume = 4; // lb (reps * weight, summed)
  reserved 5;
  reserved "best_one_rep_max";
  float heaviest_set_weight = 6; // lb
}

// The rollup for a whole workout. The client renders this directly
// instead of aggregating raw sets. Volume/per-exercise cover working sets only;
// resting and yapping cover every completed set (warmups included).
message WorkoutSummary {
  float total_volume = 1; // lb
  int64 duration_seconds = 2;
  int64 resting_seconds = 4;
  // Between consecutive done sets, the time after the prescribed rest ended
  // until the next set was started (or done, if it never was): the YAPPING
  // state, summed.
  int64 yapping_seconds = 9;
  // Start to Done, summed over every set that was started: LIFTING.
  int64 lifting_seconds = 10;
  repeated ExerciseSummary exercises = 8; // sorted by volume, heaviest first
  reserved 3, 5, 6, 7;
  reserved "volume_per_minute", "work_rest_ratio";
}

message GetWorkoutResponse {
  Workout workout = 1;
  reserved 2;
  reserved "exercise_groups";
  repeated ProposedSet proposed_sets = 3;
  repeated CompletedSet completed_sets = 4;
  ProposedSet next_up_set = 5;
  WorkoutStateSnapshot state_snapshot = 7;
  WorkoutSummary summary = 9;
  // The calibration rung (a proposed set id) whose "how many more could you
  // have done?" is open: done in full, unanswered, the latest rung of its
  // lift, the rung it appended still to lift and nothing being lifted.
  // Empty when none. An AnswerRungRequest applies only to this set.
  string rung_question_set_id = 12;
  // What each range answer to that question leads to, worked out by
  // answering a copy: 0–1 settles the ramp (weight = the working sets'),
  // 2–4 and 5+ the next ramp set's weight. Empty when no question is open.
  repeated RungOutcome rung_outcomes = 13;
  // Undone warmups that are behind you (skipped, or a working set of their
  // exercise is done): shown out of the way, nothing waits on them.
  repeated string passed_warmup_ids = 10;
  // Per exercise: the decision it started from and the changes since.
  repeated ExerciseLog exercise_logs = 11;
  reserved 6, 8;
  reserved "plan_change_stats", "user_messages";
}

// A set is pending, done or cancelled. The workout's state is derived from
// one moment, when the last set was done, and that set's prescribed rest:
//   READY    no set done yet (the first set is up)
//   LIFTING  a set has been started and not yet done (counts up)
//   RESTING  the last done set's rest is still running (counts down)
//   YAPPING  that rest has run out and the next set isn't started (counts up)
//   ALL_DONE nothing left to do
// There is no in-progress set.
enum WorkoutState {
  WORKOUT_STATE_UNSPECIFIED = 0;
  WORKOUT_STATE_ALL_DONE = 1;
  WORKOUT_STATE_RESTING = 3;
  WORKOUT_STATE_READY = 5;
  WORKOUT_STATE_YAPPING = 6;
  WORKOUT_STATE_LIFTING = 7;
  reserved 2;
}

message WorkoutStateSnapshot {
  WorkoutState state = 1;
  ProposedSet display_set = 2; // the next pending set, if any
  // When the last done set's rest ends: RESTING counts down to it, YAPPING
  // counts up from it. 0 when READY or ALL_DONE.
  int64 rest_until = 4;
  // When LIFTING: when the set was started; the lifting timer counts up
  // from it. 0 otherwise.
  int64 lifting_started_at = 7;
  reserved 3, 5, 6;
  reserved "active_started_at", "last_rest_end", "effort_prompt";
}

message WorkoutWithSummary {
  Workout workout = 1;
  WorkoutSummary summary = 2;
}

message ListWorkoutSummariesRequest {}
message ListWorkoutSummariesResponse {
  repeated WorkoutWithSummary workouts = 1; // finished, newest first
}

// One session's data point for one exercise (working sets only).
message ExerciseProgressPoint {
  int64 date = 1; // workout start_time, unix seconds
  string workout_id = 2;
  float top_weight = 3; // heaviest working set, lb
  int32 top_reps = 4; // reps at that heaviest set
  reserved 5;
  reserved "best_one_rep_max";
  float volume = 6; // lb
  int32 sets = 7;
  // The estimated max after this session (rep max for bodyweight).
  float estimated_max = 8;
}
message ExerciseProgress {
  Exercise exercise = 1;
  repeated ExerciseProgressPoint points = 2; // oldest first
}

message GetExerciseProgressRequest {}
message GetExerciseProgressResponse {
  repeated ExerciseProgress exercises = 1; // most-improved first
  int32 workout_count = 2;
  float total_volume = 3; // lb, all working sets ever
  int64 since = 4; // earliest workout start_time (unix seconds)
}

// Append one block of sets per exercise, laid out from its decision.
message AddExercisesRequest {
  string workout_id = 1;
  repeated Exercise exercises = 2;
  // What each added exercise is given, decided by the core (plan) when the
  // event is recorded, in the workout's budget; the lifts already planned
  // keep theirs.
  repeated ExerciseDecision decisions = 4;
  reserved 3;
  reserved "client_working_set_ids";
}

// Move an exercise's remaining working sets to a new weight, in place,
// and regenerate its pending warmups for it. Completed sets untouched.
message AdjustExerciseWeightRequest {
  string workout_id = 1;
  Exercise exercise = 2;
  float working_weight = 3; // lb
  int32 target_reps = 4; // the remaining working sets' reps; 0 = unchanged
}

// Cancel an exercise's pending sets. Completed sets stay.
message RemoveExerciseRequest {
  string workout_id = 1;
  Exercise exercise = 2;
}

// Reorder the exercise blocks. Exercises not listed keep their relative
// order after the listed ones.
message ReorderExercisesRequest {
  string workout_id = 1;
  repeated Exercise exercises = 2;
}

// Skip the exercise's undone warmups: they're marked skipped, never
// removed, and doing one later still records it.
message SkipWarmupsRequest {
  string workout_id = 1;
  Exercise exercise = 2;
}

// What one answer to a rung's question leads to (GetWorkoutResponse.rung_outcomes).
message RungOutcome {
  RepsLeft reps_left = 1;
  float weight = 2; // lb
  // The ramp ends: the weight is the working sets', not a next ramp set's.
  bool settles = 3;
}

// The answer to "how many more could you have done?" on a calibration rung
// done in full. 0–1 ends the ramp there: the working sets are laid out from
// the max the rung shows with that reserve. 2–4 and 5+ re-plan the next
// rung: the weight the max they imply leaves about one rep in reserve on a
// 5-rep set, never less than the usual +10% rung. Or a specific jump
// (jump_lb): the next rung is the rung's weight plus it, snapped to what
// the lift can load (at least one step up); the ramp goes on, and the
// rung's max counts the usual one rep in reserve. Exactly one of reps_left
// and jump_lb is set; jump_lb must be over 0 and at most twice the rung's
// weight. Applies only to the open question
// (GetWorkoutResponse.rung_question_set_id); otherwise a no-op.
message AnswerRungRequest {
  string workout_id = 1;
  string proposed_set_id = 2;
  RepsLeft reps_left = 3;
  float jump_lb = 4; // pounds, like every stored weight; 0 = not a jump
}

// Begin a set: the workout is LIFTING it until its Done. Starting another
// set moves the start to it; starting a done or cancelled set is a no-op.
message StartSetRequest {
  string workout_id = 1;
  string proposed_set_id = 2;
  int64 started_at = 3; // Unix seconds; 0 = the event's time
}

message CompleteSetRequest {
  string workout_id = 1;

  string proposed_set_id = 2;

  int32 actual_reps = 3;

  float actual_weight = 4;

  int64 completed_at = 5; // Unix seconds; 0 = the event's time

  reserved 6;
  reserved "effort";
}

message DeleteCompletedSetRequest {
  string workout_id = 1;

  string completed_set_id = 2;
}

// Correct a done set after the fact (fewer reps, a different weight).
message EditCompletedSetRequest {
  string workout_id = 1;
  string completed_set_id = 2;
  int32 actual_reps = 3;
  float actual_weight = 4;
}

message EndWorkoutRequest {
  string workout_id = 1;

  int64 ended_at = 2; // Unix seconds; 0 = the event's time
}

message EndWorkoutResponse {
  Workout workout = 1;

  reserved 2;
  reserved "user_messages";
}

// ── Templates, plans, and the home screen ──

// A named, ordered list of exercises. Nothing else: sets, reps, rest and
// weight all come from the exercise's plan, so every template that contains
// an exercise shows the same next weight.
message WorkoutTemplate {
  string id = 1;
  string name = 2;
  int32 order = 3;
  repeated Exercise exercises = 4;
  int64 created_at = 5;
  int64 updated_at = 6;
  // The library entry this follows (templates/library.yaml id); empty for
  // one the user made or cloned.
  string library_id = 7;
  // Follows its library entry: the name and exercises shown and started are
  // the library's current ones (the stored ones are kept for when the entry
  // is gone). False for the user's own templates.
  bool coupled = 8;
  // In the rotation the suggestion picks from; out of it, a reserve (on
  // Home, never suggested). The library defaults added at onboarding start
  // in rotation; every other template starts as a reserve.
  bool in_rotation = 9;
  // The library entry this was added from, kept when it becomes the user's
  // own (library_id is cleared then); empty for one the user made. A
  // template with one stands for that entry: the library is not offered
  // again beside it.
  string origin_library_id = 10;
}

// One entry of the template library (templates/library.yaml): a workout
// anyone can copy into their own list. Copies are ordinary templates.
message LibraryTemplate {
  string id = 1;
  string name = 2;
  string blurb = 3;
  string group_key = 4;
  string group_label = 5;
  repeated Exercise exercises = 6;
  bool is_default = 7; // ticked by default during onboarding
}

// Public: the library is the same for everyone.
message ListTemplateLibraryRequest {}
message ListTemplateLibraryResponse {
  repeated LibraryTemplate templates = 1;
  // The ready-made rotations, each naming only templates listed here.
  // Filled by the core from the plans built in; the server's sync leaves
  // it empty.
  repeated LibraryPlan plans = 2;
}

// A ready-made rotation (templates/library.yaml, `plans`): library
// entries, in the order the rotation takes them.
message LibraryPlan {
  string id = 1;
  string name = 2;
  string blurb = 3;
  repeated string library_ids = 4;
}

// Makes a ready-made plan the rotation: its entries the user does not
// have are added (an AddLibraryTemplates event), then one
// ReorderTemplates puts the user's template for each entry (one following
// it or made from it) first, in the plan's order, as the rotation and
// everything else after it as reserves. Nothing is deleted. Returns the
// refreshed home.
message ApplyLibraryPlanRequest {
  string plan_id = 1;
}
message ApplyLibraryPlanResponse {
  GetHomeResponse home = 1;
}

// Adds library entries to the caller's templates, coupled, skipping any
// the caller already has (a template following it, or one of their own
// made from it). Returns the refreshed home.
message AddLibraryTemplatesRequest {
  repeated string library_ids = 1;
  // The entries as the library had them, filled in by the core when the
  // event is recorded, so a replay never reads the library.
  repeated LibraryTemplate entries = 2;
  // Into the rotation; otherwise (the default) they are reserves.
  bool in_rotation = 3;
}

// Make a library template the user's own: it stops following the library
// and keeps its id (and so its history). name and exercises are the
// library's when the event was recorded. Only folded from logs that hold
// it; a clone is recorded as a SaveTemplateRequest with unlink.
message CloneTemplateRequest {
  string template_id = 1;
  string name = 2;
  repeated Exercise exercises = 3;
}
message AddLibraryTemplatesResponse {
  GetHomeResponse home = 1;
}

// Weighted hard sets for one muscle over the rolling last 7 days.
// A completed working set counts 1.0 for the exercise's primary muscle
// and 0.5 for each secondary; warmups and cancelled sets count 0.
message MuscleVolume {
  MuscleGroup muscle = 1;
  float completed_sets_7d = 2;
  int32 target_low = 3; // 10
  int32 target_high = 4; // 20
}

message MuscleRecoveryStatus {
  MuscleGroup muscle = 9;
  int64 hours_remaining = 6; // hours until recovered (0 if recovered)
  bool recovered = 7;
  reserved 1, 2, 3, 4, 5, 8;
  reserved "muscle_key", "label", "last_trained_at", "recovered_at", "fraction", "in_next_workout";
}

message GetHomeRequest {
  // The time the user has for a workout; 0 = the default (60).
  int32 budget_minutes = 1;
}

message GetHomeResponse {
  repeated WorkoutTemplate templates = 1; // in user order
  string active_workout_id = 3;
  repeated MuscleVolume volume = 5;
  repeated MuscleRecoveryStatus recovery = 6;
  // A stateless suggestion from the rotation: the template whose
  // recovered muscles are furthest below the volume band, ties (within
  // 20% of the best) to the least recently started. Never a
  // gate: any template can be started. Empty when nothing is in rotation.
  string suggested_template_id = 7;
  SuggestionReason suggestion_reason = 13;
  bool onboarded = 9; // templates or workouts exist
  // Every exercise in the catalog, planned at the home's now on its own (a
  // workout of that one lift, in the budget).
  repeated ExercisePlan plans = 10;
  // Each template's lifts, planned at the home's now in the budget: exactly
  // what starting it then records.
  repeated TemplatePlan template_plans = 11;
  int32 budget_minutes = 12;
  // The rotation's shape, one pass through it: sets per muscle, what is
  // wrong with it, and what each workout outside it would add.
  RotationCheck rotation_check = 14;
  reserved 2, 4, 8, 15;
  reserved "trackers", "user_messages", "ignored_muscles";
}

// Why the suggestion is the template it is.
message SuggestionReason {
  // The suggested template's primary muscles that are recovered and below
  // the weekly band: what it scored on, most behind first.
  repeated SuggestionMuscle behind = 1;
  // Muscles the rotation trains that are below the band but still
  // recovering, so they scored nothing: most behind first.
  repeated RecoveringMuscle recovering = 2;
  // Nothing in rotation was both recovered and behind: the suggestion is
  // the rotation template started least recently.
  bool fallback = 3;
  // Every rotation template's first lift trains a muscle still
  // recovering: the suggestion is the one whose first lift's muscle
  // recovers soonest, and this is that muscle.
  RecoveringMuscle first_lift_recovering = 5;
  reserved 4;
  reserved "overdue";
}

message SuggestionMuscle {
  MuscleGroup muscle = 1;
  float sets_7d = 2; // weighted hard sets in the last 7 days
  int32 target = 3; // the band's floor (10)
}

message RecoveringMuscle {
  MuscleGroup muscle = 1;
  int32 hours_remaining = 2; // rounded up
}

// One pass through the rotation, each template once with three working
// sets a lift, counted the way Home counts the week (primary 1.0,
// secondary 0.5).
message RotationCheck {
  // One entry per muscle; completed_sets_7d holds the pass's sets.
  repeated MuscleVolume volume = 1;
  // Empty when nothing is wrong.
  repeated RotationWarning warnings = 2;
  // Each reserve (a template out of rotation) and each library entry the
  // user does not have whose lifts train first a muscle the pass trains
  // none of; the rest are not listed.
  repeated RotationAddition additions = 3;
}

// What one workout would add to the rotation.
message RotationAddition {
  // One of the two: the user's template, or the library entry.
  string template_id = 1;
  string library_id = 2;
  // The muscles, in Home's order.
  repeated MuscleGroup muscles = 3;
}

message RotationWarning {
  RotationWarningKind kind = 1;
  // GAP: every muscle nothing trains.
  repeated MuscleGroup muscles = 2;
  // OVERLAP: the two templates.
  repeated string template_ids = 3;
  // OVERLAP: lifts the two share, and the smaller template's count.
  int32 shared = 4;
  int32 of = 5;
}

enum RotationWarningKind {
  ROTATION_WARNING_KIND_UNSPECIFIED = 0;
  // A muscle nothing in rotation trains.
  ROTATION_WARNING_KIND_GAP = 1;
  // Two templates sharing over 70% of the smaller one's lifts.
  ROTATION_WARNING_KIND_OVERLAP = 2;
  reserved 3, 4;
  reserved "ROTATION_WARNING_KIND_LOPSIDED", "ROTATION_WARNING_KIND_TOO_FEW";
}

message TemplatePlan {
  string template_id = 1;
  repeated ExercisePlan plans = 2; // in the template's order
  // The workout's estimated length: more than the budget when two sets a
  // lift do not fit ("needs N min").
  int32 estimated_seconds = 3;
  // The longest it gets: the estimate with every lift whose sets are the
  // budget's to give at the most sets a lift takes (fixed sets as they
  // are). A budget at or past it buys nothing more.
  int32 max_seconds = 4;
}

// A list of lifts planned at now as one workout in the budget, as starting
// a template of them would plan it: the template editor's rows, saved or
// not.
message GetTemplatePlanRequest {
  repeated Exercise exercises = 1;
  int32 budget_minutes = 2; // 0 = the default (60)
}
message GetTemplatePlanResponse {
  // template_id empty.
  TemplatePlan plan = 1;
}

// Create when id is empty; update when it exists.
message SaveTemplateRequest {
  WorkoutTemplate template = 1;
  // The template becomes the user's own, whatever copy it stored. Set by
  // the caller to make a library template its own unchanged (Clone, saved),
  // and by the core when the save differs from the library's version of
  // now. Without it a save unlinks only when it differs from the stored
  // copy.
  bool unlink = 2;
}
message SaveTemplateResponse {
  WorkoutTemplate template = 1;
}

message DeleteTemplateRequest {
  string template_id = 1;
}
message DeleteTemplateResponse {}

// The user's order of their templates. With rotation_count, the list is
// also split there: the first rotation_count are in rotation, the rest
// reserves (the Manage sheet's drag between the rotation and the
// reserves). Without it, only the order changes.
message ReorderTemplatesRequest {
  repeated string template_ids = 1;
  optional int32 rotation_count = 2;
}
message ReorderTemplatesResponse {}

// The weight and reps (and optionally sets) the user sets by hand for one
// lift (the sheet in the template editor). It is converted to the max that
// prescribes it and is a new starting point: the plan carries on from it.
// Reps of 0 removes it.
message SetOverrideRequest {
  Exercise exercise = 1;
  float weight = 2; // lb
  int32 reps = 3;
  // Kept as they are by the time budget.
  optional int32 sets = 4;
}
message SetOverrideResponse {
  ExercisePlan plan = 1;
}

// Finishes setup: saves the unit, records the starting weights of the main
// lifts, and copies the chosen library templates. Only the unit changes
// when templates already exist.
message CompleteOnboardingRequest {
  WeightUnit unit = 3;
  // The library entries to copy in. Empty means the library's defaults.
  repeated string library_ids = 5;
  // Chick to gorilla, 0..1, from the setup slider: picks the starting
  // weights (the bar at 0, 315 lb squat / 225 lb bench at 1). Unset keeps
  // the catalog's openers.
  optional float strength = 6;
  // The entries as the library had them, filled in by the core when the
  // event is recorded (see AddLibraryTemplatesRequest.entries).
  repeated LibraryTemplate library_entries = 7;
  // The starting weights `strength` picks, filled in by the core when the
  // event is recorded. A lift never done calibrates from 60% of its own.
  repeated ExerciseWeight starting_weights = 8;
  reserved 1, 2, 4;
  reserved "body_weight_kg", "experience", "gender";
}

// The starting weights the setup slider shows: one step per 1% of the
// slider, chick (0) to gorilla (100), in the unit asked for. Onboarding
// with `strength` = step / 100 records exactly these.
message GetStartingWeightsRequest {
  WeightUnit unit = 1;
}
message ExerciseWeight {
  Exercise exercise = 1;
  float weight_lb = 2;
}
message StartingWeightsStep {
  repeated ExerciseWeight weights = 1;
}
message GetStartingWeightsResponse {
  repeated StartingWeightsStep steps = 1;
}

message CompleteOnboardingResponse {
  GetHomeResponse home = 1;
}

message GetActiveWorkoutRequest {}

message GetActiveWorkoutResponse {
  Workout workout = 1;
}

message WorkoutHeartRatePoint {
  int64 sampled_at = 1; // Unix milliseconds
  float bpm = 2;
  int32 availability = 3;
}

message AppendWorkoutHeartRateRequest {
  string workout_id = 1;
  repeated WorkoutHeartRatePoint samples = 2;
}

message AppendWorkoutHeartRateResponse {
  int32 stored = 1;
}

message GetWorkoutHeartRateRequest {
  string workout_id = 1;
}

message GetWorkoutHeartRateResponse {
  repeated WorkoutHeartRatePoint samples = 1;
}

// The multiplayer session a workout is being trained in, as the server said
// when the phone heard (joining mid-workout included): what "trained with"
// on its summary reads.
message SetWorkoutSessionRequest {
  string workout_id = 1;
  string session_id = 2;
}

message WorkoutMutation {
  oneof mutation {
    CompleteSetRequest complete_set = 11;
    DeleteCompletedSetRequest delete_completed_set = 13;
    EndWorkoutRequest end_workout = 14;
    AddExercisesRequest add_exercises = 17;
    AdjustExerciseWeightRequest adjust_exercise_weight = 18;
    RemoveExerciseRequest remove_exercise = 19;
    ReorderExercisesRequest reorder_exercises = 20;
    EditCompletedSetRequest edit_completed_set = 23;
    StartSetRequest start_set = 24;
    SkipWarmupsRequest skip_warmups = 25;
    SetWorkoutSessionRequest set_session = 26;
    AnswerRungRequest answer_rung = 27;
  }
  reserved 1, 2, 10, 12, 15, 16, 21, 22;
  reserved "event_id", "client_created_at", "skip_rest", "cancel_proposed_set", "rate_exercise";
}

message AppendWorkoutMutationsRequest {
  repeated WorkoutMutation mutations = 1;
}

message AppendWorkoutMutationsResponse {
  GetWorkoutResponse workout_state = 2;
  reserved 1;
  reserved "applied_event_ids";
}

// --- Service Definition ---

// What the server answers about workouts: reads for the web, from the
// account the phone syncs. Every write is an Event (account.proto), made on
// the phone by the core and synced.
service WorkoutService {
  // Finished workouts with their summaries (history).
  rpc ListWorkoutSummaries(ListWorkoutSummariesRequest) returns (ListWorkoutSummariesResponse);
  // Per-exercise progress series, everything precomputed.
  rpc GetExerciseProgress(GetExerciseProgressRequest) returns (GetExerciseProgressResponse);
}

message GetUserRequest {
  reserved 1;
  reserved "user_id";
}

message GetUserResponse {
  User user = 1;
}

message UpdateMyProfileRequest {
  string profile_emoji = 1;
  string profile_color_hex = 2;
  float body_weight_kg = 3; // 0 = unchanged
}

message UpdateMyProfileResponse {
  User user = 1;
}

service UserService {
  // The authenticated user.
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  // Update the authenticated user's profile metadata.
  rpc UpdateMyProfile(UpdateMyProfileRequest) returns (UpdateMyProfileResponse);
}
