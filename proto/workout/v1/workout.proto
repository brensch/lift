syntax = "proto3";
package workout.v1;

import "workout/v1/settings.proto";

// --- Data Structures ---

enum MuscleGroup {
  MUSCLE_GROUP_UNSPECIFIED = 0;
  MUSCLE_GROUP_QUADS = 1;
  MUSCLE_GROUP_HAMSTRINGS = 2;
  MUSCLE_GROUP_GLUTES = 3;
  MUSCLE_GROUP_CHEST = 4;
  MUSCLE_GROUP_BACK = 5;
  MUSCLE_GROUP_SHOULDERS = 6;
  MUSCLE_GROUP_BICEPS = 7;
  MUSCLE_GROUP_TRICEPS = 8;
}

enum ExerciseCategory {
  EXERCISE_CATEGORY_UNSPECIFIED = 0;
  EXERCISE_CATEGORY_COMPOUND = 1;
  EXERCISE_CATEGORY_AUXILIARY = 2;
}

message User {
  string id = 1;
  string name = 2;
  int64 created_at = 3; // Unix timestamp
  string profile_emoji = 4;
  string profile_color_hex = 5;
  float body_weight_kg = 6; // 0 = not set
}

message Workout {
  string id = 1;
  string name = 2;
  int64 start_time = 3;
  int64 end_time = 4;
  string session_id = 5;
}

enum Exercise {
  EXERCISE_UNSPECIFIED = 0;
  EXERCISE_SQUAT = 1;
  EXERCISE_BENCH_PRESS = 2;
  EXERCISE_DEADLIFT = 3;
  EXERCISE_OVERHEAD_PRESS = 4;
  EXERCISE_BARBELL_ROW = 5;
  EXERCISE_HIP_THRUST = 6;
  EXERCISE_BULGARIAN_SPLIT_SQUAT = 7;
  EXERCISE_ROMANIAN_DEADLIFT = 8;
  EXERCISE_GLUTE_BRIDGE = 9;
  EXERCISE_LUNGE = 10;
  EXERCISE_LEG_CURL = 11;
}

message ExerciseTypeConfig {
  Exercise exercise = 1;
  float start_weight = 2;   // first working set weight
  float end_weight = 3;     // last working set weight (equal=flat, lower=drop, higher=ramp)
  int32 reps = 4;
  bool include_warmup = 5;
  RestConfig rest_config = 6;
  bool last_set_amrap = 7;  // regime sets this; the last working set becomes AMRAP
  repeated WorkingSetSpec working_sets = 8; // optional explicit working-set prescription
}

message WorkingSetSpec {
  float target_weight = 1;
  int32 target_reps = 2;
  bool is_amrap = 3;
  string instruction = 4;
  ProgressionHint progression_hint = 5;
}

message RestConfig {
  int32 rest_after_success = 1;
  int32 rest_after_failure = 2;
  int32 rest_after_warmup = 3;
  int32 rest_after_last_warmup = 4;
}

message ExerciseGroup {
  string id = 1;
  string workout_id = 2;
  string name = 3;
  int32 sets = 4;                // working sets per exercise
  bool interleave_warmups = 5;   // true=alternate warmups between exercises
  int32 workout_order = 6;
  repeated ExerciseTypeConfig exercise_configs = 7;
  RestConfig rest_config = 8;
  string instruction = 9;        // regime coaching note, e.g. "T1 — max effort" (not persisted to DB)
  bool prescribed_by_regime = 10; // immutable in UI once created from a regime suggestion
}

message ProposedSet {
  string id = 1;
  string workout_id = 2;
  int32 workout_order = 3;
  Exercise exercise = 4;
  int32 target_reps = 5;
  float target_weight = 6;
  bool warmup = 7;
  string exercise_group_id = 8;
  int32 rest_after_success = 9;
  int32 rest_after_failure = 10;
  bool cancelled = 11;
  bool is_amrap = 12;           // do as many reps as possible (target_reps is the minimum)
  string instruction = 13;      // optional per-set note shown in the UI
  ProgressionHint progression_hint = 14;
}

message CompletedSet {
  string id = 1;
  string workout_id = 2;
  string proposed_set_id = 3;
  int32 actual_reps = 4;
  float actual_weight = 5;
  int64 started_at = 6;
  int64 ended_at = 7;
  int64 rest_until = 8;
}

enum UserMessageKind {
  USER_MESSAGE_KIND_UNSPECIFIED = 0;
  USER_MESSAGE_KIND_COACHING_NOTE = 1;
  USER_MESSAGE_KIND_GROUP_RATIONALE = 2;
  USER_MESSAGE_KIND_LOAD_INCREASE = 3;
  USER_MESSAGE_KIND_LOAD_HOLD = 4;
  USER_MESSAGE_KIND_STALL_DELOAD = 5;
  USER_MESSAGE_KIND_TEMPORAL_DELOAD = 6;
  USER_MESSAGE_KIND_SESSION_UPDATE = 7;
  USER_MESSAGE_KIND_CYCLE_ADVANCE = 8;
}

enum UserMessageSurface {
  USER_MESSAGE_SURFACE_UNSPECIFIED = 0;
  USER_MESSAGE_SURFACE_SCHEDULE = 1;
  USER_MESSAGE_SURFACE_WORKOUT_BRIEFING = 2;
  USER_MESSAGE_SURFACE_WORKOUT_FEED = 3;
}

enum ProgressionChangeKind {
  PROGRESSION_CHANGE_KIND_UNSPECIFIED = 0;
  PROGRESSION_CHANGE_KIND_INCREASE = 1;
  PROGRESSION_CHANGE_KIND_HOLD = 2;
  PROGRESSION_CHANGE_KIND_DELOAD = 3;
  PROGRESSION_CHANGE_KIND_CYCLE_ADVANCE = 4;
}

enum ProgressionMetricKind {
  PROGRESSION_METRIC_KIND_UNSPECIFIED = 0;
  PROGRESSION_METRIC_KIND_WORKING_WEIGHT = 1;
  PROGRESSION_METRIC_KIND_TRAINING_MAX = 2;
}

message ProgressionDetails {
  ProgressionChangeKind change_kind = 1;
  ProgressionMetricKind metric_kind = 2;
  float previous_weight = 3;
  float next_weight = 4;
  string previous_stage = 5;
  string next_stage = 6;
  string source_workout_id = 7;
  string context_label = 8;
}

message UserMessageDetails {
  oneof detail {
    ProgressionDetails progression = 1;
  }
}

message UserMessage {
  string message_key = 1;
  UserMessageKind kind = 2;
  UserMessageSurface surface = 3;
  string title = 4;
  string body = 5;
  bool dismissible = 6;
  int64 created_at = 7;
  int64 updated_at = 8;
  string workout_id = 9;
  string exercise_group_id = 10;
  Exercise exercise = 11;
  string slot_key = 12;
  reserved 13;
  reserved "metadata_json";
  UserMessageDetails details = 14;
}

// --- RPC Requests/Responses ---

message StartWorkoutRequest {
  string name = 1;
  repeated ExerciseGroup exercise_groups = 2;
  int64 started_at = 3; // Unix seconds; if 0, server uses current time
}
message StartWorkoutResponse {
  string id = 1;
  Workout workout = 2;
  repeated ExerciseGroup exercise_groups = 3;
  repeated ProposedSet proposed_sets = 4;
  repeated CompletedSet completed_sets = 5;
  ProposedSet next_up_set = 6;
  WorkoutStateSnapshot state_snapshot = 7;
  repeated UserMessage user_messages = 8;
}

message GetWorkoutRequest {
  string workout_id = 1;
}
message GetWorkoutResponse {
  Workout workout = 1;
  repeated ExerciseGroup exercise_groups = 2;
  repeated ProposedSet proposed_sets = 3;
  repeated CompletedSet completed_sets = 4;
  ProposedSet next_up_set = 5;
  WorkoutPlanChangeStats plan_change_stats = 6;
  WorkoutStateSnapshot state_snapshot = 7;
  repeated UserMessage user_messages = 8;
}

message WorkoutPlanChangeStats {
  int32 cancelled_total = 1;
  int32 cancelled_warmups = 2;
  int32 cancelled_working = 3;
}

enum WorkoutState {
  WORKOUT_STATE_UNSPECIFIED = 0;
  WORKOUT_STATE_ALL_DONE = 1;
  WORKOUT_STATE_LIFTING = 2;
  WORKOUT_STATE_RESTING = 3;
  WORKOUT_STATE_READY = 5;
}

message WorkoutStateSnapshot {
  WorkoutState state = 1;
  ProposedSet display_set = 2;
  int64 active_started_at = 3;
  int64 rest_until = 4;
  int64 last_rest_end = 5;
}

message ListWorkoutsRequest {}

message ListWorkoutsResponse {
  repeated Workout workouts = 1;
}

message PlannedGroupSet {
  Exercise exercise = 1;
  int32 target_reps = 2;
  float target_weight = 3;
  bool warmup = 4;
  int32 rest_after_success = 5;
  int32 rest_after_failure = 6;
  bool is_amrap = 7;
  string instruction = 8;
  ProgressionHint progression_hint = 9;
  string client_set_id = 10;
}

enum ProgressionRule {
  PROGRESSION_RULE_UNSPECIFIED = 0;
  PROGRESSION_RULE_NONE = 1;
  PROGRESSION_RULE_ALL_SETS_MATCH_TARGET = 2;
  PROGRESSION_RULE_TOP_SET_AMRAP = 3;
}

message ProgressionHint {
  string slot_key = 1;
  string tier = 2;
  ProgressionRule rule = 3;
  int32 amrap_success_threshold = 4;
  bool counts_toward_program = 5;
}

message ReplaceExerciseGroupPlanRequest {
  string workout_id = 1;
  string exercise_group_id = 2; // empty = create new group
  string name = 3;
  bool interleave_warmups = 4;
  repeated PlannedGroupSet sets = 5; // explicit set order from frontend
  RestConfig rest_config = 6;        // optional group-level metadata
  bool delete_group_if_empty = 7;    // if true and sets empty, remove the group
  string instruction = 8;
  bool create_if_missing = 9;        // if true and exercise_group_id is unknown, create with that id
}

message ReplaceExerciseGroupPlanResponse {
  ExerciseGroup group = 1;
  repeated ProposedSet generated_sets = 2;
  ProposedSet next_up_set = 3;
  WorkoutStateSnapshot state_snapshot = 4;
}

message CreateExerciseGroupRequest {

  string workout_id = 1;

  string name = 2;

  int32 sets = 3;

  bool interleave_warmups = 4;

  repeated ExerciseTypeConfig exercise_configs = 5;

  RestConfig rest_config = 6;

}



message CreateExerciseGroupResponse {

  ExerciseGroup group = 1;

  repeated ProposedSet generated_sets = 2;

  ProposedSet next_up_set = 3;

  WorkoutStateSnapshot state_snapshot = 4;

}



message StartSetRequest {

  string workout_id = 1;

  string proposed_set_id = 2;

  int64 started_at = 3; // Unix seconds; if 0, server uses current time

}

message StartSetResponse {

  CompletedSet completed_set = 1;

  ProposedSet next_up_set = 2;

  WorkoutStateSnapshot state_snapshot = 3;

  repeated UserMessage user_messages = 4;

}



message CompleteSetRequest {

  string workout_id = 1;

  string proposed_set_id = 2;

  int32 actual_reps = 3;

  float actual_weight = 4;

  int64 completed_at = 5; // Unix seconds; if 0, server uses current time

}

message CompleteSetResponse {

  CompletedSet completed_set = 1;

  ProposedSet next_up_set = 2;

  WorkoutStateSnapshot state_snapshot = 3;

  repeated UserMessage user_messages = 4;

}



message DeleteCompletedSetRequest {

  string workout_id = 1;

  string completed_set_id = 2;

}

message DeleteCompletedSetResponse {
  ProposedSet next_up_set = 1;
  WorkoutStateSnapshot state_snapshot = 2;
  repeated UserMessage user_messages = 3;
}

message CancelProposedSetRequest {
  string workout_id = 1;
  string proposed_set_id = 2;
}

message CancelProposedSetResponse {
  ProposedSet next_up_set = 1;
  WorkoutStateSnapshot state_snapshot = 2;
  repeated UserMessage user_messages = 3;
}



message EndWorkoutRequest {

  string workout_id = 1;

  int64 ended_at = 2; // Unix seconds; if 0, server uses current time

}

message EndWorkoutResponse {

  Workout workout = 1;

  repeated UserMessage user_messages = 2;

}



message GetProposedWorkoutScheduleRequest {
  string user_id = 1;
  int64 at_time = 2; // Unix seconds; if 0, server uses current time (for testing)
}



message ExerciseStatus {

  Exercise exercise = 1;

  float target_weight = 2;

  int64 last_performed_at = 3;

  repeated float weight_history = 4;

  repeated MuscleGroup muscle_groups = 5;

  int32 default_sets = 6;

  int32 default_reps = 7;

  bool recovered = 8;

  bool always_include = 9;

  ExerciseCategory category = 10;

}



message ProposedExerciseGroup {

  string name = 1;

  int32 sets = 2;

  bool interleave_warmups = 3;

  repeated ExerciseTypeConfig exercise_configs = 4;

  RestConfig rest_config = 5;

  repeated string tags = 6;

  bool prescribed_by_regime = 7;

}



message SlotTrainingStatus {
  string slot_key = 1;
  string label = 2;
  string tier = 3;
  int64 last_trained_at = 4;
  int32 days_since_last_trained = 5;
  int32 target_sets_per_7_days = 6;
  int32 completed_sets_per_7_days = 7;
  int32 remaining_sets_per_7_days = 8;
  bool appears_in_next_workout = 9;
  string status_label = 10;
}

message TrainingStatus {
  int64 next_session_at = 1;    // Unix timestamp for the regime-recommended next workout
  int64 last_session_at = 2;    // When the last workout ended (0 if never)
  string headline = 3;          // e.g. "Train today", "Next lift window in 14h"
  string detail = 4;            // e.g. "1 of 3 sessions done in the last 7 days"
  bool should_train_now = 5;    // true if now >= next_session_at
  int32 target_sessions_per_7_days = 6;
  int32 completed_sessions_per_7_days = 7;
  int32 remaining_sessions_per_7_days = 8;
  int32 target_sets_per_7_days = 9;
  int32 completed_sets_per_7_days = 10;
  int32 remaining_sets_per_7_days = 11;
  repeated SlotTrainingStatus slot_statuses = 12;
}

message RegimeContext {
  string regime_display_name = 1;   // e.g. "Wendler 5/3/1"
  string session_description = 2;   // e.g. "Cycle 1, Week 2 — Intensity Week"
  string next_session_preview = 3;  // e.g. "Next: Week 3 — Peak Week (1-rep sets)"
}

message GetProposedWorkoutScheduleResponse {

  repeated ExerciseStatus exercise_statuses = 1;

  string active_workout_id = 2;

  repeated ProposedExerciseGroup proposed_groups = 3;

  RegimeContext regime_context = 4;

  TrainingStatus training_status = 5;

  string suggested_workout_name = 6; // regime-generated name, e.g. "5/3/1 — Cycle 2, Week 3 Peak"

  WorkoutDraft draft = 7;

  repeated ExerciseGroup saved_exercise_groups = 8;

  repeated UserMessage user_messages = 9;

}

message SaveProfileExerciseGroupRequest {
  ExerciseGroup group = 1;
}

message SaveProfileExerciseGroupResponse {
  ExerciseGroup group = 1;
}

message DeleteProfileExerciseGroupRequest {
  string group_id = 1;
}

message DeleteProfileExerciseGroupResponse {}

message WorkoutDraft {
  string name = 1;
  repeated ExerciseGroup exercise_groups = 2;
  int64 updated_at = 3;
}

message SaveWorkoutDraftRequest {
  WorkoutDraft draft = 1;
}

message SaveWorkoutDraftResponse {
  WorkoutDraft draft = 1;
}

message ClearWorkoutDraftRequest {}

message ClearWorkoutDraftResponse {}



message GetActiveWorkoutRequest {}

message GetActiveWorkoutResponse {

  Workout workout = 1;

}



message UpdateExerciseGroupRequest {

  string workout_id = 1;

  string exercise_group_id = 2;

  string name = 3;

  int32 sets = 4;

  bool interleave_warmups = 5;

  repeated ExerciseTypeConfig exercise_configs = 6;

  RestConfig rest_config = 7;

}

message UpdateExerciseGroupResponse {
  ExerciseGroup group = 1;
  repeated ProposedSet generated_sets = 2;
  ProposedSet next_up_set = 3;
  WorkoutStateSnapshot state_snapshot = 4;
  repeated UserMessage user_messages = 5;
}

message DeleteExerciseGroupRequest {
  string workout_id = 1;
  string exercise_group_id = 2;
}

message DeleteExerciseGroupResponse {
  ProposedSet next_up_set = 1;
  WorkoutStateSnapshot state_snapshot = 2;
  repeated UserMessage user_messages = 3;
}

message ReorderExerciseGroupsRequest {
  string workout_id = 1;
  repeated string exercise_group_ids = 2;
}

message ReorderExerciseGroupsResponse {
  ProposedSet next_up_set = 1;
  WorkoutStateSnapshot state_snapshot = 2;
  repeated UserMessage user_messages = 3;
}

message WorkoutHeartRatePoint {
  int64 sampled_at = 1; // Unix milliseconds
  float bpm = 2;
  int32 availability = 3;
}

message AppendWorkoutHeartRateRequest {
  string workout_id = 1;
  repeated WorkoutHeartRatePoint samples = 2;
}

message AppendWorkoutHeartRateResponse {
  int32 stored = 1;
}

message GetWorkoutHeartRateRequest {
  string workout_id = 1;
}

message GetWorkoutHeartRateResponse {
  repeated WorkoutHeartRatePoint samples = 1;
}

message WorkoutMutation {
  string event_id = 1;
  int64 client_created_at = 2; // Unix seconds from client clock
  oneof mutation {
    StartSetRequest start_set = 10;
    CompleteSetRequest complete_set = 11;
    CancelProposedSetRequest cancel_proposed_set = 12;
    DeleteCompletedSetRequest delete_completed_set = 13;
    EndWorkoutRequest end_workout = 14;
    ReplaceExerciseGroupPlanRequest replace_exercise_group_plan = 15;
    ReorderExerciseGroupsRequest reorder_exercise_groups = 16;
  }
}

message AppendWorkoutMutationsRequest {
  repeated WorkoutMutation mutations = 1;
}

message AppendWorkoutMutationsResponse {
  repeated string applied_event_ids = 1;
  GetWorkoutResponse workout_state = 2;
}

message DismissUserMessagesRequest {
  repeated string message_keys = 1;
}

message DismissUserMessagesResponse {
  repeated string dismissed_message_keys = 1;
}

message RehydrateWorkoutFromEventsRequest {
  string workout_id = 1;
  bool persist = 2; // if true, overwrite current workout tables with rebuilt state
}

message RehydrateWorkoutFromEventsResponse {
  GetWorkoutResponse workout_state = 1;
  int32 applied_event_count = 2;
}

// --- Service Definition ---

service WorkoutService {
  rpc StartWorkout(StartWorkoutRequest) returns (StartWorkoutResponse);
  rpc EndWorkout(EndWorkoutRequest) returns (EndWorkoutResponse);
  rpc GetWorkout(GetWorkoutRequest) returns (GetWorkoutResponse);
  rpc GetActiveWorkout(GetActiveWorkoutRequest) returns (GetActiveWorkoutResponse);

  // List all workouts for the user (user from auth context)
  rpc ListWorkouts(ListWorkoutsRequest) returns (ListWorkoutsResponse);

  rpc ReplaceExerciseGroupPlan(ReplaceExerciseGroupPlanRequest) returns (ReplaceExerciseGroupPlanResponse);
  rpc ReorderExerciseGroups(ReorderExerciseGroupsRequest) returns (ReorderExerciseGroupsResponse);

  rpc StartSet(StartSetRequest) returns (StartSetResponse);
  rpc CompleteSet(CompleteSetRequest) returns (CompleteSetResponse);
  rpc DeleteCompletedSet(DeleteCompletedSetRequest) returns (DeleteCompletedSetResponse);
  rpc CancelProposedSet(CancelProposedSetRequest) returns (CancelProposedSetResponse);
  rpc AppendWorkoutMutations(AppendWorkoutMutationsRequest) returns (AppendWorkoutMutationsResponse);
  rpc RehydrateWorkoutFromEvents(RehydrateWorkoutFromEventsRequest) returns (RehydrateWorkoutFromEventsResponse);
  rpc AppendWorkoutHeartRate(AppendWorkoutHeartRateRequest) returns (AppendWorkoutHeartRateResponse);
  rpc GetWorkoutHeartRate(GetWorkoutHeartRateRequest) returns (GetWorkoutHeartRateResponse);

  // Get the next scheduled workouts for the user according to preferences and weight progression etc
  rpc GetProposedWorkoutSchedule(GetProposedWorkoutScheduleRequest) returns (GetProposedWorkoutScheduleResponse);
  rpc DismissUserMessages(DismissUserMessagesRequest) returns (DismissUserMessagesResponse);
  rpc SaveWorkoutDraft(SaveWorkoutDraftRequest) returns (SaveWorkoutDraftResponse);
  rpc ClearWorkoutDraft(ClearWorkoutDraftRequest) returns (ClearWorkoutDraftResponse);
  rpc SaveProfileExerciseGroup(SaveProfileExerciseGroupRequest) returns (SaveProfileExerciseGroupResponse);
  rpc DeleteProfileExerciseGroup(DeleteProfileExerciseGroupRequest) returns (DeleteProfileExerciseGroupResponse);
}

message CreateUserRequest {
  string name = 1;
}

message CreateUserResponse {
  User user = 1;
}

message GetUserRequest {
  string user_id = 1;
}

message GetUserResponse {
  User user = 1;
}

message UpdateMyProfileRequest {
  string profile_emoji = 1;
  string profile_color_hex = 2;
  float body_weight_kg = 3; // 0 = unchanged
}

message UpdateMyProfileResponse {
  User user = 1;
}

service UserService {
  // Create a new user
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  // Get user by ID
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  // Update the authenticated user's profile metadata.
  rpc UpdateMyProfile(UpdateMyProfileRequest) returns (UpdateMyProfileResponse);
}
