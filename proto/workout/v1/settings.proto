syntax = "proto3";
package workout.v1;

// The 10-muscle taxonomy. Volume, recovery and the exercise catalog all
// use this one list — there is no second muscle grouping anywhere.
enum MuscleGroup {
  MUSCLE_GROUP_UNSPECIFIED = 0;
  MUSCLE_GROUP_QUADS = 1;
  MUSCLE_GROUP_HAMSTRINGS = 2;
  MUSCLE_GROUP_GLUTES = 3;
  MUSCLE_GROUP_CHEST = 4;
  MUSCLE_GROUP_BACK = 5;
  MUSCLE_GROUP_SHOULDERS = 6;
  MUSCLE_GROUP_BICEPS = 7;
  MUSCLE_GROUP_TRICEPS = 8;
  MUSCLE_GROUP_CALVES = 9;
  MUSCLE_GROUP_CORE = 10;
}

// ─── Plate colors ─────────────────────────────────────────────────────────────

message PlateColor {
  float weight_kg = 1;
  string hex_color = 2;
}

message PlateColorsConfig {
  repeated PlateColor plates = 1;
  float bar_weight_kg = 2;
}

enum WeightUnit {
  WEIGHT_UNIT_UNSPECIFIED = 0;
  WEIGHT_UNIT_LB = 1;
  WEIGHT_UNIT_KG = 2;
}

message WeightUnitConfig {
  WeightUnit unit = 1;
}

// ─── User settings ────────────────────────────────────────────────────────────

message UserSetting {
  oneof setting {
    PlateColorsConfig plate_colors = 10;
    WeightUnitConfig weight_unit = 12;
    // field 11 reserved (was workout_config)
  }
  reserved 13;
  reserved "ignored_muscles";
}

message UpdateSettingRequest {
  UserSetting setting = 1;
}

message UpdateSettingResponse {}

message GetSettingsRequest {}

message GetSettingsResponse {
  repeated UserSetting settings = 1;
}

// ─── Service ──────────────────────────────────────────────────────────────────

service SettingsService {
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
}
