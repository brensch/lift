# The template library: the workouts everyone can pick from. New users tick
# the ones they want during setup (the `default: true` ones start ticked),
# and anyone can add more later from the Add chip on the home screen.
# Adding one copies it into the user's program, where they can rename it,
# reorder it or change its exercises without touching this file.
#
# The core embeds this file at build time (core/src/template_library.rs),
# and the website's /routines page is rendered from it. Exercises are keys
# of the built-in program (core/programs/default.json); `cargo test` fails
# on an unknown one. Ids are stable keys: a copy remembers which entry it
# came from, so rename names and blurbs freely but never ids.
#
# A template is only an ordered list of exercises. Sets, reps, rest and
# weight come from each exercise's progression in the user's program, so
# "5×5" here is a name, not a rule the app enforces.

groups:
  - key: programs
    label: Programs
  - key: splits
    label: Splits
  - key: parts
    label: Body parts
  - key: gear
    label: By equipment

templates:
  - id: stronglifts_a
    default: true
    name: StrongLifts A
    group: programs
    blurb: Squat, row, bench. The famous one.
    exercises: [squat, barbell_row, bench_press]
  - id: stronglifts_b
    default: true
    name: StrongLifts B
    group: programs
    blurb: Squat, press, deadlift. Alternate with A.
    exercises: [squat, overhead_press, deadlift]
  - id: big_three
    name: Big Three
    group: programs
    blurb: Squat, bench, deadlift. Nothing else, no excuses.
    exercises: [squat, bench_press, deadlift]

  - id: full_body
    name: Full Body
    group: splits
    blurb: Everything, once, in under an hour.
    exercises: [squat, bench_press, barbell_row, dumbbell_shoulder_press, barbell_curl]
  - id: upper
    name: Upper
    group: splits
    blurb: Half of an upper/lower split.
    exercises: [bench_press, barbell_row, overhead_press, chin_up, skull_crusher]
  - id: lower
    name: Lower
    group: splits
    blurb: The other half.
    exercises: [squat, romanian_deadlift, hip_thrust, calf_raise, crunch]
  - id: push
    name: Push
    group: splits
    blurb: Chest, shoulders, triceps.
    exercises: [bench_press, overhead_press, incline_dumbbell_press, lateral_raise, skull_crusher]
  - id: pull
    name: Pull
    group: splits
    blurb: Back and biceps.
    exercises: [barbell_row, pull_up, dumbbell_row, rear_delt_fly, barbell_curl]
  - id: legs
    name: Legs
    group: splits
    blurb: Don't skip it.
    exercises: [squat, romanian_deadlift, lunge, calf_raise, hanging_leg_raise]

  - id: butt_stuff
    name: Butt Stuff
    group: parts
    blurb: Hip thrust, hinge, split squat, abduction. Every glute, no filler.
    exercises: [hip_thrust, romanian_deadlift, bulgarian_split_squat, hip_abduction]
  - id: arms
    name: Arms
    group: parts
    blurb: Biceps, triceps, the mirror.
    exercises: [barbell_curl, skull_crusher, hammer_curl, tricep_pushdown, preacher_curl, overhead_tricep_extension]
  - id: chest
    name: Chest
    group: parts
    blurb: It's Monday somewhere.
    exercises: [bench_press, incline_dumbbell_press, cable_fly, chest_dip]
  - id: back
    name: Back
    group: parts
    blurb: Deadlifts, pull-ups, rows.
    exercises: [deadlift, pull_up, t_bar_row, face_pull, shrug]
  - id: shoulders
    name: Shoulders
    group: parts
    blurb: Press, then raise in every direction.
    exercises: [overhead_press, arnold_press, lateral_raise, rear_delt_fly]
  - id: core
    name: Core
    group: parts
    blurb: Abs and everything holding you upright.
    exercises: [hanging_leg_raise, cable_crunch, ab_wheel_rollout, russian_twist]

  - id: dumbbells_only
    name: Dumbbells Only
    group: gear
    blurb: Full body from a rack of dumbbells.
    exercises: [goblet_squat, dumbbell_bench_press, dumbbell_row, dumbbell_shoulder_press, lunge, dumbbell_curl]
  - id: bodyweight
    name: Bodyweight
    group: gear
    blurb: No gym, no problem, no excuses.
    exercises: [push_up, pull_up, lunge, glute_bridge, hanging_leg_raise]
  - id: machines_only
    name: Machines Only
    group: gear
    blurb: Pins and stacks. Busy-gym proof.
    exercises: [leg_press, machine_chest_press, lat_pulldown, leg_extension, leg_curl, seated_calf_raise]

# Ready-made rotations: the Manage sheet's one-tap plans. Applying one
# makes its templates the rotation in this order (adding any the user
# doesn't have, using the user's own copy when there is one) and moves the
# rest to the reserves. `templates` are ids from above; `cargo
# test` fails on an unknown one. Ids are stable keys.
plans:
  - id: stronglifts
    name: StrongLifts
    blurb: A, then B, then A. Three days a week, forever.
    templates: [stronglifts_a, stronglifts_b]
  - id: upper_lower
    name: Upper / Lower
    blurb: Top half one day, bottom half the next.
    templates: [upper, lower]
  - id: push_pull_legs
    name: Push / Pull / Legs
    blurb: Three days, three jobs.
    templates: [push, pull, legs]
  - id: full_body
    name: Full Body
    blurb: One workout. Do it again.
    templates: [full_body]
