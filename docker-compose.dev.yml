services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: backend
    volumes:
      - .:/app
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/app/target
    command: cargo watch -x "run --bin lift"
    environment:
      - RUST_LOG=info
    ports:
      - "50051:50051"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: frontend
    volumes:
      - .:/app
      # Avoid overwriting container's node_modules with host's if they differ, 
      # but here we probably want to sync them or just install inside.
      # Simple approach: mount everything.
    working_dir: /app/web
    command: /bin/sh -c "bun install && bun run dev"
    environment:
      - PORT=5173
    depends_on:
      - backend

  proxy:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend

volumes:
  cargo-cache:
  target-cache:
